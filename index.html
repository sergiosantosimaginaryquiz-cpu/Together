<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Together</title>
<meta name="description" content="Everything we need to do, together." />
<meta name="theme-color" content="#F5F5F7" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="apple-mobile-web-app-title" content="Together" />
<style>
:root{
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --surface-2:#FBFBFD;
  --fill:#E5E5EA;
  --text:#1D1D1F;
  --text2:#6E6E73;
  --text3:#86868B;
  --nude:#AF52DE;
  --beige:#FF2D55;
  --olive:#34C759;
  --terracotta:#FF9500;
  --brown:#5856D6;
  --grey:#86868B;
  --line:rgba(0,0,0,.09);
  --danger:#FF3B30;
  --accent:#0071E3;
  --system-blue:#007AFF;

  --r-sm:10px;
  --r-md:16px;
  --r-lg:22px;
  --r-xl:28px;
  --r-pill:999px;

  --sp-xs:4px;
  --sp-sm:8px;
  --sp-md:16px;
  --sp-lg:24px;
  --sp-xl:32px;
  --sp-2xl:48px;

  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.07);
  --shadow-lg:0 4px 8px rgba(0,0,0,.06), 0 16px 40px rgba(0,0,0,.10);
  --shadow:var(--shadow-md);

  --dur-fast:120ms;
  --dur-normal:200ms;
  --dur-slow:320ms;
  --ease-standard:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --ease-in:cubic-bezier(0.4,0,1,1);
  --ease-spring:cubic-bezier(0.34,1.32,0.64,1);

  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}

:root[data-theme="dark"]{
  --bg:#000000;
  --surface:#1D1D1F;
  --surface-2:#242426;
  --fill:#2C2C2E;
  --text:#FFFFFF;
  --text2:#98989D;
  --text3:#6E6E73;
  --line:rgba(255,255,255,.14);
  --accent:#007AFF;

  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 4px 8px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.5);
  --shadow:var(--shadow-md);
}
:root[data-theme="dark"] .check{background:var(--surface-2);}
:root[data-theme="dark"] .onb-logo{box-shadow:none;}
/* A little more intentional than "inverted colors": subtle card edges for
   definition (shadows barely read on true black), a glowing accent on the
   FAB and today-indicators, and richer depth between surface levels. */
:root[data-theme="dark"] .card{border:1px solid rgba(255,255,255,.06);}
:root[data-theme="dark"] .fab{box-shadow:0 0 0 1px rgba(0,122,255,.4), 0 8px 28px rgba(0,122,255,.45), 0 0 40px rgba(0,122,255,.18);}
:root[data-theme="dark"] .nav-item.active svg{filter:drop-shadow(0 0 6px rgba(0,122,255,.55));}
:root[data-theme="dark"] .week-day.active{box-shadow:0 0 16px rgba(0,122,255,.35);}
:root[data-theme="dark"] .bottom-nav{background:rgba(20,20,22,.72); border-top:1px solid rgba(255,255,255,.08);}
:root[data-theme="dark"] .sheet, :root[data-theme="dark"] .fullscreen{background:var(--surface-2);}
:root[data-theme="dark"] .fin-hero{background:linear-gradient(160deg, var(--surface-2), var(--surface));}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button, input, textarea, select{font-family:inherit;}
button{cursor:pointer;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{display:none;}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  z-index:1;
  padding-top:var(--safe-t);
}

/* ---------- Top bar ---------- */
.topbar{
  padding: var(--sp-md) var(--sp-lg) var(--sp-sm);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.topbar h1{
  font-size:clamp(28px, 8.8vw, 36px);
  font-weight:760;
  letter-spacing:-0.035em;
  line-height:1.05;
  margin:0;
}
.topbar .sub{color:var(--text2); font-size:15px; margin-top:2px;}
.icon-btn{
  width:40px; height:40px;
  border-radius:50%;
  border:none;
  background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow);
  color:var(--text);
}
.icon-btn svg{width:20px; height:20px;}
.back-row{
  display:flex; align-items:center; gap:var(--sp-sm);
  padding: var(--sp-md) var(--sp-lg) var(--sp-sm);
}
.back-row .title{font-size:20px; font-weight:650; letter-spacing:-0.01em;}

/* ---------- View container ---------- */
#view{
  padding: 0 0 calc(var(--nav-h) + var(--safe-b) + 32px);
  min-height:60vh;
}
.view-plain{padding-bottom: calc(var(--sp-xl));}

/* ---------- Week strip ---------- */
.week-strip{
  display:flex;
  gap:6px;
  padding: var(--sp-sm) 0 var(--sp-md);
  overflow-x:auto;
}
.week-day{
  flex:1 0 auto;
  min-width:42px;
  text-align:center;
  border-radius:var(--r-md);
  padding:8px 4px;
  background:transparent;
  border:none;
  color:var(--text);
}
.week-day .dow{font-size:11px; color:var(--text2); font-weight:600; letter-spacing:0.02em;}
.week-day .dom{font-size:16px; font-weight:600; margin-top:4px;}
.week-day.active{background:var(--text); color:#fff;}
.week-day.active .dow{color:rgba(255,255,255,.7);}
.week-day.today-dot{position:relative;}
.week-day.today-dot::after{
  content:"";
  position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
  width:4px; height:4px; border-radius:50%;
  background:var(--accent);
}
.week-day.active.today-dot::after{background:#fff;}

/* ---------- Section labels ---------- */
.section-label{
  font-size:13px;
  font-weight:650;
  color:var(--text2);
  margin: var(--sp-lg) 0 var(--sp-sm);
}

/* ---------- Finance ---------- */
.fin-label{font-size:11px; font-weight:700; color:var(--text2); letter-spacing:.02em;}
.fin-big{font-size:34px; font-weight:750; letter-spacing:-0.02em; color:var(--text); line-height:1.15;}
.fin-mid{display:block; font-size:19px; font-weight:700; color:var(--text); margin-top:2px;}
.fin-hero{padding:20px;}
.fin-hero-main{margin-bottom:14px;}
.fin-hero-sub{display:flex; gap:28px; margin-bottom:14px;}
.fin-status-pill{
  display:inline-block; font-size:11px; font-weight:750; letter-spacing:.03em;
  padding:4px 10px; border-radius:20px; background:var(--fill); color:var(--text);
  margin-bottom:6px;
}
.fin-status-pill.attn{background:var(--terracotta); color:#fff;}
.fin-status-pill.income{background:var(--olive); color:#fff;}
.fin-status-text{color:var(--text2); margin:0; font-size:14px;}
.val.income, .fin-mid.income{color:var(--olive);}
.val.expense, .fin-mid.expense{color:var(--terracotta);}
.cat-snap-row{padding:8px 0;}
.cat-snap-top{display:flex; align-items:center; gap:8px; margin-bottom:5px;}
.cat-snap-top .lbl{flex:1;}
.cat-snap-bar-bg{height:5px; border-radius:3px; background:var(--fill); overflow:hidden;}
.cat-snap-bar{height:100%; border-radius:3px;}
.check-label{display:flex; align-items:center; gap:8px; font-size:15px; color:var(--text); cursor:pointer;}
.check-label input{width:18px; height:18px;}

/* ---------- Task rows ---------- */
.task-row{
  display:flex;
  align-items:flex-start;
  gap:var(--sp-md);
  padding:13px 4px;
  border-bottom:1px solid var(--line);
}
.task-row:last-child{border-bottom:none;}
.check{
  width:24px; height:24px;
  border-radius:50%;
  border:1.6px solid var(--grey);
  flex:0 0 24px;
  margin-top:2px;
  display:flex; align-items:center; justify-content:center;
  background:#fff;
}
.check.done{background:var(--olive); border-color:var(--olive);}
.check svg{width:13px; height:13px; opacity:0; color:#fff;}
.check.done svg{opacity:1;}
.task-main{flex:1; min-width:0;}
.task-row-top{display:flex; align-items:baseline; gap:8px;}
.task-title{
  flex:1; min-width:0;
  font-size:16px; font-weight:560; letter-spacing:-0.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.task-title.done{color:var(--text2); text-decoration:line-through; text-decoration-color:var(--grey);}
.lbl.done{color:var(--text2); text-decoration:line-through; text-decoration-color:var(--grey);}
.task-meta{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-top:3px;
  font-size:12.5px;
  color:var(--text2);
  line-height:1.5;
}
.task-meta-when{flex:0 0 auto;}
.task-meta-cat{white-space:nowrap;}
.dot{width:6px; height:6px; border-radius:50%; flex:0 0 6px;}
.dot.olive{background:var(--olive);}
.dot.brown{background:var(--brown);}
.dot.terracotta{background:var(--terracotta);}
.dot.beige{background:var(--beige);}
.dot.nude{background:var(--nude);}
.dot.grey{background:var(--grey);}
.pflag{width:7px; height:7px; border-radius:2px; flex:0 0 7px;}
.pflag.urgent{background:var(--danger);}
.pflag.high{background:var(--terracotta);}
.pflag.normal{background:var(--grey);}
.pflag.low{background:transparent; border:1.4px solid var(--grey);}
.assignee{
  margin-left:auto;
  font-size:12px; font-weight:650;
  color:var(--text2);
  background:var(--fill);
  border-radius:20px;
  padding:2px 8px;
  flex:0 0 auto;
}
.google-badge{
  margin-left:auto;
  font-size:11px; font-weight:650;
  color:var(--text2);
  background:none;
  border:1px solid var(--line);
  border-radius:20px;
  padding:1px 8px;
  flex:0 0 auto;
}
.google-event-row{cursor:pointer;}
.google-event-row .task-title{color:var(--text2);}
.row-amount{
  font-size:13px; font-weight:700;
  flex:0 0 auto;
  color:var(--text);
}
.row-amount.income{color:var(--olive);}
.row-amount.expense{color:var(--text2);}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:var(--sp-md) var(--sp-lg);
}
.upcoming-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}
.upcoming-row:last-child{border-bottom:none;}
.upcoming-row .d{font-size:15px; font-weight:600;}
.upcoming-row .c{font-size:14px; color:var(--text2);}

/* ---------- Empty states ---------- */
.empty{
  text-align:center;
  padding: 56px var(--sp-lg) 24px;
  color:var(--text2);
}
.empty h3{font-size:19px; color:var(--text); font-weight:650; margin:0 0 6px; letter-spacing:-0.01em;}
.empty p{font-size:15px; margin:0; line-height:1.5;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;
  left:0; right:0; bottom:0;
  max-width:560px;
  margin:0 auto;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(245,245,247,.82);
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:blur(22px) saturate(1.5);
  -webkit-backdrop-filter:blur(22px) saturate(1.5);
  border-top:1px solid var(--line);
  display:flex;
  z-index:40;
}
.nav-item{
  flex:1;
  min-width:0;
  border:none; background:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px;
  color:var(--text2);
  font-size:10.5px;
  font-weight:600;
  white-space:nowrap;
}
.nav-item svg{width:22px; height:22px; flex:0 0 auto;}
.nav-item.active{color:var(--text);}
.fab{
  position:fixed;
  right:calc((100vw - min(560px, 100vw))/2 + 20px);
  bottom:calc(var(--nav-h) + var(--safe-b) + 18px);
  width:58px; height:58px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  border:none;
  box-shadow:0 8px 24px rgba(0,113,227,.32);
  display:flex; align-items:center; justify-content:center;
  z-index:45;
  transition:transform .15s ease;
}
.fab:active{transform:scale(.92);}
.fab svg{width:26px; height:26px;}

/* ---------- Sheets & full screens ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(36,35,33,.32);
  z-index:60;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  position:fixed;
  left:0; right:0; bottom:0;
  max-width:560px;
  margin:0 auto;
  background:var(--bg);
  border-radius:24px 24px 0 0;
  z-index:61;
  max-height:88vh;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column;
  padding-bottom:var(--safe-b);
}
.sheet.show{transform:translateY(0);}
#sheetContent{display:flex; flex-direction:column; flex:1 1 auto; min-height:0;}
.sheet-handle{
  width:36px; height:5px; border-radius:3px;
  background:var(--grey);
  margin:10px auto 2px;
}
.sheet-head{
  display:flex; align-items:center; justify-content:space-between;
  padding: var(--sp-sm) var(--sp-lg) var(--sp-md);
  flex:0 0 auto;
}
.sheet-head .title{font-size:18px; font-weight:650;}
.sheet-body{overflow-y:auto; padding: 0 var(--sp-lg) var(--sp-lg); flex:1 1 auto; min-height:0;}
.link-btn{border:none; background:none; color:var(--accent); font-weight:600; font-size:15px; padding:6px;}

.fullscreen{
  position:fixed; inset:0;
  background:var(--bg);
  z-index:70;
  overflow-y:auto;
  transform:translateY(16px);
  opacity:0;
  pointer-events:none;
  transition:transform .22s ease, opacity .22s ease;
  padding-top:var(--safe-t);
}
.fullscreen.show{transform:translateY(0); opacity:1; pointer-events:auto;}

/* ---------- Forms ---------- */
.field{margin-bottom:var(--sp-lg);}
.field label{display:block; font-size:13px; font-weight:650; color:var(--text2); margin-bottom:8px;}
.field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field textarea, .field input[type=search]{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:var(--r-md);
  padding:13px 14px;
  font-size:16px;
  color:var(--text);
}
.field textarea{min-height:88px; resize:vertical;}
.title-input{
  width:100%;
  border:none;
  background:none;
  color:var(--text);
  font-size:24px;
  font-weight:650;
  letter-spacing:-0.01em;
  padding:6px 0 14px;
  border-bottom:1px solid var(--line);
}
.title-input::placeholder{color:var(--grey);}
.title-input:focus, input:focus, textarea:focus{outline:none; border-color:var(--accent);}

.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:20px;
  padding:9px 16px;
  font-size:14px;
  font-weight:560;
  color:var(--text);
  display:flex; align-items:center; gap:6px;
}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.chip.cat-active{background:var(--accent) !important; color:#fff; border-color:transparent;}
.chip.cat-active .dot{box-shadow:0 0 0 2px rgba(255,255,255,.92);}

.btn{
  width:100%;
  border:none;
  border-radius:var(--r-md);
  padding:16px;
  font-size:16px;
  font-weight:650;
  background:var(--accent);
  color:#fff;
}
.btn:active{opacity:.85;}
.btn.secondary{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
.btn.danger{background:var(--danger); color:#fff;}
.btn.ghost{background:none; color:var(--text2); box-shadow:none;}
.btn-row{display:flex; gap:10px;}

/* ---------- Task detail ---------- */
.detail-hero{padding: var(--sp-sm) 0 var(--sp-lg);}
.detail-cat{
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; font-weight:650; color:var(--text2);
  margin-bottom:8px;
}
.detail-title{font-size:27px; font-weight:680; letter-spacing:-0.02em; line-height:1.2;}
.detail-when{color:var(--text2); font-size:15px; margin-top:8px;}
.detail-section{
  padding: var(--sp-lg) 0;
  border-top:1px solid var(--line);
}
.detail-section h4{
  font-size:13px; font-weight:650; color:var(--text2); margin:0 0 12px; letter-spacing:0.01em;
}
.detail-people{display:flex; gap:8px; flex-wrap:wrap;}
.person-pill{
  background:var(--fill); border-radius:20px; padding:7px 14px; font-size:14px; font-weight:600;
}
.loc-row{display:flex; align-items:center; justify-content:space-between;}
.loc-name{font-size:16px; font-weight:600;}
.loc-addr{color:var(--text2); font-size:14px; margin-top:2px;}
.maps-link{color:var(--accent); font-weight:650; font-size:14px; white-space:nowrap;}
.notes-text{font-size:15px; line-height:1.55; white-space:pre-wrap;}
.checklist-row{display:flex; align-items:center; gap:12px; padding:9px 0;}
.checklist-title{flex:1; font-size:15px;}
.checklist-title.done{color:var(--text2); text-decoration:line-through;}
.progress-track{height:5px; background:var(--line); border-radius:3px; margin-top:10px; overflow:hidden;}
.progress-fill{height:100%; background:var(--olive);}
.attach-row{display:flex; align-items:center; gap:12px; padding:10px 0;}
.attach-icon{
  width:40px; height:40px; border-radius:10px; background:var(--fill);
  display:flex; align-items:center; justify-content:center; flex:0 0 40px;
}
.attach-icon svg{width:18px; height:18px;}
.attach-name{font-size:15px; font-weight:560;}
.attach-size{font-size:12px; color:var(--text2);}
.detail-actions{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  padding-top:var(--sp-lg);
}

/* ---------- Calendar ---------- */
.cal-nav{display:flex; align-items:center; justify-content:space-between; padding:6px 0 var(--sp-md);}
.cal-nav .month{font-size:19px; font-weight:650; letter-spacing:-0.01em;}
.cal-grid-head{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; color:var(--text2); font-size:12px; font-weight:650; margin-bottom:6px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.cal-cell{
  min-height:64px;
  min-width:0;
  border:none; background:none;
  display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;
  border-radius:12px;
  font-size:11px;
  color:var(--text);
  position:relative;
  padding:4px 3px 5px;
  text-align:left;
  transition:background .12s ease;
}
.cal-cell .daynum{font-size:12px; font-weight:650; align-self:center; width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%; margin-bottom:2px;}
.cal-cell.other-month{color:var(--grey);}
.cal-cell.other-month .day-event{opacity:.55;}
.cal-cell.selected{background:var(--fill);}
.cal-cell.selected .daynum{background:var(--text); color:#fff;}
.cal-cell.is-today .daynum{background:var(--accent); color:#fff;}
.cal-cell.drop-target{background:var(--olive); outline:2px solid var(--olive);}
.day-events{display:flex; flex-direction:column; gap:0; overflow:hidden; min-width:0;}
.day-event{
  display:block;
  min-width:0;
  max-width:100%;
  font-size:10.5px;
  line-height:1.35;
  padding:3.5px 4px;
  border-radius:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  background:var(--surface);
  box-shadow:0 1px 0 var(--bg), 0 1px 1px rgba(36,35,33,.05);
  touch-action:none;
  user-select:none; -webkit-user-select:none;
  cursor:grab;
}
.day-event.done{opacity:.45; text-decoration:line-through;}
.day-event.dragging{opacity:.3;}
.day-event .t{font-weight:650; color:var(--text2); margin-right:3px;}
.cal-more{font-size:10px; color:var(--text2); font-weight:650; padding:1px 4px;}
.drag-ghost{
  position:fixed; z-index:200; pointer-events:none;
  background:var(--text); color:#fff;
  font-size:12px; font-weight:600;
  padding:8px 14px; border-radius:12px;
  box-shadow:0 12px 28px rgba(0,0,0,.3);
  transform:translate(-50%,-120%) scale(1.04);
  white-space:nowrap;
}
.cal-dots{display:flex; gap:2px;}
.cal-dots .d{width:4px; height:4px; border-radius:50%;}
.day-schedule{margin-top:var(--sp-lg);}
.day-schedule h3{font-size:17px; font-weight:650; margin:0 0 6px;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;
  left:50%; bottom:calc(var(--nav-h) + var(--safe-b) + 14px);
  transform:translate(-50%, 20px);
  background:var(--text); color:#fff;
  padding:13px 18px;
  border-radius:16px;
  font-size:14px;
  display:flex; align-items:center; gap:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  z-index:90;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  max-width:min(480px, 88vw);
}
.toast.show{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
.toast button{background:none; border:none; color:var(--accent); font-weight:700; font-size:14px;}

/* ---------- Segmented control ---------- */
.segment{display:flex; background:var(--surface); border-radius:12px; padding:3px; box-shadow:var(--shadow);}
.segment button{flex:1; border:none; background:none; padding:9px 4px; font-size:13px; font-weight:650; color:var(--text2); border-radius:9px;}
.segment button.active{background:var(--fill); color:var(--text);}

/* ---------- Misc rows (settings/categories) ---------- */
.list-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 4px;
  border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:none;}
.list-row .lbl{flex:1; font-size:16px;}
.list-row .val{color:var(--text2); font-size:15px;}
.shop-row{
  display:flex; align-items:center; gap:12px;
  padding:9px 4px;
  border-bottom:1px solid var(--line);
}
.shop-row:last-child{border-bottom:none;}
.shop-row .check{margin-top:0;}
.shop-row .lbl{flex:1; font-size:15.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.toggle{
  width:48px; height:29px; border-radius:20px; background:var(--grey);
  position:relative; border:none; flex:0 0 48px;
}
.toggle.on{background:var(--accent);}
.toggle .knob{
  position:absolute; top:2.5px; left:3px;
  width:24px; height:24px; border-radius:50%; background:#fff;
  transition:left .15s ease;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle.on .knob{left:21px;}

.onb-wrap{padding: calc(var(--safe-t) + 60px) var(--sp-lg) 40px;}
.onb-logo{width:64px; height:64px; border-radius:20px; margin-bottom:var(--sp-lg);}
.onb-wrap h1{font-size:32px; font-weight:700; letter-spacing:-0.02em; margin:0 0 8px;}
.onb-wrap p.tag{color:var(--text2); font-size:16px; margin:0 0 40px;}
.onb-wrap .btn{margin-top:8px;}
.spacer{height:0;}
.skip-link{text-align:center; color:var(--text2); font-size:14px; padding:16px;}

/* =========================================================
   MOTION SYSTEM
   Purposeful, physical, restrained \u2014 not decorative. Every rule
   here exists to communicate hierarchy, weight or feedback.
   ========================================================= */

/* ---- Page-level transition: only fires on an actual route change
   (see render()'s routeChanged check) so ordinary interactions
   within a screen stay instant. ---- */
@keyframes viewEnter{ from{ opacity:0; } to{ opacity:1; } }
.view-enter{ animation:viewEnter var(--dur-normal) var(--ease-out) both; }

/* ---- Buttons: physical elevation, hover lift, tactile press-in.
   Kept extremely subtle per the brief \u2014 no bounce, no big scale. ---- */
.btn{
  transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
  box-shadow:0 2px 5px rgba(0,0,0,.08), 0 6px 14px rgba(0,0,0,.06);
}
.btn:hover{ transform:translateY(-1px); box-shadow:0 5px 14px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06); }
.btn:active{ transform:translateY(1px) scale(.985); box-shadow:0 1px 3px rgba(0,0,0,.08); opacity:1; transition-duration:90ms; }
.btn.secondary{ box-shadow:0 1px 2px rgba(0,0,0,.05); }
.btn.ghost{ box-shadow:none; }
.btn.ghost:hover{ transform:none; box-shadow:none; }
.chip, .icon-btn, .link-btn{ transition:transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out); }
.chip:active, .icon-btn:active{ transform:scale(.94); transition-duration:90ms; }
.link-btn:active{ opacity:.6; transition-duration:90ms; }
.fab{ transition:transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast) var(--ease-out); }
.fab:hover{ transform:translateY(-1px); }
.fab:active{ transform:scale(.92); transition-duration:90ms; }

/* ---- Cards & rows: interactive surfaces lift slightly on hover,
   press into the page on tap. Non-interactive cards get nothing. ---- */
.card[data-nav], .card[role="button"], .list-row, .task-row, .shop-row, .google-event-row{
  transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.card[data-nav]:hover, .card[role="button"]:hover{ transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.card[data-nav]:active, .card[role="button"]:active{ transform:translateY(1px) scale(.995); box-shadow:var(--shadow-sm); transition-duration:90ms; }

/* ---- Checkboxes: the checkmark feels placed, not just switched. ---- */
.check{ transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform 90ms var(--ease-out); }
.check svg{ transition:opacity var(--dur-fast) var(--ease-spring), transform var(--dur-fast) var(--ease-spring); transform:scale(.6); }
.check.done svg{ opacity:1; transform:scale(1); }
.check:active{ transform:scale(.88); }

/* ---- Toggles: thumb glides, background eases with it. ---- */
.toggle{ transition:background var(--dur-normal) var(--ease-out); }
.toggle .knob{ transition:left var(--dur-normal) var(--ease-spring), box-shadow var(--dur-fast) var(--ease-out); }

/* ---- Sheets & fullscreen editors: rise into place like a physical
   surface, not a flat fade. Backdrop dims and blurs behind them. ---- */
.sheet{ transition:transform var(--dur-slow) var(--ease-out); }
.overlay{ transition:opacity var(--dur-normal) var(--ease-out), backdrop-filter var(--dur-normal) var(--ease-out); }
.overlay.show{ backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
.fullscreen{ transition:transform var(--dur-slow) var(--ease-out), opacity var(--dur-slow) var(--ease-out); }

/* ---- Toasts: arrive with a touch of spring rather than a flat rise. ---- */
.toast{ transition:opacity var(--dur-normal) var(--ease-spring), transform var(--dur-normal) var(--ease-spring); }

/* ---- New list items (shopping, checklist) settle into place instead
   of just appearing \u2014 applied via a short-lived class in JS. ---- */
@keyframes listItemEnter{
  from{ opacity:0; transform:translateY(8px) scale(.98); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}
.list-item-enter{ animation:listItemEnter var(--dur-normal) var(--ease-out) both; }


/* =========================================================
   VISUAL LAYER - depth, light and a little theatre.
   Everything here is either ambient (never competes with content)
   or a response to something the person just did.
   ========================================================= */
:root{
  --aurora-1:rgba(0,122,255,.17);
  --aurora-2:rgba(64,156,255,.13);
  --aurora-3:rgba(90,100,240,.10);
}
:root[data-theme="dark"]{
  --aurora-1:rgba(10,132,255,.34);
  --aurora-2:rgba(64,120,255,.26);
  --aurora-3:rgba(90,100,240,.22);
}

/* Ambient aurora: three soft light pools drifting very slowly behind the app.
   Transform-only animation, so it stays cheap on phones. */
.ambient{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
.ambient i{position:absolute; border-radius:50%; will-change:transform;}
.ambient i:nth-child(1){
  width:78vmax; height:78vmax; left:-30vmax; top:-38vmax;
  background:radial-gradient(closest-side, var(--aurora-1), transparent);
  animation:auroraA 42s ease-in-out infinite alternate;
}
.ambient i:nth-child(2){
  width:70vmax; height:70vmax; right:-34vmax; top:-18vmax;
  background:radial-gradient(closest-side, var(--aurora-2), transparent);
  animation:auroraB 52s ease-in-out infinite alternate;
}
.ambient i:nth-child(3){
  width:66vmax; height:66vmax; left:10vmax; bottom:-40vmax;
  background:radial-gradient(closest-side, var(--aurora-3), transparent);
  animation:auroraC 60s ease-in-out infinite alternate;
}
@keyframes auroraA{ to{ transform:translate3d(14vmax, 10vmax, 0) scale(1.12); } }
@keyframes auroraB{ to{ transform:translate3d(-12vmax, 14vmax, 0) scale(1.08); } }
@keyframes auroraC{ to{ transform:translate3d(10vmax, -12vmax, 0) scale(1.15); } }

/* Primary buttons: a lit surface (top highlight, accent-tinted glow) with a
   single soft sweep of light on hover. Secondary/ghost stay quiet. */
.btn{position:relative; overflow:hidden;}
.btn:not(.secondary):not(.ghost):not(.danger){
  background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 86%, #fff) 0%, var(--accent) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30), 0 2px 5px rgba(0,0,0,.08), 0 8px 18px color-mix(in srgb, var(--accent) 30%, transparent);
}
.btn:not(.secondary):not(.ghost):not(.danger):hover{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 3px 8px rgba(0,0,0,.10), 0 12px 24px color-mix(in srgb, var(--accent) 36%, transparent);
}
.btn:not(.secondary):not(.ghost):not(.danger):active{
  box-shadow:inset 0 2px 5px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.08);
}
.btn:not(.secondary):not(.ghost):not(.danger)::after, .fab::after{
  content:""; position:absolute; top:0; bottom:0; left:-80%; width:50%;
  background:linear-gradient(105deg, transparent, rgba(255,255,255,.38), transparent);
  transform:skewX(-18deg); pointer-events:none;
  transition:left .75s var(--ease-out);
}
.btn:not(.secondary):not(.ghost):not(.danger):hover::after, .fab:hover::after{ left:130%; }
.fab{
  overflow:hidden;
  background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, #fff) 0%, var(--accent) 100%);
}

/* Bottom navigation: the active tab is lit - a glowing bar on the edge,
   a lifted accent-coloured icon. The bar springs in only when you
   actually switch tabs (see .pop). */
.nav-item{position:relative;}
.nav-item svg{transition:transform .28s var(--ease-spring), color .2s var(--ease-out);}
.nav-item.active svg{color:var(--accent); transform:translateY(-1px) scale(1.1);}
.nav-item.active::before{
  content:""; position:absolute; top:0; left:50%; width:28px; height:3px; margin-left:-14px;
  border-radius:0 0 5px 5px; background:var(--accent);
  box-shadow:0 3px 14px var(--accent);
}
.nav-item.active.pop::before{ animation:navBar .5s var(--ease-spring) backwards; }
.nav-item.active.pop svg{ animation:navIcon .55s var(--ease-spring) backwards; }
@keyframes navBar{ from{ transform:scaleX(0); opacity:0; } }
@keyframes navIcon{ from{ transform:translateY(6px) scale(.8); } }

/* Cursor spotlight on cards (mouse only) - a faint pool of accent light
   follows the pointer, so surfaces feel lit from the cursor. */
@media (hover:hover) and (pointer:fine){
  .card{position:relative;}
  .card::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:radial-gradient(280px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--text) 6%, transparent), transparent 70%);
    opacity:0; transition:opacity .3s var(--ease-out);
  }
  .card:hover::before{ opacity:1; }
}

/* Staggered entrance: when you switch screens, the pieces assemble
   top-to-bottom a few tens of milliseconds apart instead of all at once. */
@keyframes staggerIn{
  from{ opacity:0; transform:translateY(12px) scale(.992); }
}
.stagger-in{ animation:staggerIn .5s var(--ease-out) backwards; }

/* Today: progress ring for the selected day. Sweeps to its new value when
   something is checked off, and glows green when the day is complete. */
.ring{position:relative; width:54px; height:54px; flex:0 0 auto;}
.ring svg{width:100%; height:100%; transform:rotate(-90deg); overflow:visible;}
.ring-track{fill:none; stroke:var(--fill); stroke-width:4;}
.ring-arc{fill:none; stroke:var(--text); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .9s var(--ease-out);}
.ring-text{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:750; letter-spacing:-.01em;}
.ring-done .ring-arc{stroke:var(--olive);}
.ring-done svg{filter:drop-shadow(0 0 7px color-mix(in srgb, var(--olive) 65%, transparent));}
.ring-done .ring-text{color:var(--olive);}

/* Finance hero: a lit card - faint accent wash, a glow in the corner,
   and gradient-set numerals. */
.fin-hero{
  position:relative; overflow:hidden;
  background:linear-gradient(145deg, var(--surface) 30%, color-mix(in srgb, var(--text) 3%, var(--surface)));
}
.fin-hero::after{
  content:""; position:absolute; right:-46px; top:-46px; width:180px; height:180px; border-radius:50%;
  background:radial-gradient(closest-side, color-mix(in srgb, var(--text) 7%, transparent), transparent);
  pointer-events:none; z-index:0;
}
.fin-hero > *{position:relative; z-index:1;}
:root[data-theme="dark"] .fin-hero{background:linear-gradient(145deg, var(--surface-2), color-mix(in srgb, var(--text) 4%, var(--surface)));}

/* Checking something off: a ring of light leaves the checkbox. */
.check{position:relative;}
.check.burst::after{
  content:""; position:absolute; inset:-2px; border-radius:50%;
  border:2px solid var(--olive); pointer-events:none;
  animation:checkBurst .6s var(--ease-out) forwards;
}
@keyframes checkBurst{ from{ transform:scale(.85); opacity:.75; } to{ transform:scale(2); opacity:0; } }


/* =========================================================
   SCALE & DEPTH - one thing huge, everything around it small.
   Back: aurora + ghost numerals. Middle: the subject. Top: controls.
   ========================================================= */
.hero-top{position:relative; overflow:hidden; align-items:flex-end;}
.hero-top > *{position:relative; z-index:1;}
.hero-top .kicker{font-size:13px; font-weight:600; color:var(--text2); letter-spacing:.01em; margin:0 0 4px;}
.hero-row{display:flex; align-items:flex-end; gap:10px;}
.hero-num{
  font-size:clamp(76px, 24vw, 104px); font-weight:780; letter-spacing:-.055em;
  line-height:.84; color:var(--text); font-variant-numeric:tabular-nums;
}
.hero-unit{font-size:15px; font-weight:600; color:var(--text2); line-height:1.15; max-width:120px; padding-bottom:4px;}
.ghost-num{
  position:absolute !important; right:-4px; top:-26px; z-index:0 !important;
  font-size:208px; font-weight:800; letter-spacing:-.07em; line-height:1;
  color:var(--text); opacity:.045; pointer-events:none; user-select:none;
}
:root[data-theme="dark"] .ghost-num{opacity:.07;}
.fin-hero .fin-big{
  font-size:clamp(40px, 13.5vw, 58px); font-weight:780; letter-spacing:-.045em;
  line-height:1; white-space:nowrap;
}
.cal-nav .month{font-size:30px; font-weight:760; letter-spacing:-.035em; line-height:1;}
.cal-nav .month .yr{font-size:15px; font-weight:600; letter-spacing:0; color:var(--text2); margin-left:2px;}

/* Controls float on their own plane, above the content: the nav is a
   detached glass bar with real shadow instead of a strip glued to the edge. */
.bottom-nav{
  left:12px; right:12px; bottom:calc(var(--safe-b) + 10px);
  max-width:536px; height:var(--nav-h); padding-bottom:0;
  border:1px solid var(--line); border-radius:26px;
  box-shadow:0 14px 34px rgba(0,0,0,.13), 0 3px 8px rgba(0,0,0,.07), inset 0 1px 0 rgba(255,255,255,.55);
}
.nav-item.active::before{top:-1px;}
:root[data-theme="dark"] .bottom-nav{
  border:1px solid rgba(255,255,255,.09);
  box-shadow:0 16px 38px rgba(0,0,0,.55), 0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.07);
}
.fab{bottom:calc(var(--nav-h) + var(--safe-b) + 28px);}
.toast{bottom:calc(var(--nav-h) + var(--safe-b) + 26px);}
#view{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 44px);}


/* =========================================================
   ENTRY GATE - the front door. Photo behind, one big word,
   a code pad on its own plane above it.
   ========================================================= */
html:not(.unlocked):not(.unlocking){overflow:hidden;}
html:not(.unlocked):not(.unlocking) #app, html:not(.unlocked):not(.unlocking) #fab{visibility:hidden;}
html.unlocked #gate{display:none;}
#gate{

  -webkit-user-select:none; user-select:none;

  transform-origin:60% 40%;
  animation:gateZoom 38s ease-in-out infinite alternate;
}
@keyframes gateZoom{ from{ transform:scale(1); } to{ transform:scale(1.07); } }
.gate-scrim{
  position:absolute; inset:0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.86) 0%, rgba(0,0,0,.62) 30%, rgba(0,0,0,.08) 64%),
    linear-gradient(0deg, rgba(0,0,0,.45), transparent 35%);
}
.gate-panel{
  position:absolute; left:max(5vw, 36px); top:50%; transform:translateY(-50%);
  width:min(340px, 86vw);
  display:flex; flex-direction:column; align-items:center; text-align:center;
}
.gate-panel > *{animation:gateRise .8s var(--ease-out) backwards;}
.gate-panel > *:nth-child(2){animation-delay:.08s;}
.gate-panel > *:nth-child(3){animation-delay:.16s;}
.gate-panel > *:nth-child(4){animation-delay:.22s;}
.gate-panel > *:nth-child(5){animation-delay:.3s;}
@keyframes gateRise{ from{ opacity:0; transform:translateY(14px); } }
.gate-title{margin:0; font-size:clamp(46px, 13vw, 64px); font-weight:780; letter-spacing:-.045em; line-height:1; color:#fff;}
.gate-sub{margin:8px 0 0; font-size:13px; color:rgba(255,255,255,.68);}
.gate-hint{margin:30px 0 14px; min-height:14px; font-size:11px; font-weight:650; letter-spacing:.22em; text-transform:uppercase; color:rgba(255,255,255,.62); transition:color .2s;}
.gate-hint.err{color:#ff7a70;}
.gate-dots{display:flex; gap:16px; margin-bottom:26px;}
.gate-dots i{
  width:13px; height:13px; border-radius:50%; border:1.5px solid rgba(255,255,255,.72);
  transition:background .15s, transform .28s var(--ease-spring), box-shadow .2s;
}
.gate-dots i.on{background:#fff; transform:scale(1.15); box-shadow:0 0 14px rgba(255,255,255,.55);}
.gate-dots.shake{animation:gateShake .45s var(--ease-out);}
@keyframes gateShake{ 20%{transform:translateX(-9px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-5px);} 80%{transform:translateX(3px);} }
.gate-keys{--key:clamp(62px, 18.5vw, 74px); display:grid; grid-template-columns:repeat(3, var(--key)); gap:14px 18px;}
.gate-keys button{
  width:var(--key); height:var(--key); border-radius:50%; padding:0;
  border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3);
  color:#fff; font:350 28px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
  display:flex; align-items:center; justify-content:center;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent; cursor:pointer;
  transition:transform .12s var(--ease-out), background .15s var(--ease-out), box-shadow .15s var(--ease-out);
  box-shadow:0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14);
}
@media (hover:hover) and (pointer:fine){ .gate-keys button:hover{background:rgba(255,255,255,.19);} }
.gate-keys button:active{transform:scale(.92); background:rgba(255,255,255,.3); box-shadow:0 2px 6px rgba(0,0,0,.3);}
.gate-keys .sp{visibility:hidden;}
.gate-keys .fn{background:none; border-color:transparent; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; color:rgba(255,255,255,.8);}
.gate-keys .fn:active{background:rgba(255,255,255,.14);}
.gate-keys svg{width:26px; height:26px;}
.gate-keys button:focus-visible{outline:2px solid #fff; outline-offset:3px;}

/* Phones (portrait): the photo is landscape, so instead of cropping one of
   you out it sits in the top of the screen, fading into black where the
   code pad begins. */
@media (max-aspect-ratio: 9/10){
  .gate-photo{background-size:auto 60%; background-position:60% 0; transform-origin:60% 20%;}
  .gate-scrim{background:linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,.35) 40%, rgba(0,0,0,.88) 56%, #000 68%);}
  .gate-panel{left:0; right:0; top:auto; bottom:0; transform:none; width:auto; padding:0 24px calc(22px + env(safe-area-inset-bottom));}
}
@media (max-height:640px) and (max-aspect-ratio: 9/10){
  .gate-hint{margin-top:16px;} .gate-dots{margin-bottom:16px;} .gate-keys{gap:10px 16px; --key:clamp(54px, 16vw, 62px);}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important;}
}

/* hide scrollbars on horizontal strips but keep scroll */
.week-strip::-webkit-scrollbar, .sheet-body::-webkit-scrollbar{display:none;}
</style>

<script>
(function () {
  var gate = document.getElementById("gate");
  if (!gate || document.documentElement.classList.contains("unlocked")) return;
  var HASH = 3045567989, SALT = "together|", LEN = 4;
  var hint = document.getElementById("gateHint"), dotsEl = document.getElementById("gateDots");
  var dots = dotsEl.querySelectorAll("i");
  var meta = document.querySelector('meta[name="theme-color"]'), prevColor = meta && meta.getAttribute("content");
  if (meta) meta.setAttribute("content", "#000000");
  var entered = "", locked = false, fails = 0, done = false;
  // A light fingerprint so the code isn't sitting in the file as plain text.
  // This keeps casual eyes out - it is not strong security (see notes).
  function fnv(str) { var h = 0x811c9dc5; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
  function paint() {
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < entered.length);
    dotsEl.setAttribute("aria-label", entered.length + " of " + LEN + " digits entered");
  }
  function say(text, err) { hint.textContent = text; hint.classList.toggle("err", !!err); }
  function press(d) {
    if (locked || done || entered.length >= LEN) return;
    entered += d; paint();
    if (entered.length === LEN) setTimeout(check, 140);
  }
  function back() { if (locked || done) return; entered = entered.slice(0, -1); paint(); }
  function check() {
    if (fnv(SALT + entered) === HASH) return unlock();
    fails++;
    dotsEl.classList.remove("shake"); void dotsEl.offsetWidth; dotsEl.classList.add("shake");
    if (navigator.vibrate) try { navigator.vibrate(120); } catch (e) {}
    if (fails >= 5) {
      locked = true; say("Too many tries - wait a moment", true);
      setTimeout(function () { locked = false; fails = 0; say("Enter code"); }, 15000);
    } else say("Wrong code", true);
    setTimeout(function () { entered = ""; paint(); if (!locked) setTimeout(function () { if (!done && !locked) say("Enter code"); }, 700); }, 420);
  }
  function unlock() {
    done = true; say("Welcome");
    try { sessionStorage.setItem("together_unlocked", "1"); } catch (e) {}
    var root = document.documentElement;
    root.classList.add("unlocking"); gate.classList.add("leaving");
    if (meta && prevColor) meta.setAttribute("content", prevColor);
    setTimeout(function () { root.classList.add("unlocked"); root.classList.remove("unlocking"); }, 620);
  }
  document.getElementById("gateKeys").addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("button[data-k]"); if (!b) return;
    var k = b.getAttribute("data-k"); if (k === "back") back(); else press(k);
  });
  document.addEventListener("keydown", function (e) {
    if (done || document.documentElement.classList.contains("unlocked")) return;
    if (e.key >= "0" && e.key <= "9" && e.key.length === 1) { press(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { back(); e.preventDefault(); }
  });
})();
</script>

<script>
/* =========================================================
   TOGETHER — local-first PWA
   Single JS file: IndexedDB layer, state, router, views.
   ========================================================= */

/* ---------------- Visible error reporting (so failures are never silent) ---------------- */
function showErrorBanner(msg) {
  try {
    const el = document.getElementById("errBanner");
    if (!el) return;
    el.textContent = "Something went wrong: " + msg + " (tap to dismiss)";
    el.style.display = "block";
    el.onclick = () => { el.style.display = "none"; };
  } catch (e) { /* ignore */ }
}
window.addEventListener("error", (e) => showErrorBanner(e.message || String(e.error)));
window.addEventListener("unhandledrejection", (e) => showErrorBanner((e.reason && e.reason.message) || String(e.reason)));

/* ---------------- IndexedDB layer ---------------- */
const DB_NAME = "together-db";
const DB_VERSION = 4;
let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("tasks")) {
        const s = db.createObjectStore("tasks", { keyPath: "id" });
        s.createIndex("startDate", "startDate");
        s.createIndex("status", "status");
      }
      if (!db.objectStoreNames.contains("categories")) {
        db.createObjectStore("categories", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("settings")) {
        db.createObjectStore("settings", { keyPath: "key" });
      }
      if (!db.objectStoreNames.contains("accounts")) {
        db.createObjectStore("accounts", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("balanceSnapshots")) {
        db.createObjectStore("balanceSnapshots", { keyPath: "monthKey" });
      }
      if (!db.objectStoreNames.contains("shoppingItems")) {
        db.createObjectStore("shoppingItems", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("stuffItems")) {
        db.createObjectStore("stuffItems", { keyPath: "id" });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function tx(storeName, mode) {
  return dbInstance.transaction(storeName, mode).objectStore(storeName);
}
function idbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readonly").getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  });
}
function idbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readonly").get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function idbPut(storeName, val) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readwrite").put(val);
    r.onsuccess = () => resolve(val);
    r.onerror = () => reject(r.error);
  });
}
function idbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readwrite").delete(key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}
function idbClear(storeName) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readwrite").clear();
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

/* ---------------- Utilities ---------------- */
function uid() {
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function isoToDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addDaysISO(iso, n) {
  const d = isoToDate(iso);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function addMonthsISO(iso, n) {
  const d = isoToDate(iso);
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
const WEEKDAYS_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const WEEKDAYS_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function weekdayShort(iso) { return WEEKDAYS_SHORT[isoToDate(iso).getDay()]; }
function weekdayLong(iso) { return WEEKDAYS_LONG[isoToDate(iso).getDay()]; }
function dayOfMonth(iso) { return isoToDate(iso).getDate(); }
function monthLong(iso) { return MONTHS_LONG[isoToDate(iso).getMonth()]; }
function monthStartISO(iso) { const d = isoToDate(iso); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-01"; }
function monthEndISO(iso) { return addDaysISO(addMonthsISO(monthStartISO(iso), 1), -1); }
function daysInMonthISO(iso) { return dayOfMonth(monthEndISO(iso)); }
function fmtDateHeading(iso) {
  return { weekday: weekdayLong(iso), dayMonth: dayOfMonth(iso) + " " + monthLong(iso) };
}
function fmtTime(t) { return t || ""; }
function isSameISO(a, b) { return a === b; }
function greeting() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  return "Good evening";
}
function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function fileSizeLabel(bytes) {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}
function isLikelyUrl(v) {
  return /^https?:\/\//i.test((v || "").trim());
}
// Whole euros unless there are real cents, so "€72" stays clean but "€72.50" isn't rounded away.
function fmtMoney(n) {
  const v = Number(n) || 0;
  const abs = Math.abs(v);
  const hasCents = Math.round(abs * 100) % 100 !== 0;
  const body = abs.toLocaleString("pt-PT", { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
  return (v < 0 ? "\u2212" : "") + "\u20ac" + body;
}
function fmtMoneySigned(n) {
  const v = Number(n) || 0;
  return (v > 0 ? "+" : "") + fmtMoney(v);
}
function extractPlaceNameFromMapsUrl(url) {
  try {
    const u = new URL(url);
    const placeMatch = u.pathname.match(/\/place\/([^/]+)/);
    if (placeMatch) return decodeURIComponent(placeMatch[1].replace(/\+/g, " "));
    const q = u.searchParams.get("q") || u.searchParams.get("query") || u.searchParams.get("daddr");
    if (q) return decodeURIComponent(q.replace(/\+/g, " "));
  } catch (e) { /* not a parseable absolute URL */ }
  return null;
}

/* ---------------- Global state ---------------- */
const S = {

/* ---------------- Firestore (shared household data) ----------------
 * Bridges into the tiny ES-module script in index.html that talks to the
 * Firebase SDK (window.__firebase) \u2014 app.js itself stays a plain classic
 * script, same as always, just with this one doorway out to Firestore.
 * Only tasks/categories/accounts/balanceSnapshots/shoppingItems/stuffItems
 * are shared this way; settings (theme, Google Calendar connection, etc.)
 * stay local per-device, since those genuinely shouldn't sync between phones.
 * ------------------------------------------------------------------- */
const HOUSEHOLD_ID = "sr-household-7f2c9ae4d1";
window.HOUSEHOLD_ID = HOUSEHOLD_ID; // exposed for testing, same pattern as the other constants
function fsReady() { return !!(window.__firebase && window.__firebaseReady && !window.__firebaseInitError); }
function fsColl(name) { return window.__firebase.collection(window.__firebase.db, "households", HOUSEHOLD_ID, name); }
function fsDocRef(name, id) { return window.__firebase.doc(window.__firebase.db, "households", HOUSEHOLD_ID, name, id); }
function waitForFirebaseReady() {
  return new Promise((resolve) => {
    if (window.__firebaseReady) return resolve();
    window.addEventListener("firebase-ready", () => resolve(), { once: true });
    setTimeout(resolve, 6000); // don't hang the app forever if the module script never loads
  });
}
async function fsSave(name, obj, id) {
  if (!fsReady()) return;
  try { await window.__firebase.setDoc(fsDocRef(name, id || obj.id), obj); }
  catch (e) { console.error("Firestore save failed (" + name + "):", e); showErrorBanner("Couldn\u2019t save to the shared household data. Changes are only on this device for now."); }
}
async function fsRemove(name, id) {
  if (!fsReady()) return;
  try { await window.__firebase.deleteDoc(fsDocRef(name, id)); }
  catch (e) { console.error("Firestore delete failed (" + name + "):", e); }
}
function fsListen(name, stateKey) {
  window.__firebase.onSnapshot(fsColl(name), (snap) => {
    S[stateKey] = snap.docs.map((d) => d.data());
    render();
  }, (err) => { console.error("Firestore listen error (" + name + "):", err); });
}
function startFirestoreListeners() {
  fsListen("tasks", "tasks");
  fsListen("categories", "categories");
  fsListen("accounts", "accounts");
  fsListen("balanceSnapshots", "balanceSnapshots");
  fsListen("shoppingItems", "shoppingItems");
  fsListen("stuffItems", "stuffItems");
}
// One-time, per-device: push whatever's currently in THIS device's local
// storage up to the shared household in Firestore. Gated on a local flag
// (not a shared "has anyone migrated yet" marker) so that if Rita's phone
// and Sergio's phone both have their own local history, both get merged in
// \u2014 upserting by the item's existing id makes this safe even if it runs
// on both devices, or runs twice.
async function migrateLocalDataToFirestoreIfNeeded() {
  if (!fsReady() || S.settings.firestoreMigrated) return;
  // Shared data always wins. Before uploading anything, look at what the
  // household already has and skip any local item that is already there \u2014
  // either by id, or because an identical item exists under a different id
  // (which is exactly how duplicates were created the first time around).
  const specs = [
    ["categories", S.categories, (c) => c.id, null],
    ["tasks", S.tasks, (t) => t.id, dupKeyTask],
    ["accounts", S.accounts, (a) => a.id, dupKeyAccount],
    ["balanceSnapshots", S.balanceSnapshots, (x) => x.monthKey, null],
    ["shoppingItems", S.shoppingItems, (i) => i.id, dupKeyShopping],
    ["stuffItems", S.stuffItems, (i) => i.id, dupKeyStuff],
  ];
  const ops = [];
  try {
    for (const [name, local, idOf, keyFn] of specs) {
      const snap = await window.__firebase.getDocs(fsColl(name));
      const ids = new Set(), keys = new Set();
      snap.docs.forEach((d) => { const v = d.data(); ids.add(idOf(v)); if (keyFn) keys.add(keyFn(v)); });
      for (const item of local) {
        if (ids.has(idOf(item))) continue;
        if (keyFn && keys.has(keyFn(item))) continue;
        ops.push({ name, id: idOf(item), data: item });
      }
    }
    const CHUNK = 400; // Firestore batches cap at 500 writes
    for (let i = 0; i < ops.length; i += CHUNK) {
      const batch = window.__firebase.writeBatch(window.__firebase.db);
      for (const op of ops.slice(i, i + CHUNK)) batch.set(fsDocRef(op.name, op.id), op.data);
      await batch.commit();
    }
    S.settings.firestoreMigrated = true;
    await saveSettings();
  } catch (e) {
    console.error("Firestore migration failed:", e);
    showErrorBanner("Couldn\u2019t upload this device\u2019s data to the shared household yet \u2014 will retry next time you open the app.");
  }
}

/* ---------------- Duplicate cleanup ----------------
 * Two phones that each seeded/created the "same" item before syncing
 * existed end up with copies that have different ids, so Firestore (which
 * merges by id) correctly keeps both. This finds items that are identical
 * in every visible way and removes the extras. The winner is chosen
 * deterministically (completed first, then oldest, then lowest id) so it's
 * always the same copy no matter which phone runs the cleanup.
 * ---------------------------------------------------- */
function dupKeyTask(t) {
  const title = String(t.title || "").trim().toLowerCase();
  const monthlyMoney = t.amount != null && t.recurrence && t.recurrence.frequency === "monthly";
  // Monthly bills seeded on different days by each phone still count as the
  // same bill for the same month.
  const when = monthlyMoney ? "m:" + String(t.startDate || "").slice(0, 7) : "d:" + (t.startDate || "") + "|" + (t.startTime || "");
  return [t.categoryId || "", title, when, t.amount == null ? "" : t.amount, t.flowType || "", t.assignedTo || ""].join("|");
}
function dupKeyStuff(i) { return String(i.title || "").trim().toLowerCase() + "|" + String(i.content || "").trim(); }
function dupKeyShopping(i) { return String(i.name || "").trim().toLowerCase() + "|" + (i.checked ? 1 : 0); }
function dupKeyAccount(a) { return String(a.name || "").trim().toLowerCase() + "|" + (a.openingBalance || 0) + "|" + (a.openingDate || ""); }
function dupWinnerOrder(a, b) {
  const ac = a.status === "completed" ? 1 : 0, bc = b.status === "completed" ? 1 : 0;
  if (ac !== bc) return bc - ac;
  const ca = a.createdAt || 0, cb = b.createdAt || 0;
  if (ca !== cb) return ca - cb;
  return String(a.id) < String(b.id) ? -1 : 1;
}
function findDuplicatesIn(list, keyFn) {
  const groups = new Map();
  for (const it of list) {
    const k = keyFn(it);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }
  const losers = [];
  for (const g of groups.values()) {
    if (g.length < 2) continue;
    g.sort(dupWinnerOrder);
    losers.push(...g.slice(1));
  }
  return losers;
}
function findDuplicates() {
  return {
    tasks: findDuplicatesIn(S.tasks, dupKeyTask),
    stuffItems: findDuplicatesIn(S.stuffItems, dupKeyStuff),
    shoppingItems: findDuplicatesIn(S.shoppingItems, dupKeyShopping),
    accounts: findDuplicatesIn(S.accounts, dupKeyAccount),
  };
}
function countDuplicates(d) { return d.tasks.length + d.stuffItems.length + d.shoppingItems.length + d.accounts.length; }
async function removeDuplicates(d) {
  for (const t of d.tasks) await deleteTaskById(t.id);
  for (const i of d.stuffItems) await deleteStuffItemById(i.id);
  for (const i of d.shoppingItems) await deleteShoppingItemById(i.id);
  for (const a of d.accounts) await deleteAccountById(a.id);
  return countDuplicates(d);
}
function openDedupeSheet() {
  const d = findDuplicates();
  const n = countDuplicates(d);
  if (n === 0) { showToast("No duplicates found"); return; }
  const parts = [];
  if (d.tasks.length) parts.push(d.tasks.length + " task" + (d.tasks.length === 1 ? "" : "s") + " / bills");
  if (d.stuffItems.length) parts.push(d.stuffItems.length + " Stuff note" + (d.stuffItems.length === 1 ? "" : "s"));
  if (d.shoppingItems.length) parts.push(d.shoppingItems.length + " shopping item" + (d.shoppingItems.length === 1 ? "" : "s"));
  if (d.accounts.length) parts.push(d.accounts.length + " account" + (d.accounts.length === 1 ? "" : "s"));
  openSheet(
    '<div class="sheet-head"><span class="title">Remove duplicates</span><button class="icon-btn" id="closeSheetBtn"><svg><use href="#ic-close"/></svg></button></div>' +
    '<div class="sheet-body">' +
      '<p style="margin:0 0 8px">Found <b>' + n + ' extra cop' + (n === 1 ? "y" : "ies") + '</b>: ' + escapeHtml(parts.join(", ")) + ".</p>" +
      '<p style="color:var(--text2);font-size:14px;margin:0 0 16px">Only items that are identical in every visible detail are matched. One copy of each is kept (a completed one if there is one, otherwise the oldest), and the extras are removed for both of you.</p>' +
      '<button class="btn" id="confirmDedupe">Remove ' + n + " duplicate" + (n === 1 ? "" : "s") + "</button>" +
    "</div>"
  );
  document.getElementById("closeSheetBtn").onclick = closeSheet;
  document.getElementById("confirmDedupe").onclick = async () => {
    const removed = await removeDuplicates(d);
    closeSheet();
    render();
    showToast("Removed " + removed + " duplicate" + (removed === 1 ? "" : "s"));
  };
}

function monthMatrix(anchorIso) {
  const d = isoToDate(anchorIso);
  const year = d.getFullYear(), month = d.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay(); // 0 = Sunday
  const gridStart = new Date(year, month, 1 - startOffset);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const cd = new Date(gridStart);
    cd.setDate(gridStart.getDate() + i);
    const iso = cd.getFullYear() + "-" + pad2(cd.getMonth() + 1) + "-" + pad2(cd.getDate());
    cells.push({ iso, day: cd.getDate(), otherMonth: cd.getMonth() !== month });

}

function taskMatchesFilter(t) {
  const f = S.tasksFilter;
  // Finance-tracked items are hidden from the general Tasks list by default —
  // they live on the Finance Dashboard instead — unless the person is
  // specifically filtering by that category or searching for it by name.
  if (t.showOnCalendar === false && !(f.category && f.category.includes(t.categoryId)) && !S.tasksSearch) return false;
  if (f.person && f.person !== "all") {
    if (f.person === "both") { if (t.assignedTo !== "both") return false; }
    else if (t.assignedTo !== f.person && t.assignedTo !== "both") return false;
  }
  if (f.priority && !f.priority.includes(t.priority)) return false;
  if (f.category && !f.category.includes(t.categoryId)) return false;
  if (f.status) {
    if (f.status === "upcoming" && t.status !== "upcoming") return false;
    if (f.status === "in_progress" && t.status !== "in_progress") return false;
    if (f.status === "waiting" && t.status !== "waiting") return false;
    if (f.status === "completed" && t.status !== "completed") return false;
  } else {
    if (t.status === "completed") return false;
  }
  if (f.date) {
    const today = todayISO();
    if (f.date === "today" && t.startDate !== today) return false;
    if (f.date === "tomorrow" && t.startDate !== addDaysISO(today, 1)) return false;
    if (f.date === "week" && (t.startDate < today || t.startDate > addDaysISO(today, 7))) return false;
    if (f.date === "month" && (t.startDate < today || t.startDate > addMonthsISO(today, 1))) return false;
  }
  if (S.tasksSearch) {
    const q = S.tasksSearch.toLowerCase();
    const hay = [t.title, t.notes, t.locationName, catById(t.categoryId).name]
      .join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function filteredSortedTasks() {
  let list = S.tasks.filter(taskMatchesFilter);
  const prioRank = { urgent: 0, high: 1, normal: 2, low: 3 };
  if (S.tasksSort === "datetime") {
    list.sort((a, b) => (a.startDate + (a.startTime || "99:99")).localeCompare(b.startDate + (b.startTime || "99:99")));
  } else if (S.tasksSort === "priority") {
    list.sort((a, b) => prioRank[a.priority] - prioRank[b.priority]);
  } else if (S.tasksSort === "category") {
    list.sort((a, b) => catById(a.categoryId).name.localeCompare(catById(b.categoryId).name));
  } else if (S.tasksSort === "created") {
    list.sort((a, b) => b.createdAt - a.createdAt);
  }
  return list;
}

function groupTasks(list) {
  const groups = [];
  if (S.tasksGroup === "none") return [{ label: null, items: list }];
  if (S.tasksGroup === "date") {
    const map = new Map();
    for (const t of list) {
      const key = t.startDate || "No date";
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(t);
    }
    for (const [key, items] of [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
      groups.push({ label: dateGroupLabel(key), items });
    }
  } else if (S.tasksGroup === "priority") {
    for (const p of PRIORITIES) {
      const items = list.filter((t) => t.priority === p);
      if (items.length) groups.push({ label: PRIORITY_LABEL[p], items });
    }
  } else if (S.tasksGroup === "category") {
    for (const c of S.categories) {
      const items = list.filter((t) => t.categoryId === c.id);
      if (items.length) groups.push({ label: c.name, items });
    }
  }
  return groups;
}
function dateGroupLabel(iso) {
  if (iso === "No date") return "No date";
  const today = todayISO();
  if (iso === today) return "Today";
  if (iso === addDaysISO(today, 1)) return "Tomorrow";
  return weekdayLong(iso) + ", " + dayOfMonth(iso) + " " + monthLong(iso);
}

/* ---------------- Visual-layer helpers ----------------
 * Effects triggered by an action use short time WINDOWS rather than
 * one-shot flags: saving to Firestore fires an immediate local re-render,
 * and a one-shot flag would be spent on the first render while the second
 * cut the animation off. A window lets either render show it. */
const burstUntil = new Map();
function markBurst(id) { burstUntil.set(id, Date.now() + 700); }
function isBursting(id) { return (burstUntil.get(id) || 0) > Date.now(); }

const ringPrev = { iso: null, pct: 0 };
function progressRingHtml(iso, done, total) {
  if (!total) { ringPrev.iso = iso; ringPrev.pct = 0; return ""; }
  const pct = done / total;
  const C = 2 * Math.PI * 18;
  // Start from the last value shown for this day so the ring only moves when
  // something actually changed (and sweeps in from empty on a new day).
  const startPct = ringPrev.iso === iso ? ringPrev.pct : 0;
  ringPrev.iso = iso; ringPrev.pct = pct;
  return '<div class="ring ' + (pct === 1 ? "ring-done" : "") + '" role="img" aria-label="' + done + " of " + total + ' done">' +
    '<svg viewBox="0 0 44 44">' +
    '<circle class="ring-track" cx="22" cy="22" r="18"/>' +
    '<circle class="ring-arc" cx="22" cy="22" r="18" stroke-dasharray="' + C.toFixed(2) + '" style="stroke-dashoffset:' + (C * (1 - startPct)).toFixed(2) + '" data-final="' + (C * (1 - pct)).toFixed(2) + '"/></svg>' +
    '<span class="ring-text">' + done + "/" + total + "</span></div>";
}

function runCountUps(root) {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  root.querySelectorAll("[data-countup]").forEach((el) => {
    const target = Number(el.getAttribute("data-countup"));
    if (!isFinite(target)) return;
    const dur = 900, t0 = performance.now();
    const step = (now) => {
      if (!el.isConnected) return; // screen was re-rendered; the new one has its own
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 4);
      el.textContent = p < 1 ? fmtMoney(Math.round(target * eased)) : fmtMoney(target);
      if (p < 1) requestAnimationFrame(step);
    };
    el.textContent = fmtMoney(0);
    requestAnimationFrame(step);
  });
}

let entranceUntil = 0;
function applyEntrance(view) {
  view.querySelectorAll(".topbar, .week-strip, .section-label, .card, .empty, .segment").forEach((el, i) => {
    el.classList.add("stagger-in");
    el.style.animationDelay = Math.min(i, 9) * 40 + "ms";
  });
  runCountUps(view);
}

let navPopNext = false;

// Mouse-only spotlight on cards: just publishes the pointer position to CSS.
document.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;
  const c = e.target && e.target.closest ? e.target.closest(".card") : null;
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty("--mx", (e.clientX - r.left) + "px");
  c.style.setProperty("--my", (e.clientY - r.top) + "px");
}, { passive: true });

let lastRenderedHash = null;
function render() {
  if (!S.settings || !S.settings.onboarded) { renderOnboarding(); return; }
  const hash = currentRoute();
  const routeChanged = hash !== lastRenderedHash;
  lastRenderedHash = hash;
  navPopNext = routeChanged;
  closeSheet();
  const view = document.getElementById("view");
  const nav = document.getElementById("bottomNav");
  const fab = document.getElementById("fab");

  let showNav = true, showFab = true, navActive = "";

  if (hash.startsWith("#/today")) { view.innerHTML = renderToday(); navActive = "today"; }
  else if (hash.startsWith("#/tasks")) { view.innerHTML = renderTasks(); navActive = "tasks"; }
  else if (hash.startsWith("#/calendar")) { view.innerHTML = renderCalendar(); navActive = "calendar"; }
  else if (hash.startsWith("#/more")) { view.innerHTML = renderMore(); navActive = "more"; showFab = false; }
  else if (hash.startsWith("#/categories")) { view.innerHTML = renderCategories(); showNav = false; showFab = false; }
  else if (hash.startsWith("#/accounts")) { view.innerHTML = renderAccounts(); showNav = false; showFab = false; }
  else if (hash.startsWith("#/finance")) { view.innerHTML = renderFinanceDashboard(); navActive = "finance"; }
  else if (hash.startsWith("#/shopping")) { view.innerHTML = renderShopping(); navActive = "shopping"; }
  else if (hash.startsWith("#/stuff")) { view.innerHTML = renderStuff(); navActive = "stuff"; }
  else if (hash.startsWith("#/notifications")) { view.innerHTML = renderNotifications(); showNav = false; showFab = false; }
  else if (hash.startsWith("#/task/new")) { openCreateSheet(); view.innerHTML = renderToday(); navActive = "today"; }
  else if (hash.match(/^#\/task\/([^/]+)\/edit$/)) {
    const id = hash.match(/^#\/task\/([^/]+)\/edit$/)[1];
    view.innerHTML = renderTaskEditFullscreen(id); showNav = false; showFab = false;
  }
  else if (hash.match(/^#\/task\/([^/]+)$/)) {
    const id = hash.match(/^#\/task\/([^/]+)$/)[1];
    view.innerHTML = renderTaskDetail(id); showNav = false; showFab = false;
  }
  else { view.innerHTML = renderToday(); navActive = "today"; }

  // Premium page-level transition \u2014 but ONLY when the route actually
  // changed. render() also fires on same-screen interactions (a checkbox
  // toggle, search-as-you-type, a sheet field edit), and animating those
  // too would make the app feel slower, not premium.
  if (routeChanged) {
    view.classList.remove("view-enter");
    void view.offsetWidth; // force reflow so the animation restarts
    view.classList.add("view-enter");
    entranceUntil = Date.now() + 700;
  }
  // Re-apply within a short window so an immediate re-render (Firestore's
  // local echo right after navigation) restarts the entrance rather than
  // snapping the content into place mid-animation.
  if (Date.now() < entranceUntil) applyEntrance(view);

  nav.style.display = showNav ? "flex" : "none";
  fab.style.display = showFab ? "flex" : "none";
  buildBottomNav(navActive);
  wireGlobalActions();
  afterRenderRoute(hash);
  window.scrollTo(0, 0);
}

function afterRenderRoute(hash) {
  if (hash.startsWith("#/today")) afterTodayRender();
  else if (hash.startsWith("#/tasks")) afterTasksRender();
  else if (hash.startsWith("#/calendar")) afterCalendarRender();
  else if (hash.startsWith("#/more")) afterMoreRender();
  else if (hash.startsWith("#/categories")) afterCategoriesRender();
  else if (hash.startsWith("#/accounts")) afterAccountsRender();
  else if (hash.startsWith("#/finance")) afterFinanceDashboardRender();
  else if (hash.startsWith("#/shopping")) afterShoppingRender();
  else if (hash.startsWith("#/stuff")) afterStuffRender();
  else if (hash.startsWith("#/notifications")) afterNotificationsRender();
  else if (hash.match(/^#\/task\/([^/]+)\/edit$/)) afterTaskEditRender(hash.match(/^#\/task\/([^/]+)\/edit$/)[1]);
  else if (hash.match(/^#\/task\/([^/]+)$/) && !hash.startsWith("#/task/new")) afterTaskDetailRender(hash.match(/^#\/task\/([^/]+)$/)[1]);
  else afterTodayRender();
}

async function toggleComplete(id) {
  const t = S.tasks.find((x) => x.id === id);
  if (!t) return;
  const wasDone = t.status === "completed";
  t.status = wasDone ? "upcoming" : "completed";
  t.completedAt = wasDone ? null : Date.now();
  if (!wasDone) markBurst(id);
  await saveTask(t);
  render();
  if (!wasDone) {
    showToast("Task completed", "Undo", () => { toggleComplete(id); });
  }
}

function renderToday() {
  const iso = S.todaySelected;

  const activeCount = tasks.filter((t) => t.status !== "completed").length;
  const heading = fmtDateHeading(iso);

  let weekStrip = '<div class="week-strip">';
  const weekStart = addDaysISO(todayISO(), -3);
  for (let i = 0; i < 7; i++) {
    const d = addDaysISO(weekStart, i);

    const isT = d === todayISO();

      '" data-pick-day="' + d + '"><div class="dow">' + weekdayShort(d) + '</div><div class="dom">' + dayOfMonth(d) + "</div></button>";
  }

  } else {

      body += '<div class="section-label" style="margin-top:' + (tasks.length ? "var(--sp-lg)" : "var(--sp-sm)") + '">FROM GOOGLE CALENDAR</div>' +
        '<div class="card">' + gEvents.map(googleEventRowHtml).join("") + "</div>";

  const upcoming = upcomingPreview();

      upcoming.map((u) =>
        '<div class="upcoming-row" data-open-day="' + u.iso + '"><span class="d">' + dateGroupLabel(u.iso) +
        '</span><span class="c">' + u.count + (u.count === 1 ? " task" : " tasks") + "</span></div>"
      ).join("") + "</div>";

  return (
    (() => {
      const remaining = activeCount;

        : (isToday ? (remaining === 1 ? "thing left today" : "things left today") : (remaining === 1 ? "thing planned" : "things planned"));

    '<div style="padding:0 var(--sp-lg)">' + weekStrip +
    '<div class="section-label">' + (isToday ? "TODAY" : heading.weekday.toUpperCase()) + "</div>" +
    body + upcomingHtml +
    "</div>"
  );
}

/* ---------------- GOOGLE CALENDAR (read-only, client-only OAuth) ----------------
 * Uses Google Identity Services' token-client model \u2014 no backend. The access
 * token lives only in memory (never persisted) and typically lasts ~1 hour;
 * we attempt a silent (no-popup) refresh on load and whenever it's stale, and
 * only fall back to an explicit user click if that silent attempt fails.
 * Events are fetched fresh each session, never written to IndexedDB, and are
 * strictly read-only in this app \u2014 Together never modifies Google Calendar.
 * ------------------------------------------------------------------------- */
let googleAccessToken = null;
let googleTokenExpiresAt = 0;
let googleTokenClient = null;
let googleFetchInFlight = false;

function googleClientReady() {
  return typeof google !== "undefined" && google.accounts && google.accounts.oauth2;
}
function getGoogleTokenClient() {
  if (!S.settings.googleClientId || !googleClientReady()) return null;
  if (!googleTokenClient || googleTokenClient.__forClientId !== S.settings.googleClientId) {
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: S.settings.googleClientId,
      scope: "https://www.googleapis.com/auth/calendar.readonly",
      callback: async (tokenResponse) => {
        if (tokenResponse && tokenResponse.access_token) {
          googleAccessToken = tokenResponse.access_token;
          googleTokenExpiresAt = Date.now() + (Number(tokenResponse.expires_in || 3600) * 1000);
          S.settings.googleCalendarConnected = true;
          await saveSettings();
          await fetchGoogleCalendarEvents();
        } else {
          showToast("Couldn\u2019t connect to Google Calendar.");
        }
        render();
      },
      error_callback: (err) => {
        const code = err && (err.type || err.message || err.error) ? (err.type || err.message || err.error) : "unknown";
        console.error("Google OAuth error:", err);
        showErrorBanner("Google Calendar connection failed (" + code + "). See details below.");
      },
    });
    googleTokenClient.__forClientId = S.settings.googleClientId;
  }
  return googleTokenClient;
}

async function attemptSilentGoogleReconnect() {

async function disconnectGoogleCalendar() {

  }

function normalizeGoogleEvent(item) {
  const allDay = !!(item.start && item.start.date);
  const startDate = allDay ? item.start.date : (item.start && item.start.dateTime ? item.start.dateTime.slice(0, 10) : null);
  const startTime = allDay ? null : (item.start && item.start.dateTime ? item.start.dateTime.slice(11, 16) : null);
  const endTime = allDay ? null : (item.end && item.end.dateTime ? item.end.dateTime.slice(11, 16) : null);
  return {
    id: "g_" + item.id,
    title: item.summary || "(untitled)",
    startDate,
    startTime,
    endTime,
    allDay,
    location: item.location || "",
    htmlLink: item.htmlLink || "",
  };
}

async function fetchGoogleCalendarEvents() {
  if (!googleAccessToken || googleFetchInFlight) return false;
  googleFetchInFlight = true;
  try {
    const timeMin = addDaysISO(todayISO(), -14) + "T00:00:00Z";
    const timeMax = addDaysISO(todayISO(), 120) + "T00:00:00Z";
    const url = "https://www.googleapis.com/calendar/v3/calendars/primary/events" +
      "?timeMin=" + encodeURIComponent(timeMin) + "&timeMax=" + encodeURIComponent(timeMax) +
      "&singleEvents=true&orderBy=startTime&maxResults=250";
    const res = await fetch(url, { headers: { Authorization: "Bearer " + googleAccessToken } });
    if (res.status === 401) {
      // Token expired mid-session \u2014 clear it and the connected flag so the
      // UI honestly reflects "not connected" instead of showing Disconnect
      // for a session that's actually already gone.
      googleAccessToken = null;
      S.settings.googleCalendarConnected = false;
      await saveSettings();
      showToast("Google Calendar session expired \u2014 reconnect from More.");
      return false;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    S.googleEvents = (data.items || []).filter((it) => it.status !== "cancelled").map(normalizeGoogleEvent);
    S.settings.googleCalendarLastSync = Date.now();
    await saveSettings();
    return true;
  } catch (e) {
    showErrorBanner("Couldn\u2019t reach Google Calendar: " + (e && e.message ? e.message : "network error"));
    return false;
  } finally {
    googleFetchInFlight = false;
  }
}
