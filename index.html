<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Together</title>
<meta name="description" content="Everything we need to do, together." />
<meta name="theme-color" content="#F5F5F7" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<meta name="apple-mobile-web-app-title" content="Together" />
<style>
:root{
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --surface-2:#FBFBFD;
  --fill:#E5E5EA;
  --text:#1D1D1F;
  --text2:#6E6E73;
  --text3:#86868B;
  --nude:#AF52DE;
  --beige:#FF2D55;
  --olive:#34C759;
  --terracotta:#FF9500;
  --brown:#5856D6;
  --grey:#86868B;
  --line:rgba(0,0,0,.09);
  --danger:#FF3B30;
  --accent:#0071E3;
  --system-blue:#007AFF;

  --r-sm:10px;
  --r-md:16px;
  --r-lg:22px;
  --r-xl:28px;
  --r-pill:999px;

  --sp-xs:4px;
  --sp-sm:8px;
  --sp-md:16px;
  --sp-lg:24px;
  --sp-xl:32px;
  --sp-2xl:48px;

  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.07);
  --shadow-lg:0 4px 8px rgba(0,0,0,.06), 0 16px 40px rgba(0,0,0,.10);
  --shadow:var(--shadow-md);

  --dur-fast:120ms;
  --dur-normal:200ms;
  --dur-slow:320ms;
  --ease-standard:cubic-bezier(.32,.72,0,1);

  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}

:root[data-theme="dark"]{
  --bg:#000000;
  --surface:#1D1D1F;
  --surface-2:#242426;
  --fill:#2C2C2E;
  --text:#FFFFFF;
  --text2:#98989D;
  --text3:#6E6E73;
  --line:rgba(255,255,255,.14);
  --accent:#007AFF;

  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
  --shadow-lg:0 4px 8px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.5);
  --shadow:var(--shadow-md);
}
:root[data-theme="dark"] .check{background:var(--surface-2);}
:root[data-theme="dark"] .onb-logo{box-shadow:none;}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button, input, textarea, select{font-family:inherit;}
button{cursor:pointer;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{display:none;}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  padding-top:var(--safe-t);
}

/* ---------- Top bar ---------- */
.topbar{
  padding: var(--sp-md) var(--sp-lg) var(--sp-sm);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.topbar h1{
  font-size:30px;
  font-weight:650;
  letter-spacing:-0.02em;
  margin:0;
}
.topbar .sub{color:var(--text2); font-size:15px; margin-top:2px;}
.icon-btn{
  width:40px; height:40px;
  border-radius:50%;
  border:none;
  background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow);
  color:var(--text);
}
.icon-btn svg{width:20px; height:20px;}
.back-row{
  display:flex; align-items:center; gap:var(--sp-sm);
  padding: var(--sp-md) var(--sp-lg) var(--sp-sm);
}
.back-row .title{font-size:20px; font-weight:650; letter-spacing:-0.01em;}

/* ---------- View container ---------- */
#view{
  padding: 0 0 calc(var(--nav-h) + var(--safe-b) + 32px);
  min-height:60vh;
}
.view-plain{padding-bottom: calc(var(--sp-xl));}

/* ---------- Week strip ---------- */
.week-strip{
  display:flex;
  gap:6px;
  padding: var(--sp-sm) 0 var(--sp-md);
  overflow-x:auto;
}
.week-day{
  flex:1 0 auto;
  min-width:42px;
  text-align:center;
  border-radius:var(--r-md);
  padding:8px 4px;
  background:transparent;
  border:none;
  color:var(--text);
}
.week-day .dow{font-size:11px; color:var(--text2); font-weight:600; letter-spacing:0.02em;}
.week-day .dom{font-size:16px; font-weight:600; margin-top:4px;}
.week-day.active{background:var(--text); color:#fff;}
.week-day.active .dow{color:rgba(255,255,255,.7);}
.week-day.today-dot{position:relative;}
.week-day.today-dot::after{
  content:"";
  position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
  width:4px; height:4px; border-radius:50%;
  background:var(--accent);
}
.week-day.active.today-dot::after{background:#fff;}

/* ---------- Section labels ---------- */
.section-label{
  font-size:13px;
  font-weight:650;
  color:var(--text2);
  margin: var(--sp-lg) 0 var(--sp-sm);
}

/* ---------- Finance ---------- */
.fin-label{font-size:11px; font-weight:700; color:var(--text2); letter-spacing:.02em;}
.fin-big{font-size:34px; font-weight:750; letter-spacing:-0.02em; color:var(--text); line-height:1.15;}
.fin-mid{display:block; font-size:19px; font-weight:700; color:var(--text); margin-top:2px;}
.fin-hero{padding:20px;}
.fin-hero-main{margin-bottom:14px;}
.fin-hero-sub{display:flex; gap:28px; margin-bottom:14px;}
.fin-status-pill{
  display:inline-block; font-size:11px; font-weight:750; letter-spacing:.03em;
  padding:4px 10px; border-radius:20px; background:var(--fill); color:var(--text);
  margin-bottom:6px;
}
.fin-status-pill.attn{background:var(--terracotta); color:#fff;}
.fin-status-pill.income{background:var(--olive); color:#fff;}
.fin-status-text{color:var(--text2); margin:0; font-size:14px;}
.val.income, .fin-mid.income{color:var(--olive);}
.val.expense, .fin-mid.expense{color:var(--terracotta);}
.cat-snap-row{padding:8px 0;}
.cat-snap-top{display:flex; align-items:center; gap:8px; margin-bottom:5px;}
.cat-snap-top .lbl{flex:1;}
.cat-snap-bar-bg{height:5px; border-radius:3px; background:var(--fill); overflow:hidden;}
.cat-snap-bar{height:100%; border-radius:3px;}
.check-label{display:flex; align-items:center; gap:8px; font-size:15px; color:var(--text); cursor:pointer;}
.check-label input{width:18px; height:18px;}

/* ---------- Task rows ---------- */
.task-row{
  display:flex;
  align-items:flex-start;
  gap:var(--sp-md);
  padding:13px 4px;
  border-bottom:1px solid var(--line);
}
.task-row:last-child{border-bottom:none;}
.check{
  width:24px; height:24px;
  border-radius:50%;
  border:1.6px solid var(--grey);
  flex:0 0 24px;
  margin-top:2px;
  display:flex; align-items:center; justify-content:center;
  background:#fff;
}
.check.done{background:var(--olive); border-color:var(--olive);}
.check svg{width:13px; height:13px; opacity:0; color:#fff;}
.check.done svg{opacity:1;}
.task-main{flex:1; min-width:0;}
.task-row-top{display:flex; align-items:baseline; gap:8px;}
.task-title{
  flex:1; min-width:0;
  font-size:16px; font-weight:560; letter-spacing:-0.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.task-title.done{color:var(--text2); text-decoration:line-through; text-decoration-color:var(--grey);}
.lbl.done{color:var(--text2); text-decoration:line-through; text-decoration-color:var(--grey);}
.task-meta{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  margin-top:3px;
  font-size:12.5px;
  color:var(--text2);
  line-height:1.5;
}
.task-meta-when{flex:0 0 auto;}
.task-meta-cat{white-space:nowrap;}
.dot{width:6px; height:6px; border-radius:50%; flex:0 0 6px;}
.dot.olive{background:var(--olive);}
.dot.brown{background:var(--brown);}
.dot.terracotta{background:var(--terracotta);}
.dot.beige{background:var(--beige);}
.dot.nude{background:var(--nude);}
.dot.grey{background:var(--grey);}
.pflag{width:7px; height:7px; border-radius:2px; flex:0 0 7px;}
.pflag.urgent{background:var(--danger);}
.pflag.high{background:var(--terracotta);}
.pflag.normal{background:var(--grey);}
.pflag.low{background:transparent; border:1.4px solid var(--grey);}
.assignee{
  margin-left:auto;
  font-size:12px; font-weight:650;
  color:var(--text2);
  background:var(--fill);
  border-radius:20px;
  padding:2px 8px;
  flex:0 0 auto;
}
.google-badge{
  margin-left:auto;
  font-size:11px; font-weight:650;
  color:var(--accent);
  background:none;
  border:1px solid var(--accent);
  border-radius:20px;
  padding:1px 8px;
  flex:0 0 auto;
}
.google-event-row{cursor:pointer;}
.google-event-row .task-title{color:var(--text2);}
.row-amount{
  font-size:13px; font-weight:700;
  flex:0 0 auto;
  color:var(--text);
}
.row-amount.income{color:var(--olive);}
.row-amount.expense{color:var(--text2);}

/* ---------- Cards ---------- */
.card{
  background:var(--surface);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:var(--sp-md) var(--sp-lg);
}
.upcoming-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}
.upcoming-row:last-child{border-bottom:none;}
.upcoming-row .d{font-size:15px; font-weight:600;}
.upcoming-row .c{font-size:14px; color:var(--text2);}

/* ---------- Empty states ---------- */
.empty{
  text-align:center;
  padding: 56px var(--sp-lg) 24px;
  color:var(--text2);
}
.empty h3{font-size:19px; color:var(--text); font-weight:650; margin:0 0 6px; letter-spacing:-0.01em;}
.empty p{font-size:15px; margin:0; line-height:1.5;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;
  left:0; right:0; bottom:0;
  max-width:560px;
  margin:0 auto;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(247,245,242,.88);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  display:flex;
  z-index:40;
}
.nav-item{
  flex:1;
  min-width:0;
  border:none; background:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px;
  color:var(--text2);
  font-size:10.5px;
  font-weight:600;
  white-space:nowrap;
}
.nav-item svg{width:22px; height:22px; flex:0 0 auto;}
.nav-item.active{color:var(--text);}
.fab{
  position:fixed;
  right:calc((100vw - min(560px, 100vw))/2 + 20px);
  bottom:calc(var(--nav-h) + var(--safe-b) + 18px);
  width:58px; height:58px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  border:none;
  box-shadow:0 8px 24px rgba(0,113,227,.32);
  display:flex; align-items:center; justify-content:center;
  z-index:45;
  transition:transform .15s ease;
}
.fab:active{transform:scale(.92);}
.fab svg{width:26px; height:26px;}

/* ---------- Sheets & full screens ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(36,35,33,.32);
  z-index:60;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
}
.overlay.show{opacity:1; pointer-events:auto;}
.sheet{
  position:fixed;
  left:0; right:0; bottom:0;
  max-width:560px;
  margin:0 auto;
  background:var(--bg);
  border-radius:24px 24px 0 0;
  z-index:61;
  max-height:88vh;
  transform:translateY(100%);
  transition:transform .28s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column;
  padding-bottom:var(--safe-b);
}
.sheet.show{transform:translateY(0);}
.sheet-handle{
  width:36px; height:5px; border-radius:3px;
  background:var(--grey);
  margin:10px auto 2px;
}
.sheet-head{
  display:flex; align-items:center; justify-content:space-between;
  padding: var(--sp-sm) var(--sp-lg) var(--sp-md);
}
.sheet-head .title{font-size:18px; font-weight:650;}
.sheet-body{overflow-y:auto; padding: 0 var(--sp-lg) var(--sp-lg);}
.link-btn{border:none; background:none; color:var(--accent); font-weight:600; font-size:15px; padding:6px;}

.fullscreen{
  position:fixed; inset:0;
  background:var(--bg);
  z-index:70;
  overflow-y:auto;
  transform:translateY(16px);
  opacity:0;
  pointer-events:none;
  transition:transform .22s ease, opacity .22s ease;
  padding-top:var(--safe-t);
}
.fullscreen.show{transform:translateY(0); opacity:1; pointer-events:auto;}

/* ---------- Forms ---------- */
.field{margin-bottom:var(--sp-lg);}
.field label{display:block; font-size:13px; font-weight:650; color:var(--text2); margin-bottom:8px;}
.field input[type=text], .field input[type=date], .field input[type=time], .field textarea, .field input[type=search]{
  width:100%;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:var(--r-md);
  padding:13px 14px;
  font-size:16px;
  color:var(--text);
}
.field textarea{min-height:88px; resize:vertical;}
.title-input{
  width:100%;
  border:none;
  background:none;
  font-size:24px;
  font-weight:650;
  letter-spacing:-0.01em;
  padding:6px 0 14px;
  border-bottom:1px solid var(--line);
}
.title-input::placeholder{color:var(--grey);}
.title-input:focus, input:focus, textarea:focus{outline:none; border-color:var(--accent);}

.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:20px;
  padding:9px 16px;
  font-size:14px;
  font-weight:560;
  color:var(--text);
  display:flex; align-items:center; gap:6px;
}
.chip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.chip.cat-active{color:#fff; border-color:transparent;}

.btn{
  width:100%;
  border:none;
  border-radius:var(--r-md);
  padding:16px;
  font-size:16px;
  font-weight:650;
  background:var(--accent);
  color:#fff;
}
.btn:active{opacity:.85;}
.btn.secondary{background:var(--surface); color:var(--text); box-shadow:var(--shadow);}
.btn.danger{background:var(--danger); color:#fff;}
.btn.ghost{background:none; color:var(--text2); box-shadow:none;}
.btn-row{display:flex; gap:10px;}

/* ---------- Task detail ---------- */
.detail-hero{padding: var(--sp-sm) 0 var(--sp-lg);}
.detail-cat{
  display:inline-flex; align-items:center; gap:6px;
  font-size:13px; font-weight:650; color:var(--text2);
  margin-bottom:8px;
}
.detail-title{font-size:27px; font-weight:680; letter-spacing:-0.02em; line-height:1.2;}
.detail-when{color:var(--text2); font-size:15px; margin-top:8px;}
.detail-section{
  padding: var(--sp-lg) 0;
  border-top:1px solid var(--line);
}
.detail-section h4{
  font-size:13px; font-weight:650; color:var(--text2); margin:0 0 12px; letter-spacing:0.01em;
}
.detail-people{display:flex; gap:8px; flex-wrap:wrap;}
.person-pill{
  background:var(--fill); border-radius:20px; padding:7px 14px; font-size:14px; font-weight:600;
}
.loc-row{display:flex; align-items:center; justify-content:space-between;}
.loc-name{font-size:16px; font-weight:600;}
.loc-addr{color:var(--text2); font-size:14px; margin-top:2px;}
.maps-link{color:var(--accent); font-weight:650; font-size:14px; white-space:nowrap;}
.notes-text{font-size:15px; line-height:1.55; white-space:pre-wrap;}
.checklist-row{display:flex; align-items:center; gap:12px; padding:9px 0;}
.checklist-title{flex:1; font-size:15px;}
.checklist-title.done{color:var(--text2); text-decoration:line-through;}
.progress-track{height:5px; background:var(--line); border-radius:3px; margin-top:10px; overflow:hidden;}
.progress-fill{height:100%; background:var(--olive);}
.attach-row{display:flex; align-items:center; gap:12px; padding:10px 0;}
.attach-icon{
  width:40px; height:40px; border-radius:10px; background:var(--fill);
  display:flex; align-items:center; justify-content:center; flex:0 0 40px;
}
.attach-icon svg{width:18px; height:18px;}
.attach-name{font-size:15px; font-weight:560;}
.attach-size{font-size:12px; color:var(--text2);}
.detail-actions{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  padding-top:var(--sp-lg);
}

/* ---------- Calendar ---------- */
.cal-nav{display:flex; align-items:center; justify-content:space-between; padding:6px 0 var(--sp-md);}
.cal-nav .month{font-size:19px; font-weight:650; letter-spacing:-0.01em;}
.cal-grid-head{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; color:var(--text2); font-size:12px; font-weight:650; margin-bottom:6px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.cal-cell{
  min-height:64px;
  min-width:0;
  border:none; background:none;
  display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start;
  border-radius:12px;
  font-size:11px;
  color:var(--text);
  position:relative;
  padding:4px 3px 5px;
  text-align:left;
  transition:background .12s ease;
}
.cal-cell .daynum{font-size:12px; font-weight:650; align-self:center; width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%; margin-bottom:2px;}
.cal-cell.other-month{color:var(--grey);}
.cal-cell.other-month .day-event{opacity:.55;}
.cal-cell.selected{background:var(--fill);}
.cal-cell.selected .daynum{background:var(--text); color:#fff;}
.cal-cell.is-today .daynum{background:var(--accent); color:#fff;}
.cal-cell.drop-target{background:var(--olive); outline:2px solid var(--olive);}
.day-events{display:flex; flex-direction:column; gap:0; overflow:hidden; min-width:0;}
.day-event{
  display:block;
  min-width:0;
  max-width:100%;
  font-size:10.5px;
  line-height:1.35;
  padding:3.5px 4px;
  border-radius:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  background:var(--surface);
  box-shadow:0 1px 0 var(--bg), 0 1px 1px rgba(36,35,33,.05);
  touch-action:none;
  user-select:none; -webkit-user-select:none;
  cursor:grab;
}
.day-event.done{opacity:.45; text-decoration:line-through;}
.day-event.dragging{opacity:.3;}
.day-event .t{font-weight:650; color:var(--text2); margin-right:3px;}
.cal-more{font-size:10px; color:var(--text2); font-weight:650; padding:1px 4px;}
.drag-ghost{
  position:fixed; z-index:200; pointer-events:none;
  background:var(--text); color:#fff;
  font-size:12px; font-weight:600;
  padding:8px 14px; border-radius:12px;
  box-shadow:0 12px 28px rgba(0,0,0,.3);
  transform:translate(-50%,-120%) scale(1.04);
  white-space:nowrap;
}
.cal-dots{display:flex; gap:2px;}
.cal-dots .d{width:4px; height:4px; border-radius:50%;}
.day-schedule{margin-top:var(--sp-lg);}
.day-schedule h3{font-size:17px; font-weight:650; margin:0 0 6px;}

/* ---------- Toast ---------- */
.toast{
  position:fixed;
  left:50%; bottom:calc(var(--nav-h) + var(--safe-b) + 14px);
  transform:translate(-50%, 20px);
  background:var(--text); color:#fff;
  padding:13px 18px;
  border-radius:16px;
  font-size:14px;
  display:flex; align-items:center; gap:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  z-index:90;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  max-width:min(480px, 88vw);
}
.toast.show{opacity:1; transform:translate(-50%,0); pointer-events:auto;}
.toast button{background:none; border:none; color:var(--accent); font-weight:700; font-size:14px;}

/* ---------- Segmented control ---------- */
.segment{display:flex; background:var(--surface); border-radius:12px; padding:3px; box-shadow:var(--shadow);}
.segment button{flex:1; border:none; background:none; padding:9px 4px; font-size:13px; font-weight:650; color:var(--text2); border-radius:9px;}
.segment button.active{background:var(--fill); color:var(--text);}

<script>
/* =========================================================
   TOGETHER — local-first PWA
   Single JS file: IndexedDB layer, state, router, views.
   ========================================================= */

/* ---------------- Visible error reporting (so failures are never silent) ---------------- */
function showErrorBanner(msg) {
  try {
    const el = document.getElementById("errBanner");
    if (!el) return;
    el.textContent = "Something went wrong: " + msg + " (tap to dismiss)";
    el.style.display = "block";
    el.onclick = () => { el.style.display = "none"; };
  } catch (e) { /* ignore */ }
}
window.addEventListener("error", (e) => showErrorBanner(e.message || String(e.error)));
window.addEventListener("unhandledrejection", (e) => showErrorBanner((e.reason && e.reason.message) || String(e.reason)));

/* ---------------- IndexedDB layer ---------------- */
const DB_NAME = "together-db";
const DB_VERSION = 4;
let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("tasks")) {
        const s = db.createObjectStore("tasks", { keyPath: "id" });
        s.createIndex("startDate", "startDate");
        s.createIndex("status", "status");
      }
      if (!db.objectStoreNames.contains("categories")) {
        db.createObjectStore("categories", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("settings")) {
        db.createObjectStore("settings", { keyPath: "key" });
      }
      if (!db.objectStoreNames.contains("accounts")) {
        db.createObjectStore("accounts", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("balanceSnapshots")) {
        db.createObjectStore("balanceSnapshots", { keyPath: "monthKey" });
      }
      if (!db.objectStoreNames.contains("shoppingItems")) {
        db.createObjectStore("shoppingItems", { keyPath: "id" });
      }
      if (!db.objectStoreNames.contains("stuffItems")) {
        db.createObjectStore("stuffItems", { keyPath: "id" });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function tx(storeName, mode) {
  return dbInstance.transaction(storeName, mode).objectStore(storeName);
}
function idbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readonly").getAll();
    r.onsuccess = () => resolve(r.result || []);
    r.onerror = () => reject(r.error);
  });
}
function idbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readonly").get(key);
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
function idbPut(storeName, val) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readwrite").put(val);
    r.onsuccess = () => resolve(val);
    r.onerror = () => reject(r.error);
  });
}
function idbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readwrite").delete(key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}
function idbClear(storeName) {
  return new Promise((resolve, reject) => {
    const r = tx(storeName, "readwrite").clear();
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

/* ---------------- Utilities ---------------- */
function uid() {
  return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function isoToDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function addDaysISO(iso, n) {
  const d = isoToDate(iso);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
function addMonthsISO(iso, n) {
  const d = isoToDate(iso);
  d.setMonth(d.getMonth() + n);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
}
const WEEKDAYS_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const WEEKDAYS_LONG = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function weekdayShort(iso) { return WEEKDAYS_SHORT[isoToDate(iso).getDay()]; }
function weekdayLong(iso) { return WEEKDAYS_LONG[isoToDate(iso).getDay()]; }
function dayOfMonth(iso) { return isoToDate(iso).getDate(); }
function monthLong(iso) { return MONTHS_LONG[isoToDate(iso).getMonth()]; }
function monthStartISO(iso) { const d = isoToDate(iso); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-01"; }
function monthEndISO(iso) { return addDaysISO(addMonthsISO(monthStartISO(iso), 1), -1); }
function daysInMonthISO(iso) { return dayOfMonth(monthEndISO(iso)); }
function fmtDateHeading(iso) {
  return { weekday: weekdayLong(iso), dayMonth: dayOfMonth(iso) + " " + monthLong(iso) };
}
function fmtTime(t) { return t || ""; }
function isSameISO(a, b) { return a === b; }
function greeting() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  return "Good evening";
}
function escapeHtml(str) {
  return (str || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function fileSizeLabel(bytes) {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}
function isLikelyUrl(v) {
  return /^https?:\/\//i.test((v || "").trim());
}
// Whole euros unless there are real cents, so "€72" stays clean but "€72.50" isn't rounded away.
function fmtMoney(n) {
  const v = Number(n) || 0;
  const abs = Math.abs(v);
  const hasCents = Math.round(abs * 100) % 100 !== 0;
  const body = abs.toLocaleString("pt-PT", { minimumFractionDigits: hasCents ? 2 : 0, maximumFractionDigits: 2 });
  return (v < 0 ? "\u2212" : "") + "\u20ac" + body;
}
function fmtMoneySigned(n) {
  const v = Number(n) || 0;
  return (v > 0 ? "+" : "") + fmtMoney(v);
}
function extractPlaceNameFromMapsUrl(url) {
  try {
    const u = new URL(url);
    const placeMatch = u.pathname.match(/\/place\/([^/]+)/);
    if (placeMatch) return decodeURIComponent(placeMatch[1].replace(/\+/g, " "));
    const q = u.searchParams.get("q") || u.searchParams.get("query") || u.searchParams.get("daddr");
    if (q) return decodeURIComponent(q.replace(/\+/g, " "));
  } catch (e) { /* not a parseable absolute URL */ }
  return null;
}

/* ---------------- Default data ---------------- */
// tracksMoney controls whether the Amount field appears when creating/editing
// a task in this category, and whether it's included in financial dashboard
// totals. Adjustable per-category (including these defaults) from
// More -> Categories -> edit.
const DEFAULT_CATEGORIES = [
  { id: "family",       name: "Family",       color: "olive",      tracksMoney: false },
  { id: "school",       name: "School",       color: "brown",      tracksMoney: true },
  { id: "groceries",    name: "Groceries",    color: "terracotta", tracksMoney: true },
  { id: "dinner",       name: "Dinner",       color: "terracotta", tracksMoney: true },
  { id: "dayout",       name: "Day Out",      color: "olive",      tracksMoney: false },
  { id: "trips",        name: "Trips",        color: "olive",      tracksMoney: true },
  { id: "holidays",     name: "Holidays",     color: "terracotta", tracksMoney: true },
  { id: "home",         name: "Home",         color: "beige",      tracksMoney: true },
  { id: "car",          name: "Car",          color: "brown",      tracksMoney: true },
  { id: "finance",      name: "Finance",      color: "brown",      tracksMoney: true },
  { id: "appointments", name: "Appointments", color: "nude",       tracksMoney: true },
  { id: "personal",     name: "Personal",     color: "nude",       tracksMoney: false },
  { id: "shopping",     name: "Shopping",     color: "terracotta", tracksMoney: true },
  { id: "other",        name: "Other",        color: "grey",       tracksMoney: false },
];

const PRIORITIES = ["urgent", "high", "normal", "low"];
const PRIORITY_LABEL = { urgent: "Urgent", high: "High", normal: "Normal", low: "Low" };
const REMINDER_OPTIONS = [
  { minutes: 0, label: "At task time" },
  { minutes: 5, label: "5 minutes before" },
  { minutes: 10, label: "10 minutes before" },
  { minutes: 15, label: "15 minutes before" },
  { minutes: 30, label: "30 minutes before" },
  { minutes: 60, label: "1 hour before" },
  { minutes: 120, label: "2 hours before" },
  { minutes: 1440, label: "1 day before" },
];

/* ---------------- Global state ---------------- */
const S = {
  settings: null,
  categories: [],
  tasks: [],
  accounts: [],
  route: "#/today",
  calMonthAnchor: addMonthsISO(todayISO(), 1),
  calSelected: addMonthsISO(todayISO(), 1),
  financeMonthAnchor: addMonthsISO(todayISO(), 1),
  balanceSnapshots: [],
  shoppingItems: [],
  stuffItems: [],
  stuffSearch: "",
  googleEvents: [], // external, read-only, never persisted \u2014 refetched each session
  todaySelected: todayISO(),
  tasksFilter: { person: "all", priority: null, category: null, status: null, date: null },
  tasksGroup: "date",
  tasksSort: "datetime",
  tasksSearch: "",
  notifiedKeys: new Set(),
  lastBriefingDate: null,
};
window.S = S; // exposed for debugging in devtools

function catById(id) { return S.categories.find((c) => c.id === id) || DEFAULT_CATEGORIES[DEFAULT_CATEGORIES.length - 1]; }
function personLabel(assignedTo) {
  const names = S.settings.names;
  if (assignedTo === "sergio") return names.sergio;
  if (assignedTo === "rita") return names.rita;
  return "Both";
}
function personShort(assignedTo) {
  if (assignedTo === "both") return "Both";
  return personLabel(assignedTo);
}

/* ---------------- Data access / CRUD ---------------- */
/* ---------------- Firestore (shared household data) ----------------
 * Bridges into the tiny ES-module script in index.html that talks to the
 * Firebase SDK (window.__firebase) \u2014 app.js itself stays a plain classic
 * script, same as always, just with this one doorway out to Firestore.
 * Only tasks/categories/accounts/balanceSnapshots/shoppingItems/stuffItems
 * are shared this way; settings (theme, Google Calendar connection, etc.)
 * stay local per-device, since those genuinely shouldn't sync between phones.
 * ------------------------------------------------------------------- */
const HOUSEHOLD_ID = "sr-household-7f2c9ae4d1";
window.HOUSEHOLD_ID = HOUSEHOLD_ID; // exposed for testing, same pattern as the other constants
function fsReady() { return !!(window.__firebase && window.__firebaseReady && !window.__firebaseInitError); }
function fsColl(name) { return window.__firebase.collection(window.__firebase.db, "households", HOUSEHOLD_ID, name); }
function fsDocRef(name, id) { return window.__firebase.doc(window.__firebase.db, "households", HOUSEHOLD_ID, name, id); }
function waitForFirebaseReady() {
  return new Promise((resolve) => {
    if (window.__firebaseReady) return resolve();
    window.addEventListener("firebase-ready", () => resolve(), { once: true });
    setTimeout(resolve, 6000); // don't hang the app forever if the module script never loads
  });
}
async function fsSave(name, obj, id) {
  if (!fsReady()) return;
  try { await window.__firebase.setDoc(fsDocRef(name, id || obj.id), obj); }
  catch (e) { console.error("Firestore save failed (" + name + "):", e); showErrorBanner("Couldn\u2019t save to the shared household data. Changes are only on this device for now."); }
}
async function fsRemove(name, id) {
  if (!fsReady()) return;
  try { await window.__firebase.deleteDoc(fsDocRef(name, id)); }
  catch (e) { console.error("Firestore delete failed (" + name + "):", e); }
}
function fsListen(name, stateKey) {
  window.__firebase.onSnapshot(fsColl(name), (snap) => {
    S[stateKey] = snap.docs.map((d) => d.data());
    render();

}

// One-time, per-device: push whatever's currently in THIS device's local
// storage up to the shared household in Firestore. Gated on a local flag
// (not a shared "has anyone migrated yet" marker) so that if Rita's phone
// and Sergio's phone both have their own local history, both get merged in
// \u2014 upserting by the item's existing id makes this safe even if it runs
// on both devices, or runs twice.
async function migrateLocalDataToFirestoreIfNeeded() {
  if (!fsReady() || S.settings.firestoreMigrated) return;
  const ops = [];
  for (const c of S.categories) ops.push({ name: "categories", id: c.id, data: c });
  for (const t of S.tasks) ops.push({ name: "tasks", id: t.id, data: t });
  for (const a of S.accounts) ops.push({ name: "accounts", id: a.id, data: a });
  for (const s of S.balanceSnapshots) ops.push({ name: "balanceSnapshots", id: s.monthKey, data: s });
  for (const i of S.shoppingItems) ops.push({ name: "shoppingItems", id: i.id, data: i });
  for (const i of S.stuffItems) ops.push({ name: "stuffItems", id: i.id, data: i });
  const CHUNK = 400; // Firestore batches cap at 500 writes
  try {
    for (let i = 0; i < ops.length; i += CHUNK) {
      const batch = window.__firebase.writeBatch(window.__firebase.db);
      for (const op of ops.slice(i, i + CHUNK)) batch.set(fsDocRef(op.name, op.id), op.data);
      await batch.commit();
    }
    S.settings.firestoreMigrated = true;
    await saveSettings();
  } catch (e) {
    console.error("Firestore migration failed:", e);
    showErrorBanner("Couldn\u2019t upload this device\u2019s data to the shared household yet \u2014 will retry next time you open the app.");
  }
}

function activeTasksForDate(iso) {
  return S.tasks
    .filter((t) => t.startDate === iso && t.showOnCalendar !== false)
    .sort((a, b) => {
      if (a.allDay && !b.allDay) return -1;
      if (!a.allDay && b.allDay) return 1;
      return (a.startTime || "").localeCompare(b.startTime || "");
    });
}
function countForDate(iso) {
  return S.tasks.filter((t) => t.startDate === iso && t.status !== "completed").length;
}
function upcomingPreview() {
  const out = [];
  for (let i = 1; i <= 6 && out.length < 3; i++) {
    const iso = addDaysISO(todayISO(), i);
    const c = countForDate(iso);
    if (c > 0) out.push({ iso, count: c });
  }
  return out;
}
function monthMatrix(anchorIso) {
  const d = isoToDate(anchorIso);
  const year = d.getFullYear(), month = d.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay(); // 0 = Sunday
  const gridStart = new Date(year, month, 1 - startOffset);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const cd = new Date(gridStart);
    cd.setDate(gridStart.getDate() + i);
    const iso = cd.getFullYear() + "-" + pad2(cd.getMonth() + 1) + "-" + pad2(cd.getDate());
    cells.push({ iso, day: cd.getDate(), otherMonth: cd.getMonth() !== month });
  }
  return cells;
}

function taskMatchesFilter(t) {
  const f = S.tasksFilter;
  // Finance-tracked items are hidden from the general Tasks list by default —
  // they live on the Finance Dashboard instead — unless the person is
  // specifically filtering by that category or searching for it by name.
  if (t.showOnCalendar === false && !(f.category && f.category.includes(t.categoryId)) && !S.tasksSearch) return false;
  if (f.person && f.person !== "all") {
    if (f.person === "both") { if (t.assignedTo !== "both") return false; }
    else if (t.assignedTo !== f.person && t.assignedTo !== "both") return false;
  }
  if (f.priority && !f.priority.includes(t.priority)) return false;
  if (f.category && !f.category.includes(t.categoryId)) return false;
  if (f.status) {
    if (f.status === "upcoming" && t.status !== "upcoming") return false;
    if (f.status === "in_progress" && t.status !== "in_progress") return false;
    if (f.status === "waiting" && t.status !== "waiting") return false;
    if (f.status === "completed" && t.status !== "completed") return false;
  } else {
    if (t.status === "completed") return false;
  }
  if (f.date) {
    const today = todayISO();
    if (f.date === "today" && t.startDate !== today) return false;
    if (f.date === "tomorrow" && t.startDate !== addDaysISO(today, 1)) return false;
    if (f.date === "week" && (t.startDate < today || t.startDate > addDaysISO(today, 7))) return false;
    if (f.date === "month" && (t.startDate < today || t.startDate > addMonthsISO(today, 1))) return false;
  }
  if (S.tasksSearch) {
    const q = S.tasksSearch.toLowerCase();
    const hay = [t.title, t.notes, t.locationName, catById(t.categoryId).name]
      .join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function filteredSortedTasks() {
  let list = S.tasks.filter(taskMatchesFilter);
  const prioRank = { urgent: 0, high: 1, normal: 2, low: 3 };
  if (S.tasksSort === "datetime") {
    list.sort((a, b) => (a.startDate + (a.startTime || "99:99")).localeCompare(b.startDate + (b.startTime || "99:99")));
  } else if (S.tasksSort === "priority") {
    list.sort((a, b) => prioRank[a.priority] - prioRank[b.priority]);
  } else if (S.tasksSort === "category") {
    list.sort((a, b) => catById(a.categoryId).name.localeCompare(catById(b.categoryId).name));
  } else if (S.tasksSort === "created") {
    list.sort((a, b) => b.createdAt - a.createdAt);
  }
  return list;
}

function groupTasks(list) {
  const groups = [];
  if (S.tasksGroup === "none") return [{ label: null, items: list }];
  if (S.tasksGroup === "date") {
    const map = new Map();
    for (const t of list) {
      const key = t.startDate || "No date";
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(t);
    }
    for (const [key, items] of [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
      groups.push({ label: dateGroupLabel(key), items });
    }
  } else if (S.tasksGroup === "priority") {
    for (const p of PRIORITIES) {
      const items = list.filter((t) => t.priority === p);
      if (items.length) groups.push({ label: PRIORITY_LABEL[p], items });
    }
  } else if (S.tasksGroup === "category") {
    for (const c of S.categories) {
      const items = list.filter((t) => t.categoryId === c.id);
      if (items.length) groups.push({ label: c.name, items });
    }
  }
  return groups;
}
function dateGroupLabel(iso) {
  if (iso === "No date") return "No date";
  const today = todayISO();
  if (iso === today) return "Today";
  if (iso === addDaysISO(today, 1)) return "Tomorrow";
  return weekdayLong(iso) + ", " + dayOfMonth(iso) + " " + monthLong(iso);
}

    body = '<div class="empty"><h3>Nothing planned' + (isToday ? " today" : "") + ".</h3><p>Enjoy the quiet.</p></div>";
  } else {

      ).join("") + "</div>";
  }

  return (
    '<div class="topbar"><div><h1>' + greeting() + "</h1><div class=\"sub\">" + heading.weekday + " \u00b7 " + heading.dayMonth + "</div></div></div>" +
    '<div style="padding:0 var(--sp-lg)">' + weekStrip +

      (activeCount ? " \u00b7 " + activeCount + (activeCount === 1 ? " thing" : " things") : "") + "</div>" +

  );

/* ---------------- GOOGLE CALENDAR (read-only, client-only OAuth) ----------------
 * Uses Google Identity Services' token-client model \u2014 no backend. The access
 * token lives only in memory (never persisted) and typically lasts ~1 hour;
 * we attempt a silent (no-popup) refresh on load and whenever it's stale, and
 * only fall back to an explicit user click if that silent attempt fails.
 * Events are fetched fresh each session, never written to IndexedDB, and are
 * strictly read-only in this app \u2014 Together never modifies Google Calendar.
 * ------------------------------------------------------------------------- */
let googleAccessToken = null;
let googleTokenExpiresAt = 0;
let googleTokenClient = null;
let googleFetchInFlight = false;

function googleClientReady() {
  return typeof google !== "undefined" && google.accounts && google.accounts.oauth2;
}
function getGoogleTokenClient() {
  if (!S.settings.googleClientId || !googleClientReady()) return null;
  if (!googleTokenClient || googleTokenClient.__forClientId !== S.settings.googleClientId) {
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: S.settings.googleClientId,
      scope: "https://www.googleapis.com/auth/calendar.readonly",
      callback: async (tokenResponse) => {
        if (tokenResponse && tokenResponse.access_token) {
          googleAccessToken = tokenResponse.access_token;
          googleTokenExpiresAt = Date.now() + (Number(tokenResponse.expires_in || 3600) * 1000);
          S.settings.googleCalendarConnected = true;
          await saveSettings();
          await fetchGoogleCalendarEvents();
        } else {
          showToast("Couldn\u2019t connect to Google Calendar.");
        }
        render();
      },
      error_callback: (err) => {
        const code = err && (err.type || err.message || err.error) ? (err.type || err.message || err.error) : "unknown";
        console.error("Google OAuth error:", err);
        showErrorBanner("Google Calendar connection failed (" + code + "). See details below.");
      },
    });
    googleTokenClient.__forClientId = S.settings.googleClientId;
  }
  return googleTokenClient;
}

function connectGoogleCalendar() {
  const client = getGoogleTokenClient();
  if (!client) { showToast("Enter your Google Client ID above first."); return; }
  client.requestAccessToken({ prompt: "consent" });
}

async function attemptSilentGoogleReconnect() {
  if (!S.settings.googleClientId || !S.settings.googleCalendarConnected) return;
  const client = getGoogleTokenClient();
  if (!client) return;
  try { client.requestAccessToken({ prompt: "" }); } catch (e) { /* ignore \u2014 user can reconnect manually */ }
}

async function disconnectGoogleCalendar() {
  if (googleAccessToken && googleClientReady()) {
    try { google.accounts.oauth2.revoke(googleAccessToken, () => {}); } catch (e) {}
  }
  googleAccessToken = null;
  googleTokenExpiresAt = 0;
  S.googleEvents = [];
  S.settings.googleCalendarConnected = false;
  await saveSettings();
  render();
}

function normalizeGoogleEvent(item) {
  const allDay = !!(item.start && item.start.date);
  const startDate = allDay ? item.start.date : (item.start && item.start.dateTime ? item.start.dateTime.slice(0, 10) : null);
  const startTime = allDay ? null : (item.start && item.start.dateTime ? item.start.dateTime.slice(11, 16) : null);
  const endTime = allDay ? null : (item.end && item.end.dateTime ? item.end.dateTime.slice(11, 16) : null);
  return {
    id: "g_" + item.id,
    title: item.summary || "(untitled)",
    startDate,
    startTime,
    endTime,
    allDay,
    location: item.location || "",
    htmlLink: item.htmlLink || "",
  };
}

async function fetchGoogleCalendarEvents() {
  if (!googleAccessToken || googleFetchInFlight) return false;
  googleFetchInFlight = true;
  try {
    const timeMin = addDaysISO(todayISO(), -14) + "T00:00:00Z";
    const timeMax = addDaysISO(todayISO(), 120) + "T00:00:00Z";
    const url = "https://www.googleapis.com/calendar/v3/calendars/primary/events" +
      "?timeMin=" + encodeURIComponent(timeMin) + "&timeMax=" + encodeURIComponent(timeMax) +
      "&singleEvents=true&orderBy=startTime&maxResults=250";
    const res = await fetch(url, { headers: { Authorization: "Bearer " + googleAccessToken } });
    if (res.status === 401) {
      // Token expired mid-session \u2014 clear it and the connected flag so the
      // UI honestly reflects "not connected" instead of showing Disconnect
      // for a session that's actually already gone.
      googleAccessToken = null;
      S.settings.googleCalendarConnected = false;
      await saveSettings();
      showToast("Google Calendar session expired \u2014 reconnect from More.");
      return false;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    S.googleEvents = (data.items || []).filter((it) => it.status !== "cancelled").map(normalizeGoogleEvent);
    S.settings.googleCalendarLastSync = Date.now();
    await saveSettings();
    return true;
  } catch (e) {
    showErrorBanner("Couldn\u2019t reach Google Calendar: " + (e && e.message ? e.message : "network error"));
    return false;
  } finally {
    googleFetchInFlight = false;
  }
}

function googleEventsForDate(iso) {
  return S.googleEvents.filter((e) => e.startDate === iso);
}

function googleEventRowHtml(ev) {

const CAL_MAX_VISIBLE = 3;

function renderCalendar() {
  const anchor = S.calMonthAnchor;
  const cells = monthMatrix(anchor);
  const monthLabel = monthLong(anchor) + " " + isoToDate(anchor).getFullYear();
  const today = todayISO();

  let head = '<div class="cal-grid-head">' + WEEKDAYS_SHORT.map((d) => "<span>" + d + "</span>").join("") + "</div>";
  let grid = '<div class="cal-grid">';
  for (const cell of cells) {
    const dayTasks = S.tasks
      .filter((t) => t.startDate === cell.iso && t.showOnCalendar !== false)
      .sort((a, b) => (a.allDay ? "" : a.startTime || "").localeCompare(b.allDay ? "" : b.startTime || ""));
    const dayGoogle = googleEventsForDate(cell.iso);
    const totalCount = dayTasks.length + dayGoogle.length;
    const visibleTasks = dayTasks.slice(0, CAL_MAX_VISIBLE);
    const visibleGoogle = dayGoogle.slice(0, Math.max(0, CAL_MAX_VISIBLE - visibleTasks.length));
    const extra = totalCount - visibleTasks.length - visibleGoogle.length;
    const eventsHtml = visibleTasks.map((t) => {
      const done = t.status === "completed";
      const cat = catById(t.categoryId);
      const timeLabel = t.allDay ? "" : '<span class="t">' + escapeHtml(t.startTime || "") + "</span>";
      return '<span class="day-event ' + (done ? "done" : "") + '" style="border-left:3px solid var(--' + cat.color + ')" ' +
        'data-drag-task="' + t.id + '" data-drag-date="' + cell.iso + '">' + timeLabel + (timeLabel ? " " : "") + escapeHtml(t.title) + "</span>";
    }).join("") + visibleGoogle.map((ev) => {
      const timeLabel = ev.allDay ? "" : '<span class="t">' + escapeHtml(ev.startTime || "") + "</span>";
      return '<span class="day-event" style="border-left:3px dashed var(--accent);color:var(--text2)" data-google-event="' + ev.id + '">' +
        timeLabel + (timeLabel ? " " : "") + escapeHtml(ev.title) + "</span>";
    }).join("");
    const moreHtml = extra > 0 ? '<span class="cal-more" data-cal-day="' + cell.iso + '">+' + extra + " more</span>" : "";

    grid += '<div class="cal-cell ' + (cell.otherMonth ? "other-month" : "") + " " +
      (cell.iso === S.calSelected ? "selected" : "") + " " + (cell.iso === today ? "is-today" : "") +
      '" data-cal-day="' + cell.iso + '">' +
      '<span class="daynum">' + cell.day + "</span>" +
      '<div class="day-events">' + eventsHtml + moreHtml + "</div>" +
      "</div>";
  }
  grid += "</div>";

  const daySchedule = renderDaySchedule(S.calSelected);

  return (
    '<div class="topbar"><h1>Calendar</h1></div>' +
    '<div style="padding:0 var(--sp-lg)">' +
    '<div class="cal-nav">' +
      '<button class="icon-btn" id="calPrev"><svg style="transform:rotate(180deg)"><use href="#ic-chevron"/></svg></button>' +
      '<span class="month">' + monthLabel + "</span>" +
      '<button class="icon-btn" id="calNext"><svg><use href="#ic-chevron"/></svg></button>' +
    "</div>" +
    head + grid +
    daySchedule +
    "</div>"
  );
}

/* ---------------- CALENDAR DRAG-AND-DROP ---------------- */
// Long-press-then-drag pattern so it doesn't fight normal taps or page scroll,
// and works the same for touch, mouse, and pen (pointer events).
let calDrag = null;            // { taskId, originDate, startX, startY, longPressTimer, started, ghostEl, lastTargetCell }
let calDragJustHappened = false;
const CAL_DRAG_MOVE_CANCEL_PX = 8;   // touch: movement before long-press fires that cancels the drag attempt
const CAL_DRAG_LONGPRESS_MS = 260;   // touch: hold time before a drag begins
const CAL_DRAG_MOUSE_MOVE_PX = 4;    // mouse/pen: movement that starts a drag immediately, no wait

function onDayEventPointerDown(ev) {
  if (ev.button !== undefined && ev.button !== 0) return; // left-click / primary touch only
  const el = ev.currentTarget;
  const taskId = el.getAttribute("data-drag-task");
  const originDate = el.getAttribute("data-drag-date");
  const startX = ev.clientX, startY = ev.clientY;
  // Mouse (and pen) never competes with a page-scroll gesture the way touch does,
  // so it can start dragging on deliberate movement right away — no long-press needed.
  const isMouse = ev.pointerType === "mouse" || ev.pointerType === "pen";

  calDrag = {
    taskId, originDate, startX, startY,
    started: false,
    el,
    longPressTimer: isMouse ? null : setTimeout(() => beginCalDrag(), CAL_DRAG_LONGPRESS_MS),
  };

  const move = (e) => {
    if (!calDrag) return;
    const dx = e.clientX - calDrag.startX, dy = e.clientY - calDrag.startY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (!calDrag.started) {
      if (isMouse) {
        if (dist > CAL_DRAG_MOUSE_MOVE_PX) beginCalDrag();
        else return;
      } else if (dist > CAL_DRAG_MOVE_CANCEL_PX) {
        clearTimeout(calDrag.longPressTimer);
        cleanupCalDrag();
        return;
      } else {
        return;
      }
    }
    e.preventDefault();
    positionGhost(e.clientX, e.clientY);
    highlightDropTarget(e.clientX, e.clientY);
  };
  const up = (e) => {
    if (calDrag && calDrag.started) {
      finishCalDrag(e.clientX, e.clientY);
      calDragJustHappened = true;
      setTimeout(() => { calDragJustHappened = false; }, 300);
    } else if (calDrag) {
      clearTimeout(calDrag.longPressTimer);
    }
    calDrag = null;
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
  };
  window.addEventListener("pointermove", move, { passive: false });
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}

function beginCalDrag() {
  if (!calDrag) return;
  calDrag.started = true;
  calDrag.el.classList.add("dragging");
  const ghost = document.createElement("div");
  ghost.className = "drag-ghost";
  ghost.textContent = calDrag.el.textContent;
  document.body.appendChild(ghost);
  calDrag.ghostEl = ghost;
  positionGhost(calDrag.startX, calDrag.startY);
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
}

function positionGhost(x, y) {
  if (!calDrag || !calDrag.ghostEl) return;
  calDrag.ghostEl.style.left = x + "px";
  calDrag.ghostEl.style.top = y + "px";
}

function highlightDropTarget(x, y) {
  if (!calDrag) return;
  const el = document.elementFromPoint(x, y);
  const cell = el ? el.closest(".cal-cell") : null;
  if (calDrag.lastTargetCell && calDrag.lastTargetCell !== cell) {
    calDrag.lastTargetCell.classList.remove("drop-target");
  }
  if (cell) cell.classList.add("drop-target");
  calDrag.lastTargetCell = cell;
}

function cleanupCalDrag() {
  if (!calDrag) return;
  if (calDrag.el) calDrag.el.classList.remove("dragging");
  if (calDrag.ghostEl) calDrag.ghostEl.remove();
  if (calDrag.lastTargetCell) calDrag.lastTargetCell.classList.remove("drop-target");
}

async function finishCalDrag(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el ? el.closest(".cal-cell") : null;
  cleanupCalDrag();
  if (!cell) return;
  const newDate = cell.getAttribute("data-cal-day");
  if (!newDate || newDate === calDrag.originDate) return;

  const t = S.tasks.find((x2) => x2.id === calDrag.taskId);
  if (!t) return;
  const dayDelta = daysBetweenISO(calDrag.originDate, newDate);
  const prevStart = t.startDate, prevEnd = t.endDate;
  t.startDate = newDate;
  if (t.endDate) t.endDate = addDaysISO(t.endDate, dayDelta);
  await saveTask(t);
  S.calSelected = newDate;
  render();
  showToast("Moved to " + fmtDateHeading(newDate).weekday + " " + fmtDateHeading(newDate).dayMonth, "Undo", async () => {
    t.startDate = prevStart; t.endDate = prevEnd;
    await saveTask(t);
    S.calSelected = prevStart;
    render();
  });
}

function daysBetweenISO(a, b) {
  const msPerDay = 86400000;
  return Math.round((isoToDate(b) - isoToDate(a)) / msPerDay);
}

async function createTaskWithRecurrence(draft) {
  await saveTask(draft);
  if (draft.recurrence && draft.recurrence.frequency && draft.recurrence.frequency !== "none") {
    await generateRecurrenceInstances(draft);
  }
}

async function generateRecurrenceInstances(base) {
  const groupId = uid();
  base.recurrenceId = groupId;
  await saveTask(base);
  const stepFn = base.recurrence.frequency === "daily" ? (d) => addDaysISO(d, 1)
    : base.recurrence.frequency === "weekly" ? (d) => addDaysISO(d, 7)
    : base.recurrence.frequency === "monthly" ? (d) => addMonthsISO(d, 1)
    : (d) => addMonthsISO(d, 12);
  let cursor = base.startDate;
  let created = 0;
  for (let i = 0; i < 8; i++) {
    cursor = stepFn(cursor);
    const clone = JSON.parse(JSON.stringify(base));
    clone.id = uid();
    clone.startDate = cursor;
    clone.status = "upcoming";
    clone.completedAt = null;
    clone.attachments = [];
    clone.recurrenceId = groupId;
    clone.createdAt = Date.now();
    clone.updatedAt = Date.now();
    await saveTask(clone);
    created++;
  }
  return created;
}

function afterTaskDetailRender(id) {
  const view = document.getElementById("view");
  document.querySelectorAll("[data-nav]").forEach((b) => { b.onclick = () => navigate(b.getAttribute("data-nav")); });

  const t = S.tasks.find((x) => x.id === id);
  if (!t) return;

  document.querySelectorAll("[data-toggle-sub]").forEach((el) => el.onclick = async () => {
    const sid = el.getAttribute("data-toggle-sub");
    const s = t.subtasks.find((x) => x.id === sid);
    s.completed = !s.completed;
    await saveTask(t);
    render();
  });
  const newSubInput = document.getElementById("newSubInput");
  if (newSubInput) newSubInput.onkeydown = async (e) => {
    if (e.key === "Enter" && newSubInput.value.trim()) {
      t.subtasks.push({ id: uid(), title: newSubInput.value.trim(), completed: false, sortOrder: t.subtasks.length });
      await saveTask(t);
      render();
    }
  };

  const attachInput = document.getElementById("attachInput");
  if (attachInput) attachInput.onchange = async () => {
    for (const file of attachInput.files) {
      t.attachments.push({ id: uid(), fileName: file.name, fileType: file.type, fileSize: file.size, blob: file });
    }
    try {
      await saveTask(t);
      render();
    } catch (err) {
      showToast("We couldn\u2019t add this file.");
    }
  };
  document.querySelectorAll("[data-delete-attach]").forEach((el) => el.onclick = async () => {
    t.attachments = t.attachments.filter((a) => a.id !== el.getAttribute("data-delete-attach"));
    await saveTask(t);
    render();
  });
  document.querySelectorAll("[data-open-attach]").forEach((el) => el.onclick = () => {
    const a = t.attachments.find((x) => x.id === el.getAttribute("data-open-attach"));
    if (a && a.blob) { const url = URL.createObjectURL(a.blob); window.open(url, "_blank"); }
  });

  document.querySelectorAll("[data-add-field]").forEach((el) => el.onclick = () => navigate("#/task/" + id + "/edit"));

  const remBtn = document.getElementById("openReminderPicker");
  if (remBtn) remBtn.onclick = () => openReminderSheet(t);

  document.getElementById("completeBtn").onclick = () => toggleComplete(id);
  document.getElementById("duplicateBtn").onclick = async () => {
    const clone = JSON.parse(JSON.stringify(t));
    clone.id = uid();
    clone.title = t.title;
    clone.status = "upcoming";
    clone.completedAt = null;
    clone.attachments = [];
    clone.createdAt = Date.now();
    clone.updatedAt = Date.now();
    await saveTask(clone);
    render();
    showToast("Task duplicated", "Open", () => navigate("#/task/" + clone.id));
  };
  document.getElementById("deleteBtn").onclick = () => {
    const isRecurring = !!t.recurrenceId;
    openSheet(
      '<div class="sheet-body" style="padding-top:20px">' +
      '<h3 style="margin:0 0 8px">Delete this task?</h3>' +
      '<p style="color:var(--text2);font-size:15px;margin:0 0 20px">This can\u2019t be undone.</p>' +
      (isRecurring
        ? '<div class="btn-row" style="flex-direction:column;gap:8px">' +
            '<button class="btn danger" id="confirmDelOne">Delete just this one</button>' +
            '<button class="btn danger" id="confirmDelForward">Delete this and future occurrences</button>' +
            '<button class="btn ghost" id="cancelDel">Cancel</button>' +
          "</div>"
        : '<div class="btn-row"><button class="btn ghost" id="cancelDel">Cancel</button><button class="btn danger" id="confirmDel">Delete</button></div>') +
      "</div>"
    );
    document.getElementById("cancelDel").onclick = closeSheet;
    if (isRecurring) {
      document.getElementById("confirmDelOne").onclick = async () => {
        await deleteTaskById(id);
        closeSheet();
        navigate("#/today");
        showToast("Task deleted");
      };
      document.getElementById("confirmDelForward").onclick = async () => {
        const count = await deleteRecurrenceOnward(t.recurrenceId, t.startDate);
        closeSheet();
        navigate("#/today");

      document.getElementById("confirmDel").onclick = async () => {
        await deleteTaskById(id);
        closeSheet();
        navigate("#/today");
        showToast("Task deleted");
      };
    }
  };
}

function afterTaskEditRender(id) {
  const t = S.tasks.find((x) => x.id === id);
  if (!t) { navigate("#/today"); return; }

  // Keep the in-memory draft in sync as the user types, so switching a chip
  // (category/person/priority/status/recurrence) — which re-renders this
  // screen from `t` — never discards anything already typed.
  const syncField = (elId, prop, transform) => {
    const el = document.getElementById(elId);
    if (!el) return;
    const handler = () => { t[prop] = transform ? transform(el.value) : el.value; };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  };
  syncField("e-title", "title");
  syncField("e-startDate", "startDate");
  syncField("e-startTime", "startTime", (v) => v || null);
  syncField("e-endDate", "endDate", (v) => v || null);
  syncField("e-endTime", "endTime", (v) => v || null);
  syncField("e-locAddr", "locationAddress");
  syncField("e-mapsUrl", "mapsUrl");
  syncField("e-notes", "notes");
  syncField("e-amount", "amount", (v) => (v === "" ? null : Number(v)));
  const showCalEl = document.getElementById("e-showCal");
  if (showCalEl) showCalEl.addEventListener("change", () => { t.showOnCalendar = showCalEl.checked; });

  // Location name gets special handling: if you paste (or type, then move on)
  // a full maps URL in there, treat it as the maps link instead — no need to
  // juggle two fields for the same thing.
  const locNameEl = document.getElementById("e-locName");
  const mapsUrlEl = document.getElementById("e-mapsUrl");
  const applyLocNameValue = (raw) => {
    const val = (raw || "").trim();
    if (isLikelyUrl(val)) {
      if (mapsUrlEl) mapsUrlEl.value = val;
      t.mapsUrl = val;
      const friendly = extractPlaceNameFromMapsUrl(val);
      if (locNameEl) locNameEl.value = friendly || "";
      t.locationName = friendly || "";
      showToast(friendly ? "Detected a maps link \u2014 saved as \u201c" + friendly + "\u201d" : "Detected a maps link \u2014 added to the Maps link field");
    } else {
      t.locationName = raw;
    }
  };
  if (locNameEl) {
    locNameEl.addEventListener("paste", (e) => {
      const text = (e.clipboardData || window.clipboardData).getData("text");
      if (isLikelyUrl(text)) {
        e.preventDefault();
        applyLocNameValue(text);
      }
    });
    locNameEl.addEventListener("input", () => {
      if (!isLikelyUrl(locNameEl.value)) t.locationName = locNameEl.value;
    });
    locNameEl.addEventListener("change", () => applyLocNameValue(locNameEl.value));
  }

  document.getElementById("cancelEdit").onclick = () => navigate("#/task/" + id);
  document.querySelectorAll("[data-e-cat]").forEach((el) => el.onclick = () => {
    t.categoryId = el.getAttribute("data-e-cat");
    if (catById(t.categoryId).tracksMoney && !t.flowType) t.flowType = "expense";
    document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id);
  });
  document.querySelectorAll("[data-e-person]").forEach((el) => el.onclick = () => { t.assignedTo = el.getAttribute("data-e-person"); document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });
  document.querySelectorAll("[data-e-priority]").forEach((el) => el.onclick = () => { t.priority = el.getAttribute("data-e-priority"); document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });
  document.querySelectorAll("[data-e-flow]").forEach((el) => el.onclick = () => { t.flowType = el.getAttribute("data-e-flow"); document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });
  document.querySelectorAll("[data-e-status]").forEach((el) => el.onclick = () => { t.status = el.getAttribute("data-e-status"); document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });
  document.querySelectorAll("[data-e-recur]").forEach((el) => el.onclick = () => { t.recurrence = { frequency: el.getAttribute("data-e-recur") }; document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });

  document.getElementById("saveEdit").onclick = async () => {
    t.title = document.getElementById("e-title").value.trim() || t.title;
    t.startDate = document.getElementById("e-startDate").value || t.startDate;
    const st = document.getElementById("e-startTime").value;
    t.startTime = st || null;
    t.allDay = !st;
    t.endDate = document.getElementById("e-endDate").value || null;
    t.endTime = document.getElementById("e-endTime").value || null;
    t.locationName = document.getElementById("e-locName").value.trim();
    t.locationAddress = document.getElementById("e-locAddr").value.trim();
    t.mapsUrl = document.getElementById("e-mapsUrl").value.trim();
    t.notes = document.getElementById("e-notes").value;
    if (!catById(t.categoryId).tracksMoney) { t.amount = null; t.flowType = null; }
    await saveTask(t);
    if (t.recurrence && t.recurrence.frequency !== "none" && !t.recurrenceId) {
      const count = await generateRecurrenceInstances(t);
      showToast("Changes saved \u2014 " + count + " upcoming occurrences created");
    } else {
      showToast("Changes saved");
    }
    navigate("#/task/" + id);
  };
}

/* ---------------- FINANCE CALCULATIONS ----------------
 * Design notes / documented assumptions (per the brief's requirement not to
 * make silent financial assumptions):
 *
 * - Only tasks whose category has tracksMoney=true AND that have an amount +
 *   flowType set are "money tasks". Everything below only looks at those.
 * - "completed" status doubles as paid (expense) / received (income) — no
 *   separate paid flag, reusing Together's existing completion mechanism.
 * - Current Balance, Safe to Spend, and Needs Attention / Coming Up are
 *   always real-time (tied to today), REGARDLESS of which month is selected
 *   in the dashboard's month switcher — "how much do we have" and "what
 *   needs attention" are present-tense questions.
 * - Expected/Actual/Variance, Cash Flow, Checklist, Category Snapshot,
 *   Month-over-month and Balance Trend all scope to the SELECTED month.
 * - Recurring bills are already materialized as real future task rows by
 *   Together's existing recurrence engine (8 occurrences ahead), so no
 *   separate projection engine is needed here — future months' expected
 *   figures come from real rows, same as any other task.
 * ------------------------------------------------------- */
function moneyTasks() {
  return S.tasks.filter((t) => t.amount != null && t.flowType && catById(t.categoryId).tracksMoney);
}
function signedAmount(t) { return t.flowType === "income" ? Number(t.amount) : -Number(t.amount); }

function completedNetUpTo(dateIsoInclusive) {
  let net = 0;
  for (const t of moneyTasks()) {
    if (t.status !== "completed") continue;
    if (t.startDate > dateIsoInclusive) continue;
    net += signedAmount(t);
  }
  return net;
}
function openingSum() { return S.accounts.reduce((s, a) => s + (Number(a.openingBalance) || 0), 0); }
function currentBalance() { return openingSum() + completedNetUpTo(todayISO()); }

function tasksInRange(startIso, endIso, flowType) {
  return moneyTasks().filter((t) => t.startDate >= startIso && t.startDate <= endIso && (!flowType || t.flowType === flowType));
}
function sumAmounts(tasks) { return tasks.reduce((s, t) => s + Number(t.amount), 0); }
function completedNetInRange(startIso, endIso) {
  return sumAmounts(tasksInRange(startIso, endIso, "income").filter((t) => t.status === "completed"))
    - sumAmounts(tasksInRange(startIso, endIso, "expense").filter((t) => t.status === "completed"));
}

// Balance at the start of a given month is simply what the user told us at
// the start of THAT month \u2014 the monthly check-in is a start-of-month
// anchor, not a running "current balance". Falls back to the old
// account-derived total only for months before this feature existed.
function balanceAtStartOfMonth(monthAnchorIso) {
  const snap = getSnapshot(monthKeyOf(monthAnchorIso));
  if (snap) return snap.amount;
  if (S.accounts.length > 0) return openingSum() + completedNetUpTo(addDaysISO(monthStartISO(monthAnchorIso), -1));
  return null;
}

// Current Balance is LIVE: the month's starting anchor plus whatever has
// actually been checked off (paid/received) since then. Every time you tick
// something off in the checklist, this number moves \u2014 that's the whole point.
function currentBalanceFor(monthAnchorIso) {
  const start = balanceAtStartOfMonth(monthAnchorIso);
  if (start == null) return null;
  const monthStart = monthStartISO(monthAnchorIso), monthEnd = monthEndISO(monthAnchorIso), today = todayISO();
  const cutoff = today < monthStart ? monthStart : (today > monthEnd ? monthEnd : today);
  return start + completedNetInRange(monthStart, cutoff);
}
// The real-time balance for whatever the actual current month is, regardless
// of which month is being browsed in the dashboard \u2014 used for Safe to Spend.
function bestCurrentBalance() { return currentBalanceFor(todayISO()); }

// The stable end-of-month target: start-of-month balance plus EVERY income
// and expense added for the month, whether checked off yet or not. This
// doesn't move as things get checked off \u2014 it's the plan, not the progress.
function expectedEndOfMonthFor(monthAnchorIso) {
  const start = balanceAtStartOfMonth(monthAnchorIso);
  if (start == null) return null;
  const mStart = monthStartISO(monthAnchorIso), mEnd = monthEndISO(monthAnchorIso);
  const net = sumAmounts(tasksInRange(mStart, mEnd, "income")) - sumAmounts(tasksInRange(mStart, mEnd, "expense"));
  return start + net;
}

function computeFinanceSnapshot(monthAnchorIso) {
  const monthStart = monthStartISO(monthAnchorIso);
  const monthEnd = monthEndISO(monthAnchorIso);
  const today = todayISO();
  const monthKey = monthKeyOf(monthAnchorIso);
  const isCurrentRealMonth = monthKey === monthKeyOf(today);
  const isFutureMonth = monthStart > today;
  const hasAccounts = S.accounts.length > 0 || S.balanceSnapshots.length > 0; // "do we have any baseline at all"

  const snapshotThisMonth = getSnapshot(monthKey);
  // Ask for every month you land on \u2014 not just the real current one \u2014 since
  // the dashboard now defaults to next month and each month needs its own
  // starting balance regardless of which one happens to be "today".
  const needsCheckIn = !snapshotThisMonth;

  const balanceAtMonthStart = balanceAtStartOfMonth(monthAnchorIso);

  // Current Balance: live, moves every time something gets checked off.
  // Only knowable once this month has a starting anchor (a snapshot, or an
  // account to derive one from).
  const currentBalanceForMonth = currentBalanceFor(monthAnchorIso);

  // Expected End of Month: the stable plan, built from EVERY income/expense
  // added for the month regardless of whether it's been checked off yet.
  // This does not change as items get checked off \u2014 only as items are
  // added, edited, or removed.
  const expectedIncomeMonth = sumAmounts(tasksInRange(monthStart, monthEnd, "income"));
  const expectedExpenseMonth = sumAmounts(tasksInRange(monthStart, monthEnd, "expense"));
  const expectedNetMonth = expectedIncomeMonth - expectedExpenseMonth;
  const expectedEndBalance = balanceAtMonthStart != null ? balanceAtMonthStart + expectedNetMonth : null;

  // Checked off so far \u2014 this is what's actually driving Current Balance.
  const actualIncomeMonth = sumAmounts(tasksInRange(monthStart, monthEnd, "income").filter((t) => t.status === "completed"));
  const actualExpenseMonth = sumAmounts(tasksInRange(monthStart, monthEnd, "expense").filter((t) => t.status === "completed"));
  const actualNetMonth = actualIncomeMonth - actualExpenseMonth;

  const remainingItems = tasksInRange(monthStart, monthEnd, "expense").filter((t) => t.status !== "completed")
    .sort((a, b) => a.startDate.localeCompare(b.startDate));
  const remainingTotal = sumAmounts(remainingItems);

  // Safe to Spend is always about *this real month*, independent of the
  // month currently being browsed in the dashboard.
  const curStart = monthStartISO(today), curEnd = monthEndISO(today);
  const currentMonthRemaining = sumAmounts(tasksInRange(curStart, curEnd, "expense").filter((t) => t.status !== "completed"));
  const safeToSpend = bestCurrentBalance() != null ? bestCurrentBalance() - currentMonthRemaining : null;

  // Needs attention / Coming up: always real-time, not month-filtered.
  const unpaid = moneyTasks().filter((t) => t.flowType === "expense" && t.status !== "completed");
  const needsAttention = unpaid.filter((t) => t.startDate <= today).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const comingUp = moneyTasks().filter((t) => t.status !== "completed" && t.startDate > today)
    .sort((a, b) => a.startDate.localeCompare(b.startDate)).slice(0, 6);

  // Checklist: every money task due this month (paid or not). Checking one
  // off here is exactly what moves Current Balance above.
  const checklist = tasksInRange(monthStart, monthEnd).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const checklistDone = checklist.filter((t) => t.status === "completed").length;

  // Recent activity: completed money tasks this month, most recent first.
  const recent = tasksInRange(monthStart, monthEnd).filter((t) => t.status === "completed")
    .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)).slice(0, 6);

  // Category snapshot: actual (completed) expense total per category, this month.
  const catTotals = {};
  for (const t of tasksInRange(monthStart, monthEnd, "expense").filter((t) => t.status === "completed")) {
    catTotals[t.categoryId] = (catTotals[t.categoryId] || 0) + Number(t.amount);
  }
  const categorySnapshot = Object.entries(catTotals)
    .map(([catId, total]) => ({ cat: catById(catId), total }))
    .sort((a, b) => b.total - a.total).slice(0, 5);

  // Month-over-month (previous full calendar month), using completed totals only.
  const prevAnchor = addMonthsISO(monthStart, -1);
  const prevMonthStartBalance = balanceAtStartOfMonth(prevAnchor);
  let momCompare = null;
  if (currentBalanceForMonth != null && prevMonthStartBalance != null) {
    const prevStart = monthStartISO(prevAnchor), prevEnd = monthEndISO(prevAnchor);
    const prevIncome = sumAmounts(tasksInRange(prevStart, prevEnd, "income").filter((t) => t.status === "completed"));
    const prevExpense = sumAmounts(tasksInRange(prevStart, prevEnd, "expense").filter((t) => t.status === "completed"));
    momCompare = {
      incomeDelta: actualIncomeMonth - prevIncome,
      expenseDelta: actualExpenseMonth - prevExpense,
      endBalanceDelta: currentBalanceForMonth - prevMonthStartBalance,
    };
  }

  let status = "NEEDS CHECK-IN", statusText = "Enter this month's starting balance to begin tracking.";
  if (!needsCheckIn) {
    if (isFutureMonth) { status = "PROJECTED"; statusText = "This month hasn't started yet \u2014 figures below are a projection based on what's already planned."; }
    else { status = "TRACKING"; statusText = "Current Balance updates as you check items off below."; }
  }

  // The number you actually asked for: what did last month's ending balance
  // turn out to be (the balance you entered starting THIS month) versus what
  // was expected for it (from everything that was added) \u2014 the gap is
  // money that moved outside anything logged here, in either direction.
  const prevExpectedEnd = expectedEndOfMonthFor(prevAnchor);
  const priorMonth = (snapshotThisMonth && prevExpectedEnd != null) ? {
    label: monthLong(prevAnchor),
    actualEnd: balanceAtMonthStart,
    expectedEnd: prevExpectedEnd,
    difference: balanceAtMonthStart - prevExpectedEnd,
  } : null;

  return {
    monthStart, monthEnd, hasAccounts, monthKey, snapshotThisMonth, needsCheckIn, isFutureMonth, isCurrentRealMonth,
    balanceAtMonthStart, currentBalanceForMonth,
    expectedIncomeMonth, expectedExpenseMonth, expectedNetMonth, expectedEndBalance,
    actualIncomeMonth, actualExpenseMonth, actualNetMonth,
    remainingItems, remainingTotal, safeToSpend, currentMonthRemaining,
    needsAttention, comingUp, checklist, checklistDone, recent, categorySnapshot, momCompare,
    status, statusText, priorMonth,
  };
}
