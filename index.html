const CAL_MAX_VISIBLE = 3;

function renderCalendar() {
  const anchor = S.calMonthAnchor;
  const cells = monthMatrix(anchor);
  const monthLabel = monthLong(anchor) + ' <span class="yr">' + isoToDate(anchor).getFullYear() + "</span>";
  const today = todayISO();

  let head = '<div class="cal-grid-head">' + WEEKDAYS_SHORT.map((d) => "<span>" + d + "</span>").join("") + "</div>";
  let grid = '<div class="cal-grid">';
  for (const cell of cells) {
    const dayTasks = S.tasks
      .filter((t) => t.startDate === cell.iso && t.showOnCalendar !== false)
      .sort((a, b) => (a.allDay ? "" : a.startTime || "").localeCompare(b.allDay ? "" : b.startTime || ""));
    const dayGoogle = googleEventsForDate(cell.iso);
    const totalCount = dayTasks.length + dayGoogle.length;
    const visibleTasks = dayTasks.slice(0, CAL_MAX_VISIBLE);
    const visibleGoogle = dayGoogle.slice(0, Math.max(0, CAL_MAX_VISIBLE - visibleTasks.length));
    const extra = totalCount - visibleTasks.length - visibleGoogle.length;
    const eventsHtml = visibleTasks.map((t) => {
      const done = t.status === "completed";
      const cat = catById(t.categoryId);
      const timeLabel = t.allDay ? "" : '<span class="t">' + escapeHtml(t.startTime || "") + "</span>";
      return '<span class="day-event ' + (done ? "done" : "") + '" style="border-left:3px solid var(--' + cat.color + ')" ' +
        'data-drag-task="' + t.id + '" data-drag-date="' + cell.iso + '">' + timeLabel + (timeLabel ? " " : "") + escapeHtml(t.title) + "</span>";
    }).join("") + visibleGoogle.map((ev) => {
      const timeLabel = ev.allDay ? "" : '<span class="t">' + escapeHtml(ev.startTime || "") + "</span>";
      return '<span class="day-event" style="border-left:3px dashed var(--text3);color:var(--text2)" data-google-event="' + ev.id + '">' +
        timeLabel + (timeLabel ? " " : "") + escapeHtml(ev.title) + "</span>";
    }).join("");
    const moreHtml = extra > 0 ? '<span class="cal-more" data-cal-day="' + cell.iso + '">+' + extra + " more</span>" : "";

    grid += '<div class="cal-cell ' + (cell.otherMonth ? "other-month" : "") + " " +
      (cell.iso === S.calSelected ? "selected" : "") + " " + (cell.iso === today ? "is-today" : "") +
      '" data-cal-day="' + cell.iso + '">' +
      '<span class="daynum">' + cell.day + "</span>" +
      '<div class="day-events">' + eventsHtml + moreHtml + "</div>" +
      "</div>";
  }
  grid += "</div>";

  const daySchedule = renderDaySchedule(S.calSelected);

  return (
    '<div class="topbar"><h1>Calendar</h1></div>' +
    '<div style="padding:0 var(--sp-lg)">' +
    '<div class="cal-nav">' +
      '<button class="icon-btn" id="calPrev"><svg style="transform:rotate(180deg)"><use href="#ic-chevron"/></svg></button>' +
      '<span class="month">' + monthLabel + "</span>" +
      '<button class="icon-btn" id="calNext"><svg><use href="#ic-chevron"/></svg></button>' +
    "</div>" +
    head + grid +
    daySchedule +
    "</div>"
  );
}

/* ---------------- CALENDAR DRAG-AND-DROP ---------------- */
// Long-press-then-drag pattern so it doesn't fight normal taps or page scroll,
// and works the same for touch, mouse, and pen (pointer events).
let calDrag = null;            // { taskId, originDate, startX, startY, longPressTimer, started, ghostEl, lastTargetCell }
let calDragJustHappened = false;
const CAL_DRAG_MOVE_CANCEL_PX = 8;   // touch: movement before long-press fires that cancels the drag attempt
const CAL_DRAG_LONGPRESS_MS = 260;   // touch: hold time before a drag begins
const CAL_DRAG_MOUSE_MOVE_PX = 4;    // mouse/pen: movement that starts a drag immediately, no wait

function onDayEventPointerDown(ev) {
  if (ev.button !== undefined && ev.button !== 0) return; // left-click / primary touch only
  const el = ev.currentTarget;
  const taskId = el.getAttribute("data-drag-task");
  const originDate = el.getAttribute("data-drag-date");
  const startX = ev.clientX, startY = ev.clientY;
  // Mouse (and pen) never competes with a page-scroll gesture the way touch does,
  // so it can start dragging on deliberate movement right away — no long-press needed.
  const isMouse = ev.pointerType === "mouse" || ev.pointerType === "pen";

  calDrag = {
    taskId, originDate, startX, startY,
    started: false,
    el,
    longPressTimer: isMouse ? null : setTimeout(() => beginCalDrag(), CAL_DRAG_LONGPRESS_MS),
  };

  const move = (e) => {
    if (!calDrag) return;
    const dx = e.clientX - calDrag.startX, dy = e.clientY - calDrag.startY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (!calDrag.started) {
      if (isMouse) {
        if (dist > CAL_DRAG_MOUSE_MOVE_PX) beginCalDrag();
        else return;
      } else if (dist > CAL_DRAG_MOVE_CANCEL_PX) {
        clearTimeout(calDrag.longPressTimer);
        cleanupCalDrag();
        return;
      } else {
        return;
      }
    }
    e.preventDefault();
    positionGhost(e.clientX, e.clientY);
    highlightDropTarget(e.clientX, e.clientY);
  };
  const up = (e) => {
    if (calDrag && calDrag.started) {
      finishCalDrag(e.clientX, e.clientY);
      calDragJustHappened = true;
      setTimeout(() => { calDragJustHappened = false; }, 300);
    } else if (calDrag) {
      clearTimeout(calDrag.longPressTimer);
    }
    calDrag = null;
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    window.removeEventListener("pointercancel", up);
  };
  window.addEventListener("pointermove", move, { passive: false });
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}

function beginCalDrag() {
  if (!calDrag) return;
  calDrag.started = true;
  calDrag.el.classList.add("dragging");
  const ghost = document.createElement("div");
  ghost.className = "drag-ghost";
  ghost.textContent = calDrag.el.textContent;
  document.body.appendChild(ghost);
  calDrag.ghostEl = ghost;
  positionGhost(calDrag.startX, calDrag.startY);
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
}

function positionGhost(x, y) {
  if (!calDrag || !calDrag.ghostEl) return;
  calDrag.ghostEl.style.left = x + "px";
  calDrag.ghostEl.style.top = y + "px";
}

function highlightDropTarget(x, y) {
  if (!calDrag) return;
  const el = document.elementFromPoint(x, y);
  const cell = el ? el.closest(".cal-cell") : null;
  if (calDrag.lastTargetCell && calDrag.lastTargetCell !== cell) {
    calDrag.lastTargetCell.classList.remove("drop-target");
  }
  if (cell) cell.classList.add("drop-target");
  calDrag.lastTargetCell = cell;
}

function cleanupCalDrag() {
  if (!calDrag) return;
  if (calDrag.el) calDrag.el.classList.remove("dragging");
  if (calDrag.ghostEl) calDrag.ghostEl.remove();
  if (calDrag.lastTargetCell) calDrag.lastTargetCell.classList.remove("drop-target");
}

async function finishCalDrag(x, y) {
  const el = document.elementFromPoint(x, y);
  const cell = el ? el.closest(".cal-cell") : null;
  cleanupCalDrag();
  if (!cell) return;
  const newDate = cell.getAttribute("data-cal-day");
  if (!newDate || newDate === calDrag.originDate) return;

  const t = S.tasks.find((x2) => x2.id === calDrag.taskId);
  if (!t) return;
  const dayDelta = daysBetweenISO(calDrag.originDate, newDate);
  const prevStart = t.startDate, prevEnd = t.endDate;
  t.startDate = newDate;
  if (t.endDate) t.endDate = addDaysISO(t.endDate, dayDelta);
  await saveTask(t);
  S.calSelected = newDate;
  render();
  showToast("Moved to " + fmtDateHeading(newDate).weekday + " " + fmtDateHeading(newDate).dayMonth, "Undo", async () => {
    t.startDate = prevStart; t.endDate = prevEnd;
    await saveTask(t);
    S.calSelected = prevStart;
    render();
  });
}

function daysBetweenISO(a, b) {
  const msPerDay = 86400000;
  return Math.round((isoToDate(b) - isoToDate(a)) / msPerDay);
}

function openCreateSheet(prefill) {
  prefill = prefill || {};
  const draft = newTaskSkeleton();
  if (prefill.startDate) { draft.startDate = prefill.startDate; }
  if (prefill.startTime) { draft.startTime = prefill.startTime; draft.allDay = false; }

  const render_ = () => {
    const catChips = S.categories.map((c) =>
      '<button class="chip ' + (draft.categoryId === c.id ? "cat-active" : "") + '" style="' +
      (draft.categoryId === c.id ? "background:var(--" + c.color + ")" : "") + '" data-pick-cat="' + c.id + '">' +
      (draft.categoryId === c.id ? "" : '<span class="dot ' + c.color + '"></span>') + escapeHtml(c.name) + "</button>"
    ).join("");
    const personChips = ["sergio", "rita", "both"].map((p) =>
      '<button class="chip ' + (draft.assignedTo === p ? "active" : "") + '" data-pick-person="' + p + '">' + personLabel(p) + "</button>"
    ).join("");
    const priorityChips = PRIORITIES.map((p) =>
      '<button class="chip ' + (draft.priority === p ? "active" : "") + '" data-pick-priority="' + p + '"><span class="pflag ' + p + '"></span>' + PRIORITY_LABEL[p] + "</button>"
    ).join("");

    openSheet(
      '<div class="sheet-head"><span class="title">New task</span><button class="icon-btn" id="closeSheetBtn"><svg><use href="#ic-close"/></svg></button></div>' +
      '<div class="sheet-body">' +
        '<input class="title-input" id="quickTitle" placeholder="What needs to be done?" value="' + escapeHtml(draft.title) + '">' +
        '<div class="field"><label>WHEN</label>' +
          '<div style="display:flex;gap:8px">' +
            '<input type="date" id="quickDate" value="' + draft.startDate + '" style="flex:1">' +
            '<input type="time" id="quickTime" value="' + (draft.startTime || "") + '" style="flex:1">' +
          "</div></div>" +
        '<div class="field"><label>ASSIGNED TO</label><div class="chip-row">' + personChips + "</div></div>" +
        '<div class="field"><label>CATEGORY</label><div class="chip-row">' + catChips + "</div></div>" +
        '<div class="field"><label>PRIORITY</label><div class="chip-row">' + priorityChips + "</div></div>" +
        '<button class="btn" id="quickAdd">Add Task</button>' +
      "</div>"
    );

    document.getElementById("closeSheetBtn").onclick = closeSheet;
    document.getElementById("quickTitle").oninput = (e) => { draft.title = e.target.value; };
    document.getElementById("quickDate").onchange = (e) => { draft.startDate = e.target.value; };
    document.getElementById("quickTime").onchange = (e) => { draft.startTime = e.target.value || null; draft.allDay = !e.target.value; };
    document.querySelectorAll("[data-pick-cat]").forEach((el) => el.onclick = () => { draft.categoryId = el.getAttribute("data-pick-cat"); render_(); });
    document.querySelectorAll("[data-pick-person]").forEach((el) => el.onclick = () => { draft.assignedTo = el.getAttribute("data-pick-person"); render_(); });
    document.querySelectorAll("[data-pick-priority]").forEach((el) => el.onclick = () => { draft.priority = el.getAttribute("data-pick-priority"); render_(); });
    document.getElementById("quickAdd").onclick = async () => {
      const titleVal = document.getElementById("quickTitle").value.trim();
      if (!titleVal) { showToast("Give the task a title first."); return; }
      draft.title = titleVal;
      draft.startDate = document.getElementById("quickDate").value || todayISO();
      await createTaskWithRecurrence(draft);
      closeSheet();
      render();
      showToast("Task added", "Open", () => navigate("#/task/" + draft.id));
    };
    setTimeout(() => { const el = document.getElementById("quickTitle"); if (el) el.focus(); }, 150);
  };
  render_();
}

async function createTaskWithRecurrence(draft) {
  await saveTask(draft);
  if (draft.recurrence && draft.recurrence.frequency && draft.recurrence.frequency !== "none") {
    await generateRecurrenceInstances(draft);
  }
}

async function generateRecurrenceInstances(base) {
  const groupId = uid();
  base.recurrenceId = groupId;
  await saveTask(base);
  const stepFn = base.recurrence.frequency === "daily" ? (d) => addDaysISO(d, 1)
    : base.recurrence.frequency === "weekly" ? (d) => addDaysISO(d, 7)
    : base.recurrence.frequency === "monthly" ? (d) => addMonthsISO(d, 1)
    : (d) => addMonthsISO(d, 12);
  let cursor = base.startDate;
  let created = 0;
  for (let i = 0; i < 8; i++) {
    cursor = stepFn(cursor);
    const clone = JSON.parse(JSON.stringify(base));
    clone.id = uid();
    clone.startDate = cursor;
    clone.status = "upcoming";
    clone.completedAt = null;
    clone.attachments = [];
    clone.recurrenceId = groupId;
    clone.createdAt = Date.now();
    clone.updatedAt = Date.now();
    await saveTask(clone);
    created++;
  }
  return created;
}

function afterTaskDetailRender(id) {
  const view = document.getElementById("view");
  document.querySelectorAll("[data-nav]").forEach((b) => { b.onclick = () => navigate(b.getAttribute("data-nav")); });

  const t = S.tasks.find((x) => x.id === id);
  if (!t) return;

  document.querySelectorAll("[data-toggle-sub]").forEach((el) => el.onclick = async () => {
    const sid = el.getAttribute("data-toggle-sub");
    const s = t.subtasks.find((x) => x.id === sid);
    s.completed = !s.completed;
    await saveTask(t);
    render();
  });
  const newSubInput = document.getElementById("newSubInput");
  if (newSubInput) newSubInput.onkeydown = async (e) => {
    if (e.key === "Enter" && newSubInput.value.trim()) {
      t.subtasks.push({ id: uid(), title: newSubInput.value.trim(), completed: false, sortOrder: t.subtasks.length });
      await saveTask(t);
      render();
    }
  };

  const attachInput = document.getElementById("attachInput");
  if (attachInput) attachInput.onchange = async () => {
    for (const file of attachInput.files) {
      t.attachments.push({ id: uid(), fileName: file.name, fileType: file.type, fileSize: file.size, blob: file });
    }
    try {
      await saveTask(t);
      render();
    } catch (err) {
      showToast("We couldn\u2019t add this file.");
    }
  };
  document.querySelectorAll("[data-delete-attach]").forEach((el) => el.onclick = async () => {
    t.attachments = t.attachments.filter((a) => a.id !== el.getAttribute("data-delete-attach"));
    await saveTask(t);
    render();
  });
  document.querySelectorAll("[data-open-attach]").forEach((el) => el.onclick = () => {
    const a = t.attachments.find((x) => x.id === el.getAttribute("data-open-attach"));
    if (a && a.blob) { const url = URL.createObjectURL(a.blob); window.open(url, "_blank"); }
  });

  document.querySelectorAll("[data-add-field]").forEach((el) => el.onclick = () => navigate("#/task/" + id + "/edit"));

  const remBtn = document.getElementById("openReminderPicker");
  if (remBtn) remBtn.onclick = () => openReminderSheet(t);

  document.getElementById("completeBtn").onclick = () => toggleComplete(id);
  document.getElementById("duplicateBtn").onclick = async () => {
    const clone = JSON.parse(JSON.stringify(t));
    clone.id = uid();
    clone.title = t.title;
    clone.status = "upcoming";
    clone.completedAt = null;
    clone.attachments = [];
    clone.createdAt = Date.now();
    clone.updatedAt = Date.now();
    await saveTask(clone);
    render();
    showToast("Task duplicated", "Open", () => navigate("#/task/" + clone.id));
  };
  document.getElementById("deleteBtn").onclick = () => {
    const isRecurring = !!t.recurrenceId;
    openSheet(
      '<div class="sheet-body" style="padding-top:20px">' +
      '<h3 style="margin:0 0 8px">Delete this task?</h3>' +
      '<p style="color:var(--text2);font-size:15px;margin:0 0 20px">This can\u2019t be undone.</p>' +
      (isRecurring
        ? '<div class="btn-row" style="flex-direction:column;gap:8px">' +
            '<button class="btn danger" id="confirmDelOne">Delete just this one</button>' +
            '<button class="btn danger" id="confirmDelForward">Delete this and future occurrences</button>' +
            '<button class="btn ghost" id="cancelDel">Cancel</button>' +
          "</div>"
        : '<div class="btn-row"><button class="btn ghost" id="cancelDel">Cancel</button><button class="btn danger" id="confirmDel">Delete</button></div>') +
      "</div>"
    );
    document.getElementById("cancelDel").onclick = closeSheet;
    if (isRecurring) {
      document.getElementById("confirmDelOne").onclick = async () => {
        await deleteTaskById(id);
        closeSheet();
        navigate("#/today");
        showToast("Task deleted");
      };
      document.getElementById("confirmDelForward").onclick = async () => {
        const count = await deleteRecurrenceOnward(t.recurrenceId, t.startDate);
        closeSheet();
        navigate("#/today");
        showToast(count + " occurrence" + (count === 1 ? "" : "s") + " deleted");
      };
    } else {
      document.getElementById("confirmDel").onclick = async () => {
        await deleteTaskById(id);
        closeSheet();
        navigate("#/today");
        showToast("Task deleted");
      };
    }
  };
}

function openReminderSheet(t) {
  openSheet(
    '<div class="sheet-head"><span class="title">Reminder</span><button class="icon-btn" id="closeSheetBtn"><svg><use href="#ic-close"/></svg></button></div>' +
    '<div class="sheet-body">' +
    REMINDER_OPTIONS.map((o) =>
      '<div class="list-row"><span class="lbl">' + o.label + '</span><button class="toggle ' +
      (t.reminders.some((r) => r.minutesBefore === o.minutes) ? "on" : "") + '" data-rem="' + o.minutes + '"><span class="knob"></span></button></div>'
    ).join("") +
    "</div>"
  );
  document.getElementById("closeSheetBtn").onclick = () => { closeSheet(); render(); };
  document.querySelectorAll("[data-rem]").forEach((el) => el.onclick = async () => {
    const m = Number(el.getAttribute("data-rem"));
    const has = t.reminders.some((r) => r.minutesBefore === m);
    t.reminders = has ? t.reminders.filter((r) => r.minutesBefore !== m) : [...t.reminders, { minutesBefore: m }];
    await saveTask(t);
    openReminderSheet(t);
  });
}

function afterTaskEditRender(id) {
  const t = S.tasks.find((x) => x.id === id);
  if (!t) { navigate("#/today"); return; }

  // Keep the in-memory draft in sync as the user types, so switching a chip
  // (category/person/priority/status/recurrence) — which re-renders this
  // screen from `t` — never discards anything already typed.
  const syncField = (elId, prop, transform) => {
    const el = document.getElementById(elId);
    if (!el) return;
    const handler = () => { t[prop] = transform ? transform(el.value) : el.value; };
    el.addEventListener("input", handler);
    el.addEventListener("change", handler);
  };
  syncField("e-title", "title");
  syncField("e-startDate", "startDate");
  syncField("e-startTime", "startTime", (v) => v || null);
  syncField("e-endDate", "endDate", (v) => v || null);
  syncField("e-endTime", "endTime", (v) => v || null);
  syncField("e-locAddr", "locationAddress");
  syncField("e-mapsUrl", "mapsUrl");
  syncField("e-notes", "notes");
  syncField("e-amount", "amount", (v) => (v === "" ? null : Number(v)));
  const showCalEl = document.getElementById("e-showCal");
  if (showCalEl) showCalEl.addEventListener("change", () => { t.showOnCalendar = showCalEl.checked; });

  // Location name gets special handling: if you paste (or type, then move on)
  // a full maps URL in there, treat it as the maps link instead — no need to
  // juggle two fields for the same thing.
  const locNameEl = document.getElementById("e-locName");
  const mapsUrlEl = document.getElementById("e-mapsUrl");
  const applyLocNameValue = (raw) => {
    const val = (raw || "").trim();
    if (isLikelyUrl(val)) {
      if (mapsUrlEl) mapsUrlEl.value = val;
      t.mapsUrl = val;
      const friendly = extractPlaceNameFromMapsUrl(val);
      if (locNameEl) locNameEl.value = friendly || "";
      t.locationName = friendly || "";
      showToast(friendly ? "Detected a maps link \u2014 saved as \u201c" + friendly + "\u201d" : "Detected a maps link \u2014 added to the Maps link field");
    } else {
      t.locationName = raw;
    }
  };
  if (locNameEl) {
    locNameEl.addEventListener("paste", (e) => {
      const text = (e.clipboardData || window.clipboardData).getData("text");
      if (isLikelyUrl(text)) {
        e.preventDefault();
        applyLocNameValue(text);
      }
    });
    locNameEl.addEventListener("input", () => {
      if (!isLikelyUrl(locNameEl.value)) t.locationName = locNameEl.value;
    });
    locNameEl.addEventListener("change", () => applyLocNameValue(locNameEl.value));
  }

  document.getElementById("cancelEdit").onclick = () => navigate("#/task/" + id);
  document.querySelectorAll("[data-e-cat]").forEach((el) => el.onclick = () => {
    t.categoryId = el.getAttribute("data-e-cat");
    if (catById(t.categoryId).tracksMoney && !t.flowType) t.flowType = "expense";
    document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id);
  });
  document.querySelectorAll("[data-e-person]").forEach((el) => el.onclick = () => { t.assignedTo = el.getAttribute("data-e-person"); document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });
  document.querySelectorAll("[data-e-priority]").forEach((el) => el.onclick = () => { t.priority = el.getAttribute("data-e-priority"); document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });
  document.querySelectorAll("[data-e-flow]").forEach((el) => el.onclick = () => { t.flowType = el.getAttribute("data-e-flow"); document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });
  document.querySelectorAll("[data-e-status]").forEach((el) => el.onclick = () => { t.status = el.getAttribute("data-e-status"); document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });
  document.querySelectorAll("[data-e-recur]").forEach((el) => el.onclick = () => { t.recurrence = { frequency: el.getAttribute("data-e-recur") }; document.getElementById("view").innerHTML = renderTaskEditFullscreen(id); afterTaskEditRender(id); });

  document.getElementById("saveEdit").onclick = async () => {
    t.title = document.getElementById("e-title").value.trim() || t.title;
    t.startDate = document.getElementById("e-startDate").value || t.startDate;
    const st = document.getElementById("e-startTime").value;
    t.startTime = st || null;
    t.allDay = !st;
    t.endDate = document.getElementById("e-endDate").value || null;
    t.endTime = document.getElementById("e-endTime").value || null;
    t.locationName = document.getElementById("e-locName").value.trim();
    t.locationAddress = document.getElementById("e-locAddr").value.trim();
    t.mapsUrl = document.getElementById("e-mapsUrl").value.trim();
    t.notes = document.getElementById("e-notes").value;
    if (!catById(t.categoryId).tracksMoney) { t.amount = null; t.flowType = null; }
    await saveTask(t);
    if (t.recurrence && t.recurrence.frequency !== "none" && !t.recurrenceId) {
      const count = await generateRecurrenceInstances(t);
      showToast("Changes saved \u2014 " + count + " upcoming occurrences created");
    } else {
      showToast("Changes saved");
    }
    navigate("#/task/" + id);
  };
}

/* ---------------- FINANCE CALCULATIONS ----------------
 * Design notes / documented assumptions (per the brief's requirement not to
 * make silent financial assumptions):
 *
 * - Only tasks whose category has tracksMoney=true AND that have an amount +
 *   flowType set are "money tasks". Everything below only looks at those.
 * - "completed" status doubles as paid (expense) / received (income) — no
 *   separate paid flag, reusing Together's existing completion mechanism.
 * - Current Balance, Safe to Spend, and Needs Attention / Coming Up are
 *   always real-time (tied to today), REGARDLESS of which month is selected
 *   in the dashboard's month switcher — "how much do we have" and "what
 *   needs attention" are present-tense questions.
 * - Expected/Actual/Variance, Cash Flow, Checklist, Category Snapshot,
 *   Month-over-month and Balance Trend all scope to the SELECTED month.
 * - Recurring bills are already materialized as real future task rows by
 *   Together's existing recurrence engine (8 occurrences ahead), so no
 *   separate projection engine is needed here — future months' expected
 *   figures come from real rows, same as any other task.
 * ------------------------------------------------------- */
function moneyTasks() {
  return S.tasks.filter((t) => t.amount != null && t.flowType && catById(t.categoryId).tracksMoney);
}
function signedAmount(t) { return t.flowType === "income" ? Number(t.amount) : -Number(t.amount); }

function completedNetUpTo(dateIsoInclusive) {
  let net = 0;
  for (const t of moneyTasks()) {
    if (t.status !== "completed") continue;
    if (t.startDate > dateIsoInclusive) continue;
    net += signedAmount(t);
  }
  return net;
}
function openingSum() { return S.accounts.reduce((s, a) => s + (Number(a.openingBalance) || 0), 0); }
function currentBalance() { return openingSum() + completedNetUpTo(todayISO()); }

function tasksInRange(startIso, endIso, flowType) {
  return moneyTasks().filter((t) => t.startDate >= startIso && t.startDate <= endIso && (!flowType || t.flowType === flowType));
}
function sumAmounts(tasks) { return tasks.reduce((s, t) => s + Number(t.amount), 0); }
function completedNetInRange(startIso, endIso) {
  return sumAmounts(tasksInRange(startIso, endIso, "income").filter((t) => t.status === "completed"))
    - sumAmounts(tasksInRange(startIso, endIso, "expense").filter((t) => t.status === "completed"));
}

// Balance at the start of a given month is simply what the user told us at
// the start of THAT month \u2014 the monthly check-in is a start-of-month
// anchor, not a running "current balance". Falls back to the old
// account-derived total only for months before this feature existed.
function balanceAtStartOfMonth(monthAnchorIso) {
  const snap = getSnapshot(monthKeyOf(monthAnchorIso));
  if (snap) return snap.amount;
  if (S.accounts.length > 0) return openingSum() + completedNetUpTo(addDaysISO(monthStartISO(monthAnchorIso), -1));
  return null;
}

// Current Balance is LIVE: the month's starting anchor plus whatever has
// actually been checked off (paid/received) since then. Every time you tick
// something off in the checklist, this number moves \u2014 that's the whole point.
function currentBalanceFor(monthAnchorIso) {
  const start = balanceAtStartOfMonth(monthAnchorIso);
  if (start == null) return null;
  const monthStart = monthStartISO(monthAnchorIso), monthEnd = monthEndISO(monthAnchorIso), today = todayISO();
  const cutoff = today < monthStart ? monthStart : (today > monthEnd ? monthEnd : today);
  return start + completedNetInRange(monthStart, cutoff);
}
// The real-time balance for whatever the actual current month is, regardless
// of which month is being browsed in the dashboard \u2014 used for Safe to Spend.
function bestCurrentBalance() { return currentBalanceFor(todayISO()); }

// The stable end-of-month target: start-of-month balance plus EVERY income
// and expense added for the month, whether checked off yet or not. This
// doesn't move as things get checked off \u2014 it's the plan, not the progress.
function expectedEndOfMonthFor(monthAnchorIso) {
  const start = balanceAtStartOfMonth(monthAnchorIso);
  if (start == null) return null;
  const mStart = monthStartISO(monthAnchorIso), mEnd = monthEndISO(monthAnchorIso);
  const net = sumAmounts(tasksInRange(mStart, mEnd, "income")) - sumAmounts(tasksInRange(mStart, mEnd, "expense"));
  return start + net;
}

function computeFinanceSnapshot(monthAnchorIso) {
  const monthStart = monthStartISO(monthAnchorIso);
  const monthEnd = monthEndISO(monthAnchorIso);
  const today = todayISO();
  const monthKey = monthKeyOf(monthAnchorIso);
  const isCurrentRealMonth = monthKey === monthKeyOf(today);
  const isFutureMonth = monthStart > today;
  const hasAccounts = S.accounts.length > 0 || S.balanceSnapshots.length > 0; // "do we have any baseline at all"

  const snapshotThisMonth = getSnapshot(monthKey);
  // Ask for every month you land on \u2014 not just the real current one \u2014 since
  // the dashboard now defaults to next month and each month needs its own
  // starting balance regardless of which one happens to be "today".
  const needsCheckIn = !snapshotThisMonth;

  const balanceAtMonthStart = balanceAtStartOfMonth(monthAnchorIso);

  // Current Balance: live, moves every time something gets checked off.
  // Only knowable once this month has a starting anchor (a snapshot, or an
  // account to derive one from).
  const currentBalanceForMonth = currentBalanceFor(monthAnchorIso);

  // Expected End of Month: the stable plan, built from EVERY income/expense
  // added for the month regardless of whether it's been checked off yet.
  // This does not change as items get checked off \u2014 only as items are
  // added, edited, or removed.
  const expectedIncomeMonth = sumAmounts(tasksInRange(monthStart, monthEnd, "income"));
  const expectedExpenseMonth = sumAmounts(tasksInRange(monthStart, monthEnd, "expense"));
  const expectedNetMonth = expectedIncomeMonth - expectedExpenseMonth;
  const expectedEndBalance = balanceAtMonthStart != null ? balanceAtMonthStart + expectedNetMonth : null;

  // Checked off so far \u2014 this is what's actually driving Current Balance.
  const actualIncomeMonth = sumAmounts(tasksInRange(monthStart, monthEnd, "income").filter((t) => t.status === "completed"));
  const actualExpenseMonth = sumAmounts(tasksInRange(monthStart, monthEnd, "expense").filter((t) => t.status === "completed"));
  const actualNetMonth = actualIncomeMonth - actualExpenseMonth;

  const remainingItems = tasksInRange(monthStart, monthEnd, "expense").filter((t) => t.status !== "completed")
    .sort((a, b) => a.startDate.localeCompare(b.startDate));
  const remainingTotal = sumAmounts(remainingItems);

  // Safe to Spend is always about *this real month*, independent of the
  // month currently being browsed in the dashboard.
  const curStart = monthStartISO(today), curEnd = monthEndISO(today);
  const currentMonthRemaining = sumAmounts(tasksInRange(curStart, curEnd, "expense").filter((t) => t.status !== "completed"));
  const safeToSpend = bestCurrentBalance() != null ? bestCurrentBalance() - currentMonthRemaining : null;

  // Needs attention / Coming up: always real-time, not month-filtered.
  const unpaid = moneyTasks().filter((t) => t.flowType === "expense" && t.status !== "completed");
  const needsAttention = unpaid.filter((t) => t.startDate <= today).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const comingUp = moneyTasks().filter((t) => t.status !== "completed" && t.startDate > today)
    .sort((a, b) => a.startDate.localeCompare(b.startDate)).slice(0, 6);

  // Checklist: every money task due this month (paid or not). Checking one
  // off here is exactly what moves Current Balance above.
  const checklist = tasksInRange(monthStart, monthEnd).sort((a, b) => a.startDate.localeCompare(b.startDate));
  const checklistDone = checklist.filter((t) => t.status === "completed").length;

  // Recent activity: completed money tasks this month, most recent first.
  const recent = tasksInRange(monthStart, monthEnd).filter((t) => t.status === "completed")
    .sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0)).slice(0, 6);

  // Category snapshot: actual (completed) expense total per category, this month.
  const catTotals = {};
  for (const t of tasksInRange(monthStart, monthEnd, "expense").filter((t) => t.status === "completed")) {
    catTotals[t.categoryId] = (catTotals[t.categoryId] || 0) + Number(t.amount);
  }
  const categorySnapshot = Object.entries(catTotals)
    .map(([catId, total]) => ({ cat: catById(catId), total }))
    .sort((a, b) => b.total - a.total).slice(0, 5);

  // Month-over-month (previous full calendar month), using completed totals only.
  const prevAnchor = addMonthsISO(monthStart, -1);
  const prevMonthStartBalance = balanceAtStartOfMonth(prevAnchor);
  let momCompare = null;
  if (currentBalanceForMonth != null && prevMonthStartBalance != null) {
    const prevStart = monthStartISO(prevAnchor), prevEnd = monthEndISO(prevAnchor);
    const prevIncome = sumAmounts(tasksInRange(prevStart, prevEnd, "income").filter((t) => t.status === "completed"));
    const prevExpense = sumAmounts(tasksInRange(prevStart, prevEnd, "expense").filter((t) => t.status === "completed"));
    momCompare = {
      incomeDelta: actualIncomeMonth - prevIncome,
      expenseDelta: actualExpenseMonth - prevExpense,
      endBalanceDelta: currentBalanceForMonth - prevMonthStartBalance,
    };
  }

  let status = "NEEDS CHECK-IN", statusText = "Enter this month's starting balance to begin tracking.";
  if (!needsCheckIn) {
    if (isFutureMonth) { status = "PROJECTED"; statusText = "This month hasn't started yet \u2014 figures below are a projection based on what's already planned."; }
    else { status = "TRACKING"; statusText = "Current Balance updates as you check items off below."; }
  }

  // The number you actually asked for: what did last month's ending balance
  // turn out to be (the balance you entered starting THIS month) versus what
  // was expected for it (from everything that was added) \u2014 the gap is
  // money that moved outside anything logged here, in either direction.
  const prevExpectedEnd = expectedEndOfMonthFor(prevAnchor);
  const priorMonth = (snapshotThisMonth && prevExpectedEnd != null) ? {
    label: monthLong(prevAnchor),
    actualEnd: balanceAtMonthStart,
    expectedEnd: prevExpectedEnd,
    difference: balanceAtMonthStart - prevExpectedEnd,
  } : null;

  return {
    monthStart, monthEnd, hasAccounts, monthKey, snapshotThisMonth, needsCheckIn, isFutureMonth, isCurrentRealMonth,
    balanceAtMonthStart, currentBalanceForMonth,
    expectedIncomeMonth, expectedExpenseMonth, expectedNetMonth, expectedEndBalance,
    actualIncomeMonth, actualExpenseMonth, actualNetMonth,
    remainingItems, remainingTotal, safeToSpend, currentMonthRemaining,
    needsAttention, comingUp, checklist, checklistDone, recent, categorySnapshot, momCompare,
    status, statusText, priorMonth,
  };
}


// Combined balance shown on the Accounts screen is the same figure as the
// dashboard's Current Balance \u2014 one calculation, not two. Prefers a
// month's entered check-in over the derived total, same as the dashboard.

/* ---------------- SHOPPING ---------------- */
const seenShoppingItemIds = new Set();
const shopEnterUntil = new Map();
function renderShopping() {
  const unchecked = S.shoppingItems.filter((i) => !i.checked).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const checked = S.shoppingItems.filter((i) => i.checked).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const rowHtml = (item) => {
    if (!seenShoppingItemIds.has(item.id)) { seenShoppingItemIds.add(item.id); shopEnterUntil.set(item.id, Date.now() + 600); }
    const isNew = (shopEnterUntil.get(item.id) || 0) > Date.now();
    return '<div class="shop-row ' + (isNew ? "list-item-enter" : "") + '"><button class="check ' + (item.checked ? "done" : "") + (item.checked && isBursting(item.id) ? " burst" : "") + '" data-shop-toggle="' + item.id + '" aria-label="Toggle bought"><svg><use href="#ic-check"/></svg></button>' +
    '<span class="lbl ' + (item.checked ? "done" : "") + '">' + escapeHtml(item.name) + "</span>" +
    '<button class="icon-btn" style="width:28px;height:28px;box-shadow:none;background:none" data-shop-del="' + item.id + '"><svg style="width:15px;height:15px"><use href="#ic-trash"/></svg></button>' +
    "</div>";
  };

  return (
    '<div class="topbar hero-top"><div><div class="kicker">Shopping</div><div class="hero-row"><span class="hero-num">' + unchecked.length + '</span><span class="hero-unit">to buy</span></div></div></div>' +
    '<div style="padding:0 var(--sp-lg)">' +
      '<div style="display:flex;gap:8px;margin-bottom:20px">' +
        '<input type="text" id="shopNewInput" placeholder="What do you need?" style="flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:13px 14px;font-size:16px;color:var(--text)">' +
        '<button class="btn" id="shopAddBtn" style="width:auto;padding:0 20px">Add</button>' +
      "</div>" +
      (unchecked.length === 0 && checked.length === 0
        ? '<div class="empty"><h3>Nothing on the list.</h3><p>Add something above when you think of it.</p></div>'
        : "") +
      (unchecked.length ? '<div class="section-label">TO BUY</div><div class="card">' + unchecked.map(rowHtml).join("") + "</div>" : "") +
      (checked.length ? '<div class="section-label">BOUGHT</div><div class="card">' + checked.map(rowHtml).join("") + '</div><button class="link-btn" id="shopClearBought" style="margin-top:8px">Clear bought</button>' : "") +
    "</div>"
  );
}
function afterShoppingRender() {
  const addFn = async () => {
    const el = document.getElementById("shopNewInput");
    const val = el.value.trim();
    if (!val) return;
    await saveShoppingItem({ id: uid(), name: val, checked: false, createdAt: Date.now() });
    render();
  };
  document.getElementById("shopAddBtn").onclick = addFn;
  document.getElementById("shopNewInput").addEventListener("keydown", (e) => { if (e.key === "Enter") addFn(); });
  document.querySelectorAll("[data-shop-toggle]").forEach((el) => el.onclick = async () => {
    const item = S.shoppingItems.find((i) => i.id === el.getAttribute("data-shop-toggle"));
    item.checked = !item.checked;
    if (item.checked) markBurst(item.id);
    await saveShoppingItem(item);
    render();
  });
  document.querySelectorAll("[data-shop-del]").forEach((el) => el.onclick = async () => {
    await deleteShoppingItemById(el.getAttribute("data-shop-del"));
    render();
  });
  const clearBtn = document.getElementById("shopClearBought");
  if (clearBtn) clearBtn.onclick = async () => {
    const boughtIds = S.shoppingItems.filter((i) => i.checked).map((i) => i.id);
    for (const id of boughtIds) await deleteShoppingItemById(id);
    render();
    showToast("Cleared " + boughtIds.length + " item" + (boughtIds.length === 1 ? "" : "s"));
  };
  setTimeout(() => { const el = document.getElementById("shopNewInput"); if (el) el.focus(); }, 150);
}

/* ---------------- FINANCE DASHBOARD ---------------- */
function renderFinanceDashboard() {
  const anchor = S.financeMonthAnchor;
  const monthLabel = monthLong(anchor) + ' <span class="yr">' + isoToDate(anchor).getFullYear() + "</span>";

  const header =
    '<div class="topbar"><h1>Financial Dashboard</h1></div>' +
    '<div style="padding:0 var(--sp-lg)">' +
    '<div class="cal-nav" style="margin-bottom:16px">' +
      '<button class="icon-btn" id="finPrev"><svg style="transform:rotate(180deg)"><use href="#ic-chevron"/></svg></button>' +
      '<span class="month">' + monthLabel + "</span>" +
      '<button class="icon-btn" id="finNext"><svg><use href="#ic-chevron"/></svg></button>' +
    "</div>";

  const snap = computeFinanceSnapshot(anchor);
  let html = header;

  // ---- Monthly check-in: a start-of-month anchor, asked once per month.
  // This is NOT a running balance you edit whenever \u2014 it's the fixed
  // starting point; Current Balance moves on its own as you check things off.
  if (snap.needsCheckIn) {
    html += '<div class="card" style="padding:20px;margin-bottom:16px">' +
      '<h3 style="margin:0 0 4px">What\u2019s your balance at the start of ' + monthLong(anchor) + "?</h3>" +
      '<p style="color:var(--text2);margin:0 0 12px">Check your account(s) and enter the total. From here, Current Balance below updates automatically as you check things off \u2014 you won\u2019t need to re-enter it until next month.</p>' +
      '<div style="display:flex;gap:8px">' +
        '<input type="number" inputmode="decimal" step="0.01" id="finCheckinAmount" placeholder="0.00" style="flex:1">' +
        '<button class="btn" id="finCheckinSave" style="width:auto;padding:0 20px">Save</button>' +
      "</div></div>";
  }

  // ---- Hero: Current Balance (live) and Expected End of Month (the stable plan) ----
  // Skip this card entirely when the check-in form above already asks for
  // exactly the same missing thing — showing both is redundant.
  if (snap.currentBalanceForMonth == null && !snap.needsCheckIn) {
    const futureMsg = snap.expectedEndBalance != null
      ? "Projected end of month: " + fmtMoney(snap.expectedEndBalance)
      : "We need a starting balance for an earlier month first \u2014 enter one from Accounts, or wait until this month starts.";
    html += '<div class="card" style="padding:20px;margin-bottom:16px">' +
      '<h3 style="margin:0 0 4px">' + (snap.isFutureMonth ? "Projected balance" : "No balance recorded for " + monthLong(anchor)) + "</h3>" +
      '<p style="color:var(--text2);margin:0">' + (snap.isFutureMonth ? futureMsg : "This month is in the past and has no starting balance on file.") + "</p>" +
    "</div>";
  } else if (snap.currentBalanceForMonth != null) {
    html += '<div class="card fin-hero">' +
      '<div class="fin-hero-main">' +
        '<div class="fin-label">CURRENT BALANCE</div>' +
        '<div class="fin-big" data-countup="' + snap.currentBalanceForMonth + '">' + fmtMoney(snap.currentBalanceForMonth) + "</div>" +
      "</div>" +
      '<div class="fin-hero-sub">' +
        '<div><span class="fin-label">EXPECTED END OF ' + monthLong(anchor).toUpperCase() + '</span><span class="fin-mid" data-countup="' + snap.expectedEndBalance + '">' + fmtMoney(snap.expectedEndBalance) + "</span></div>" +
      "</div>" +
      '<p class="fin-status-text">' + escapeHtml(snap.statusText) + "</p>" +
      '<button class="link-btn" id="finEditBalance" style="margin-top:4px">' + (snap.snapshotThisMonth ? "Edit this month\u2019s starting balance" : "Manage accounts") + "</button>" +
    "</div>";
  }

  // ---- Last month: the number you actually asked for \u2014 how much moved
  // outside anything logged here (spent freely, or extra income), in either direction ----
  if (snap.priorMonth) {
    const pm = snap.priorMonth;
    const freeText = Math.abs(pm.difference) < 1
      ? "Right on plan \u2014 no unplanned spending or income."
      : (pm.difference < 0
          ? "You spent " + fmtMoney(Math.abs(pm.difference)) + " outside your planned expenses."
          : "You ended up with " + fmtMoney(pm.difference) + " more than planned \u2014 from unlogged income or lighter spending.");
    html += '<div class="card" style="margin-top:12px">' +
      '<div class="fin-label">' + pm.label.toUpperCase() + ": FREE SPENDING</div>" +
      '<div class="list-row"><span class="lbl">Expected end of ' + pm.label + '</span><span class="val">' + fmtMoney(pm.expectedEnd) + "</span></div>" +
      '<div class="list-row"><span class="lbl">What you started this month with</span><span class="val">' + fmtMoney(pm.actualEnd) + "</span></div>" +
      '<div class="list-row"><span class="lbl" style="font-weight:700">Difference</span><span class="val ' + (pm.difference < 0 ? "expense" : "income") + '" style="font-weight:700">' + fmtMoneySigned(pm.difference) + "</span></div>" +
      '<p style="color:var(--text2);font-size:13px;margin:8px 0 0">' + freeText + "</p>" +
    "</div>";
  }

  html += '<div class="card" style="margin-top:12px">' +
    '<div class="fin-label">SAFE TO SPEND</div>' +
    (snap.safeToSpend != null
      ? '<div class="fin-big" style="margin:4px 0" data-countup="' + snap.safeToSpend + '">' + fmtMoney(snap.safeToSpend) + "</div><p style=\"color:var(--text2);margin:0\">After remaining commitments this month" + (snap.currentMonthRemaining ? " (" + fmtMoney(snap.currentMonthRemaining) + " left to pay)" : "") + "</p>"
      : '<p style="color:var(--text2);margin:4px 0 0">Enter this month\u2019s starting balance to see what\u2019s safe to spend.</p>') +
  "</div>";

  html += '<div class="section-label">' + monthLong(anchor).toUpperCase() + " CHECKLIST</div>";
  if (snap.checklist.length === 0) {
    html += '<div class="card"><p style="color:var(--text2);margin:0">No financial items this month.</p></div>';
  } else {
    html += '<p style="color:var(--text2);font-size:13px;margin:-4px 0 8px">' + snap.checklistDone + " / " + snap.checklist.length + " completed \u2014 checking one off updates Current Balance above</p>" +
      '<div class="card">' + snap.checklist.map(taskRowHtml).join("") + "</div>";
  }

  // ---- Transparency: what's driving each number above, with no judgment attached ----
  html += '<div class="section-label">HOW THESE NUMBERS ARE MADE UP</div>';
  html += '<div class="card">' +
    '<div class="list-row"><span class="lbl" style="font-weight:700">This month\u2019s plan</span><span class="val" style="color:var(--text2)">everything added</span></div>' +
    '<div class="list-row"><span class="lbl">Income</span><span class="val">' + fmtMoney(snap.expectedIncomeMonth) + "</span></div>" +
    '<div class="list-row"><span class="lbl">Expenses</span><span class="val">' + fmtMoney(snap.expectedExpenseMonth) + "</span></div>" +
    '<div class="list-row"><span class="lbl" style="font-weight:700">\u2192 Expected end of month</span><span class="val" style="font-weight:700">' + (snap.expectedEndBalance != null ? fmtMoney(snap.expectedEndBalance) : "\u2014") + "</span></div>" +
  "</div>" +
  '<div class="card" style="margin-top:8px">' +
    '<div class="list-row"><span class="lbl" style="font-weight:700">Checked off so far</span><span class="val" style="color:var(--text2)">drives Current Balance</span></div>' +
    '<div class="list-row"><span class="lbl">Income</span><span class="val">' + fmtMoney(snap.actualIncomeMonth) + "</span></div>" +
    '<div class="list-row"><span class="lbl">Expenses</span><span class="val">' + fmtMoney(snap.actualExpenseMonth) + "</span></div>" +
  "</div>";

  html += '<div class="section-label">RECENT ACTIVITY</div>';
  html += snap.recent.length === 0
    ? '<div class="card"><p style="color:var(--text2);margin:0">Nothing completed yet this month.</p></div>'
    : '<div class="card">' + snap.recent.map(taskRowHtml).join("") + '</div><button class="link-btn" id="finViewAll" style="margin-top:8px">View All</button>';

  html += '<div class="section-label">WHERE YOUR MONEY WENT</div>';
  if (snap.categorySnapshot.length === 0) {
    html += '<div class="card"><p style="color:var(--text2);margin:0">No completed expenses yet this month.</p></div>';
  } else {
    const max = Math.max(...snap.categorySnapshot.map((c) => c.total));
    html += '<div class="card">' + snap.categorySnapshot.map((c) =>
      '<div class="cat-snap-row"><div class="cat-snap-top"><span class="dot ' + c.cat.color + '"></span><span class="lbl">' + escapeHtml(c.cat.name) + '</span><span class="val">' + fmtMoney(c.total) + "</span></div>" +
      '<div class="cat-snap-bar-bg"><div class="cat-snap-bar" style="width:' + Math.round((c.total / max) * 100) + "%;background:var(--" + c.cat.color + ')"></div></div></div>'
    ).join("") + "</div>";
  }

  if (snap.momCompare) {
    const prevLabel = monthLong(addMonthsISO(snap.monthStart, -1));
    html += '<div class="section-label">COMPARED WITH ' + prevLabel.toUpperCase() + "</div>" +
      '<div class="card">' +
        '<div class="list-row"><span class="lbl">Expenses</span><span class="val ' + (snap.momCompare.expenseDelta > 0 ? "expense" : "income") + '">' + fmtMoneySigned(snap.momCompare.expenseDelta) + "</span></div>" +
        '<div class="list-row"><span class="lbl">Income</span><span class="val ' + (snap.momCompare.incomeDelta < 0 ? "expense" : "income") + '">' + fmtMoneySigned(snap.momCompare.incomeDelta) + "</span></div>" +
        '<div class="list-row"><span class="lbl">Ending balance</span><span class="val ' + (snap.momCompare.endBalanceDelta < 0 ? "expense" : "income") + '">' + fmtMoneySigned(snap.momCompare.endBalanceDelta) + "</span></div>" +
      "</div>";
  }

  html += "</div>";
  return html;
}

// Dedicated entry point for expenses/income, separate from the general task
// composer — this is the one place money items get created.
function openFinanceComposer() {
  const moneyCats = S.categories.filter((c) => c.tracksMoney);
  const draft = newTaskSkeleton();
  draft.categoryId = (moneyCats.find((c) => c.id === "finance") || moneyCats[0] || S.categories[0]).id;
  draft.flowType = "expense";
  draft.showOnCalendar = false; // opt-in: finance entries don't clutter the calendar unless asked
  let markPaid = false;

  const render_ = () => {
    if (moneyCats.length === 0) {
      openSheet(
        '<div class="sheet-head"><span class="title">Add expense or income</span><button class="icon-btn" id="closeSheetBtn"><svg><use href="#ic-close"/></svg></button></div>' +
        '<div class="sheet-body"><p style="color:var(--text2)">No categories are set up to track money yet. Turn "Tracks money" on for a category first, in More \u2192 Categories.</p></div>'
      );
      document.getElementById("closeSheetBtn").onclick = closeSheet;
      return;
    }
    const catChips = moneyCats.map((c) =>
      '<button class="chip ' + (draft.categoryId === c.id ? "cat-active" : "") + '" style="' +
      (draft.categoryId === c.id ? "background:var(--" + c.color + ")" : "") + '" data-fin-cat="' + c.id + '">' +
      (draft.categoryId === c.id ? "" : '<span class="dot ' + c.color + '"></span>') + escapeHtml(c.name) + "</button>"
    ).join("");
    const personChips = ["sergio", "rita", "both"].map((p) =>
      '<button class="chip ' + (draft.assignedTo === p ? "active" : "") + '" data-fin-person="' + p + '">' + personLabel(p) + "</button>"
    ).join("");
    const recChips = [["none","None"],["daily","Daily"],["weekly","Weekly"],["monthly","Monthly"],["yearly","Yearly"]].map(([k,l]) =>
      '<button class="chip ' + ((draft.recurrence.frequency||"none") === k ? "active" : "") + '" data-fin-recur="' + k + '">' + l + "</button>"
    ).join("");

    openSheet(
      '<div class="sheet-head"><span class="title">Add expense or income</span><button class="icon-btn" id="closeSheetBtn"><svg><use href="#ic-close"/></svg></button></div>' +
      '<div class="sheet-body">' +
        '<div class="chip-row" style="margin-bottom:14px">' +
          '<button class="chip ' + (draft.flowType === "expense" ? "active" : "") + '" data-fin-flow="expense">Expense</button>' +
          '<button class="chip ' + (draft.flowType === "income" ? "active" : "") + '" data-fin-flow="income">Income</button>' +
        "</div>" +
        '<input class="title-input" id="finTitle" placeholder="What\u2019s it for?" value="' + escapeHtml(draft.title) + '">' +
        '<div class="field"><label>AMOUNT</label><input type="number" inputmode="decimal" step="0.01" min="0" id="finAmount" placeholder="0.00" value="' + (draft.amount != null ? draft.amount : "") + '"></div>' +
        '<div class="field"><label>DATE</label><input type="date" id="finDate" value="' + draft.startDate + '"></div>' +
        '<div class="field"><label>CATEGORY</label><div class="chip-row">' + catChips + "</div></div>" +
        '<div class="field"><label>ASSIGNED TO</label><div class="chip-row">' + personChips + "</div></div>" +
        '<div class="field"><label>REPEATS</label><div class="chip-row">' + recChips + "</div></div>" +
        '<div class="field"><label class="check-label"><input type="checkbox" id="finPaid" ' + (markPaid ? "checked" : "") + '> ' + (draft.flowType === "income" ? "Already received" : "Already paid") + "</label></div>" +
        '<div class="field"><label class="check-label"><input type="checkbox" id="finShowCal" ' + (draft.showOnCalendar ? "checked" : "") + '> Also show in Today, Tasks \u0026 Calendar</label></div>' +
        '<button class="btn" id="finSave">Add ' + (draft.flowType === "income" ? "Income" : "Expense") + "</button>" +
      "</div>"
    );

    document.getElementById("closeSheetBtn").onclick = closeSheet;
    document.getElementById("finTitle").oninput = (e) => { draft.title = e.target.value; };
    document.getElementById("finAmount").oninput = (e) => { draft.amount = e.target.value === "" ? null : Number(e.target.value); };
    document.getElementById("finDate").onchange = (e) => { draft.startDate = e.target.value; };
    document.getElementById("finPaid").onchange = (e) => { markPaid = e.target.checked; };
    document.getElementById("finShowCal").onchange = (e) => { draft.showOnCalendar = e.target.checked; };
    document.querySelectorAll("[data-fin-flow]").forEach((el) => el.onclick = () => { draft.flowType = el.getAttribute("data-fin-flow"); render_(); });
    document.querySelectorAll("[data-fin-cat]").forEach((el) => el.onclick = () => { draft.categoryId = el.getAttribute("data-fin-cat"); render_(); });
    document.querySelectorAll("[data-fin-person]").forEach((el) => el.onclick = () => { draft.assignedTo = el.getAttribute("data-fin-person"); render_(); });
    document.querySelectorAll("[data-fin-recur]").forEach((el) => el.onclick = () => { draft.recurrence = { frequency: el.getAttribute("data-fin-recur") }; render_(); });
    document.getElementById("finSave").onclick = async () => {
      const titleVal = document.getElementById("finTitle").value.trim();
      if (!titleVal) { showToast("Give it a short description first."); return; }
      if (draft.amount == null || draft.amount <= 0) { showToast("Enter an amount."); return; }
      draft.title = titleVal;
      draft.startDate = document.getElementById("finDate").value || todayISO();
      draft.priority = "normal";
      draft.status = markPaid ? "completed" : "upcoming";
      draft.completedAt = markPaid ? Date.now() : null;
      await createTaskWithRecurrence(draft);
      closeSheet();
      render();
      showToast((draft.flowType === "income" ? "Income" : "Expense") + " added");
    };
    setTimeout(() => { const el = document.getElementById("finTitle"); if (el) el.focus(); }, 150);
  };
  render_();
}

/* ---------------- EXPORT / IMPORT ---------------- */
function exportData() {
  const payload = {
    exportedAt: new Date().toISOString(),
    version: 1,
    settings: S.settings,
    categories: S.categories,
    tasks: S.tasks.map((t) => Object.assign({}, t, {
      attachments: t.attachments.map((a) => ({ id: a.id, fileName: a.fileName, fileType: a.fileType, fileSize: a.fileSize })),
    })),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "together-backup-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  showToast("Backup downloaded");
}

function importData(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch (e) { showToast("That file doesn\u2019t look like a valid backup."); return; }
    if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.categories) || !data.settings) {
      showToast("That file doesn\u2019t look like a valid backup.");
      return;
    }
    openSheet(
      '<div class="sheet-body" style="padding-top:20px">' +
      '<h3 style="margin:0 0 8px">Import this backup?</h3>' +
      '<p style="color:var(--text2);font-size:15px;margin:0 0 20px">This will replace your current tasks and categories with the ' + data.tasks.length + " tasks in this file. Note: file attachments are not restored from JSON backups, only their names.</p>" +
      '<div class="btn-row"><button class="btn ghost" id="cancelImp">Cancel</button><button class="btn" id="confirmImp">Import</button></div>' +
      "</div>"
    );
    document.getElementById("cancelImp").onclick = closeSheet;
    document.getElementById("confirmImp").onclick = async () => {
      await idbClear("tasks");
      await idbClear("categories");
      for (const c of data.categories) await idbPut("categories", c);
      for (const t of data.tasks) await idbPut("tasks", Object.assign({ attachments: [] }, t, { attachments: [] }));
      S.settings.names = data.settings.names || S.settings.names;
      await saveSettings();
      await loadAll();
      closeSheet();
      navigate("#/today");
      render();
      showToast("Backup imported");
    };
  };
  reader.readAsText(file);
  ev.target.value = "";
}

/* ---------------- Reminders & daily briefing (foreground-only, honestly) ---------------- */
function notifyOrToast(title, body) {
  if (typeof Notification !== "undefined" && Notification.permission === "granted") {
    try { new Notification(title, { body, icon: "icon-192.png" }); return; } catch (e) {}
  }
  showToast(title + (body ? " \u2014 " + body : ""));
}

function checkReminders() {
  if (!S.settings || !S.settings.notifications.reminders) return;
  const now = new Date();
  for (const t of S.tasks) {
    if (t.status === "completed" || !t.startDate || t.allDay || !t.startTime) continue;
    const [h, m] = t.startTime.split(":").map(Number);
    const taskDate = isoToDate(t.startDate);
    taskDate.setHours(h, m, 0, 0);
    for (const r of t.reminders) {
      const fireAt = new Date(taskDate.getTime() - r.minutesBefore * 60000);
      const key = t.id + ":" + r.minutesBefore;
      if (!S.notifiedKeys.has(key) && now >= fireAt && now.getTime() - fireAt.getTime() < 5 * 60000) {
        S.notifiedKeys.add(key);
        notifyOrToast(t.title, r.minutesBefore === 0 ? "Starting now" : "In " + r.minutesBefore + " minutes");
      }
    }
  }
}

function checkDailyBriefing() {
  if (!S.settings || !S.settings.notifications.daily) return;
  const now = new Date();
  const today = todayISO();
  if (S.settings.lastBriefingDate === today) return;
  if (now.getHours() < 9) return;
  const tasks = activeTasksForDate(today).filter((t) => t.status !== "completed");
  let body;
  if (!tasks.length) {
    body = "Nothing planned today.";
  } else {
    const lines = tasks.slice(0, 4).map((t) => (t.allDay ? "All day" : t.startTime) + " \u2014 " + t.title);
    body = lines.join("\n") + "\n\n" + tasks.length + (tasks.length === 1 ? " thing today." : " things today.");
  }
  notifyOrToast("Good morning " + S.settings.names.sergio + " & " + S.settings.names.rita, body);
  S.settings.lastBriefingDate = today;
  saveSettings();
}

async function init() {
  if (__initStarted) return;
  __initStarted = true;
  try {
    dbInstance = await openDB();
    let settingsRow = await idbGet("settings", "app");
    if (!settingsRow) {
      settingsRow = {
        key: "app",
        onboarded: false,
        names: { sergio: "Sérgio", rita: "Rita" },
        notifications: { daily: false, reminders: false, permission: "default" },
        lastBriefingDate: null,
        theme: "light",
        googleClientId: KNOWN_GOOGLE_CLIENT_ID,
        googleCalendarConnected: false,
        googleCalendarLastSync: null,
      };
      await idbPut("settings", settingsRow);
    }
    if (!settingsRow.theme) settingsRow.theme = "light"; // migrate existing installs
    if (settingsRow.googleClientId === undefined) settingsRow.googleClientId = "";
    if (settingsRow.googleCalendarConnected === undefined) settingsRow.googleCalendarConnected = false;
    if (settingsRow.googleCalendarLastSync === undefined) settingsRow.googleCalendarLastSync = null;
    // One-time backfill for the install this Client ID was created for \u2014
    // it already has an empty string on file from before the ID existed.
    if (!settingsRow.googleClientId && !settingsRow.googleClientIdSeeded) {
      settingsRow.googleClientId = KNOWN_GOOGLE_CLIENT_ID;
      settingsRow.googleClientIdSeeded = true;
      await idbPut("settings", settingsRow);
    }
    S.settings = settingsRow;
    applyTheme(S.settings.theme);

    await loadAll();
    if (S.categories.length === 0) {
      // Fresh device: show the defaults immediately, but keep them in memory
      // only. The migration step uploads them only if the shared household
      // has no categories yet, so a new phone can never overwrite edits.
      S.categories = DEFAULT_CATEGORIES.map((c) => Object.assign({}, c));
    }

    render(); // instant first paint from local data, same as always

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }

    setInterval(() => { checkReminders(); checkDailyBriefing(); }, 30000);
    checkReminders();
    checkDailyBriefing();

    // Connect to the shared household in the background \u2014 doesn't block the
    // first paint above. Once connected: push this device's local data up
    // once (safe/idempotent even if it happens on both phones), then start
    // listening for live changes from Rita's (or any) device.
    (async () => {
      await waitForFirebaseReady();
      if (!fsReady()) {
        console.error("Firebase unavailable \u2014 continuing locally only, not shared.", window.__firebaseInitError);
        return;
      }
      try {
        await window.__firebase.signIn();
        await migrateLocalDataToFirestoreIfNeeded();
        startFirestoreListeners();
      } catch (e) {
        console.error("Firebase startup failed:", e);
        showErrorBanner("Couldn\u2019t connect to the shared household right now \u2014 working from this device\u2019s local data for now.");
      }
    })();

    // Try to silently pick back up a Google Calendar connection from a
    // previous session \u2014 no popup unless the browser's Google session has
    // actually expired, in which case the person just reconnects from More.
    if (S.settings.googleClientId && S.settings.googleCalendarConnected) {
      setTimeout(() => { attemptSilentGoogleReconnect(); }, 800);
    }
  } catch (err) {
    console.error(err);
    document.getElementById("view").innerHTML =
      '<div class="onb-wrap"><h1>Together couldn\u2019t start</h1>' +
      '<p class="tag">' + (err && err.message ? err.message : "Local storage isn\u2019t available in this browser or context.") + '</p>' +
      '<p class="tag">Try opening this page in a normal browser tab (not a preview or sandbox), using Safari or Chrome directly.</p></div>';
  }
}
